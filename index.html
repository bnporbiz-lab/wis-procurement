// Collect every fileId referenced anywhere in the DB (so backups can include the actual files)
function collectFileIds(){
  const ids=new Set();
  const scan=v=>{
    if(!v||typeof v!=="object")return;
    if(Array.isArray(v)){ v.forEach(scan); return; }
    if(v.fileId) ids.add(v.fileId);
    for(const k in v){ if(k==="data")continue; scan(v[k]); }
  };
  scan(DB);
  return [...ids];
}
async function buildBackupObject(){
  const ids=collectFileIds(); const files={};
  for(const id of ids){ const d=await idbGet(id); if(d) files[id]=d; }
  return Object.assign({}, DB, {__files:files, __backupVersion:2});
}
async function exportJSON(){
  toast("Preparing backup","Gathering attachments…","ok");
  try{
    const obj=await buildBackupObject();
    const blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`pmpts-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    const n=Object.keys(obj.__files||{}).length;
    toast("Backup exported", n?("JSON + "+n+" attachment(s) included"):"JSON downloaded","ok");
  }catch(e){ console.error(e); toast("Backup failed","Could not build backup","err"); }
}
function importJSON(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=e=>{ try{
    const data=JSON.parse(e.target.result);
    if(!data||typeof data!=="object"||Array.isArray(data)){ toast("Invalid backup","File is not a valid backup","err"); return; }
    confirmModal("Restore backup?","Current data will be replaced with the imported file.",async ()=>{
      const embeddedFiles=data.__files||{};
      delete data.__files; delete data.__backupVersion;
      DB=data; const d=defaultDB(); for(const k in d){ if(DB[k]===undefined||DB[k]===null)DB[k]=d[k]; }
      ["procurement","projects","maintenance","suppliers","budget"].forEach(k=>{ if(!Array.isArray(DB[k]))DB[k]=[]; });
      if(!Array.isArray(DB.users)||!DB.users.length)DB.users=d.users;
      if(!DB.users.some(u=>u.role==="superadmin"))DB.users.unshift(d.users[0]);
      // restore attachment blobs into IndexedDB
      let restored=0;
      for(const id in embeddedFiles){ try{ await idbPut(id,embeddedFiles[id]); restored++; }catch(err){} }
      saveDB(); buildNav(); navigate("dashboard");
      toast("Backup restored", restored?("Data + "+restored+" attachment(s) imported"):"Data imported successfully","ok");
    },"Restore",false);
  }catch(err){ toast("Invalid file","Could not parse JSON","err"); } };
  reader.readAsText(f); input.value="";
}
function exportExcel(){
  const wb=XLSX.utils.book_new();
  const flat=r=>({Name:r.name,Campus:r.campus,Category:r.category,PR:r.pr,Quote:r.quote,PO:r.po,Supplier:r.supplier,Budget:r.budget,Status:r.status,Due:r.due,Confirmation:r.confirm,Deposit:r.deposit,DepositINV:r.depositInv,FinalPayment:r.finalPay,FinalINV:r.finalInv,Remarks:r.remarks});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.procurement.map(flat)),"Procurement");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.projects.map(flat)),"Projects");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.maintenance.map(flat)),"Maintenance");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.suppliers.map(s=>({Name:s.name,Contact:s.contact,Email:s.email,Phone:s.phone,Country:s.country}))),"Suppliers");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.budget.map(b=>({Campus:b.campus,Year:b.year,Amount:b.amount,Note:b.note}))),"Budget");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.po.map(p=>({PO_Number:p.poNo,Supplier:p.supplier,Campus:p.campus,PR:p.pr,Status:p.status,OrderDate:p.orderDate,Delivery:p.delivery,Amount:p.amount}))),"PurchaseOrders");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.stock.map(s=>({Name:s.name,SKU:s.sku,Category:s.category,Location:s.location,Qty:s.qty,Unit:s.unit,Reorder:s.reorder,UnitCost:s.unitCost}))),"Stock");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.uniform.map(u=>({Period:u.period,Outlet:u.outlet,BB:Number(u.bb)||0,MoveIn:uniformSum(u,"moveIn"),MoveIn_Entries:uniformArr(u,"moveIn").join(", "),AdjustIn:uniformSum(u,"adjustIn"),AdjustIn_Entries:uniformArr(u,"adjustIn").join(", "),MoveOut:uniformSum(u,"moveOut"),MoveOut_Entries:uniformArr(u,"moveOut").join(", "),SoldOut:uniformSum(u,"soldOut"),SoldOut_Entries:uniformArr(u,"soldOut").join(", "),Free:uniformSum(u,"free"),Free_Entries:uniformArr(u,"free").join(", "),Broken:uniformSum(u,"broken"),Broken_Entries:uniformArr(u,"broken").join(", "),AdjustOut:uniformSum(u,"adjustOut"),AdjustOut_Entries:uniformArr(u,"adjustOut").join(", "),EB:uniformEB(u),Remark:u.remark}))),"UniformStock");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.gepUniform.map(u=>({Period:u.period,Outlet:u.outlet,BB:Number(u.bb)||0,MoveIn:uniformSum(u,"moveIn"),MoveIn_Entries:uniformArr(u,"moveIn").join(", "),AdjustIn:uniformSum(u,"adjustIn"),AdjustIn_Entries:uniformArr(u,"adjustIn").join(", "),MoveOut:uniformSum(u,"moveOut"),MoveOut_Entries:uniformArr(u,"moveOut").join(", "),SoldOut:uniformSum(u,"soldOut"),SoldOut_Entries:uniformArr(u,"soldOut").join(", "),Free:uniformSum(u,"free"),Free_Entries:uniformArr(u,"free").join(", "),Broken:uniformSum(u,"broken"),Broken_Entries:uniformArr(u,"broken").join(", "),AdjustOut:uniformSum(u,"adjustOut"),AdjustOut_Entries:uniformArr(u,"adjustOut").join(", "),EB:uniformEB(u),Remark:u.remark}))),"GEP_Uniform");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.construction.map(p=>({Name:p.name,Code:p.code,Location:p.location,Type:p.type,PM:p.pm,Contractor:p.contractor,Consultant:p.consultant,ContractAmount:p.contractAmount,ApprovedBudget:p.approvedBudget,StartDate:p.startDate,PlannedEnd:p.plannedEnd,ActualEnd:p.actualEnd,Progress:p.progress,PlannedProgress:p.plannedProgress,Status:p.status,Stage:p.stage,Priority:p.priority,Description:p.description}))),"Construction");
  XLSX.writeFile(wb,`pmpts-backup-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast("Excel exported","Workbook downloaded","ok");
}
function importExcel(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    const read=name=>wb.Sheets[name]?XLSX.utils.sheet_to_json(wb.Sheets[name]):[];
    const map=row=>({id:uid(),name:row.Name||"",campus:row.Campus||CAMPUSES[0],category:row.Category||"",pr:row.PR||"",quote:row.Quote||"",po:row.PO||"",supplier:row.Supplier||"",budget:Number(row.Budget)||0,status:STATUSES.includes(row.Status)?row.Status:"To Do",due:row.Due||"",confirm:row.Confirmation||"",remarks:row.Remarks||"",files:[],created:Date.now()});
    confirmModal("Import Excel?","Records from the workbook will be added to current data.",()=>{
      DB.procurement.push(...read("Procurement").map(map));
      DB.projects.push(...read("Projects").map(map));
      DB.maintenance.push(...read("Maintenance").map(map));
      read("Suppliers").forEach(s=>DB.suppliers.push({id:uid(),name:s.Name||"",contact:s.Contact||"",email:s.Email||"",phone:s.Phone||"",country:s.Country||"",files:[],created:Date.now()}));
      read("Budget").forEach(b=>DB.budget.push({id:uid(),campus:b.Campus||CAMPUSES[0],year:b.Year||"",amount:Number(b.Amount)||0,note:b.Note||""}));
      saveDB(); buildNav(); navigate("dashboard"); toast("Excel imported","Records added","ok");
    },"Import",false);
  }catch(err){ toast("Import failed","Could not read workbook","err"); } };
  reader.readAsArrayBuffer(f); input.value="";
}

/* Telegram */
function backupTelegramChoice(){
  openModal(`<div class="modal-head"><h3>Send Backup</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><p class="muted" style="margin-bottom:14px">Choose how to handle this backup:</p>
    <div class="radio-group">
      <div class="radio-opt sel" onclick="selRadio(this,'telegram')"><input type="radio" name="bk" checked><div><div style="font-weight:600">Send to Telegram channel</div><div style="font-size:12px;color:var(--text-dim)">Upload backup to the configured channel.</div></div></div>
      <div class="radio-opt" onclick="selRadio(this,'download')"><input type="radio" name="bk"><div><div style="font-weight:600">Download only</div><div style="font-size:12px;color:var(--text-dim)">Save the JSON file to this device.</div></div></div>
      <div class="radio-opt" onclick="selRadio(this,'both')"><input type="radio" name="bk"><div><div style="font-weight:600">Send and download</div><div style="font-size:12px;color:var(--text-dim)">Do both at once.</div></div></div>
    </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="execBackupChoice()">Continue</button></div>`,{size:"narrow"});
  window._bkChoice="telegram";
}
function selRadio(el,val){ el.parentElement.querySelectorAll(".radio-opt").forEach(o=>o.classList.remove("sel")); el.classList.add("sel"); el.querySelector("input").checked=true; window._bkChoice=val; }
function execBackupChoice(){
  const c=window._bkChoice; closeModal();
  if(c==="download"||c==="both") exportJSON();
  if(c==="telegram"||c==="both") sendToTelegram(backupBlob(),`pmpts-backup-${Date.now()}.json`,"📦 System backup");
}
async function sendToTelegram(blob,filename,caption){
  if(!TELEGRAM_BOT_TOKEN||TELEGRAM_BOT_TOKEN.startsWith("YOUR_")||!TELEGRAM_CHAT_ID||TELEGRAM_CHAT_ID.startsWith("YOUR_")){
    toast("Telegram not configured","Set bot token & chat ID in the source","warn"); return false;
  }
  toast("Sending to Telegram...","Uploading "+filename,"ok");
  try{
    const fd=new FormData();
    fd.append("chat_id",TELEGRAM_CHAT_ID);
    if(caption) fd.append("caption",caption);
    // Ensure we send a real File so Telegram accepts the document
    const file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    fd.append("document",file,filename);
    const url=`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`;
    const res=await fetch(url,{method:"POST",body:fd});
    let j=null; try{ j=await res.json(); }catch(_){}
    console.log("Telegram sendDocument response:",res.status,j);
    if(res.ok && j && j.ok){ toast("Sent to Telegram","File delivered to the channel","ok"); return true; }
    const reason=(j&&j.description)?j.description:("HTTP "+res.status);
    toast("Telegram rejected the file",reason,"err");
    console.error("Telegram error detail:",j);
    return false;
  }catch(e){
    console.error("Telegram fetch failed:",e);
    // Most common when opened via file:// or blocked by an extension/network
    toast("Could not reach Telegram",(e.message||"Network/CORS error")+" — see console","err");
    return false;
  }
}
async function testTelegram(){
  if(!TELEGRAM_BOT_TOKEN||TELEGRAM_BOT_TOKEN.startsWith("YOUR_")){ toast("Telegram not configured","","warn"); return; }
  toast("Testing connection...","Checking bot & channel","ok");
  try{
    const me=await (await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe`)).json();
    console.log("getMe:",me);
    if(!me.ok){ toast("Bot token invalid",me.description||"getMe failed","err"); return; }
    const msg=await (await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:"✅ Connection test from Procurement Management System"})
    })).json();
    console.log("sendMessage:",msg);
    if(msg.ok) toast("Telegram connected","Bot @"+me.result.username+" can post to the channel","ok");
    else toast("Cannot post to channel",msg.description||"Check chat ID & that the bot is an admin","err");
  }catch(e){ console.error(e); toast("Could not reach Telegram",(e.message||"Network/CORS")+" — see console","err"); }
}
function sendReportTelegram(){
  const d=getReportData();
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  doc.setFontSize(14); doc.text((DB.settings.orgName||"Report"),40,40);
  doc.autoTable({startY:60,head:[["Item","Campus","Budget","Status"]],body:d.recs.map(r=>[r.name,r.campus||"—",money(r.budget),r.status])});
  const blob=doc.output("blob"); sendToTelegram(blob,`report-${Date.now()}.pdf`,"📄 Procurement Report");
}

/* ============================================================
   INIT
============================================================ */
(function init(){
  function boot(){
    applyTheme(localStorage.getItem(THEME_KEY)||"light");
    loadDB();
    // Final safety net: DB must be a valid object with array collections
    if(!DB || typeof DB!=="object"){ DB=defaultDB(); saveDB(); }
    // One-time correction: data was entered for May 2026 but saved under June 2026.
    // Move June 2026 -> May 2026 for both uniform datasets, only if May is empty.
    try{
      if(!localStorage.getItem("uniformJun2026Fix")){
        let moved=0;
        ["uniform","gepUniform"].forEach(col=>{
          if(!Array.isArray(DB[col]))return;
          const hasMay=DB[col].some(r=>r.period==="2026-05");
          if(!hasMay){ DB[col].forEach(r=>{ if(r.period==="2026-06"){ r.period="2026-05"; moved++; } }); }
        });
        if(moved>0) saveDB();
        localStorage.setItem("uniformJun2026Fix","1");
      }
    }catch(e){ console.warn("uniform month fix skipped",e); }
    try{ seedProcLists(); }catch(e){ console.warn("proc list seed skipped",e); }
    // Move any legacy inline attachment blobs out of localStorage into IndexedDB (frees space, fixes large-file saves)
    try{ migrateInlineFilesToIDB().catch(()=>{}); }catch(e){ console.warn("file migration skipped",e); }
    // Back-fill PO numbers onto records whose PO already exists (match by PR or Quote number)
    try{ backfillProcPONumbers(false); }catch(e){ console.warn("PO backfill skipped",e); }
    const sess=localStorage.getItem(SESSION_KEY);
    if(sess){ try{ SESSION=JSON.parse(sess); if(SESSION && DB.users.some(u=>u.id===SESSION.id)) enterApp(); else localStorage.removeItem(SESSION_KEY); }catch(e){ localStorage.removeItem(SESSION_KEY); } }
    document.getElementById("loginPass").addEventListener("keydown",e=>{ if(e.key==="Enter")doLogin(); });
    document.getElementById("loginUser").addEventListener("keydown",e=>{ if(e.key==="Enter")document.getElementById("loginPass").focus(); });
  }
  try{ boot(); }
  catch(err){
    // Corrupt localStorage from a previous version — wipe app keys and retry once
    console.warn("Init failed, clearing stored data and retrying:",err);
    try{ localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
    DB=defaultDB(); SESSION=null;
    try{ boot(); }catch(e2){ console.error("Boot failed after reset:",e2); }
  }
})();
</script>
