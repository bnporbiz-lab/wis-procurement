<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Management &amp; Project Tracking System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f7; --border:#e3e7ee;
  --text:#1f2733; --text-dim:#697586; --primary:#5b5fef; --primary-soft:#eceefe;
  --accent:#13b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  --sidebar:#ffffff; --sidebar-text:#414b5a; --shadow:0 1px 3px rgba(20,30,55,.08),0 1px 2px rgba(20,30,55,.04);
  --shadow-lg:0 12px 32px rgba(20,30,55,.14); --radius:12px; --radius-sm:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1420; --surface:#171d2b; --surface-2:#1f2737; --border:#2a3346;
  --text:#e6eaf2; --text-dim:#94a0b4; --primary:#7c80ff; --primary-soft:#252a52;
  --accent:#22c993; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
  --sidebar:#141a27; --sidebar-text:#b4bdce; --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5b5fef 0%,#7c3aed 55%,#13b981 140%);padding:20px;z-index:1000}
.login-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:410px;padding:42px 38px;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-card h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
.login-card p.sub{color:var(--text-dim);margin-bottom:26px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn{padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{box-shadow:0 6px 18px rgba(91,95,239,.4)}
.btn-block{width:100%}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-dim);text-align:center;background:var(--surface-2);padding:10px;border-radius:8px}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:16px}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:90;transition:transform .25s}
.sidebar-head{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sidebar-head .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-head .ttl{font-weight:700;font-size:14px;line-height:1.2}
.sidebar-head .ttl span{display:block;font-size:11px;color:var(--text-dim);font-weight:500}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-dim);font-weight:700;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--sidebar-text);font-weight:500;font-size:13.5px;margin-bottom:2px;transition:background .13s,color .13s;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--surface-2);color:var(--text-dim);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.nav-item.active .badge{background:var(--primary);color:#fff}
.sidebar-foot{padding:12px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user-chip .un{font-weight:600;font-size:13px}
.user-chip .ur{font-size:11px;color:var(--text-dim)}

.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:50}
.hamburger{display:none}
.topbar h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.topbar .crumb{color:var(--text-dim);font-size:12.5px;font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:8px 12px;width:230px}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;transition:background .14s}
.icon-btn:hover{background:var(--border)}
.content{padding:24px;flex:1;overflow-x:hidden;min-width:0}

/* ---------- DASHBOARD ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.6px}
.kpi .lbl{color:var(--text-dim);font-size:12.5px;font-weight:500;margin-top:2px}
.kpi .trend{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.t-up{background:rgba(19,185,129,.13);color:var(--accent)}
.t-flat{background:var(--surface-2);color:var(--text-dim)}
.ic-blue{background:rgba(59,130,246,.13);color:var(--info)}
.ic-green{background:rgba(19,185,129,.13);color:var(--accent)}
.ic-purple{background:rgba(124,58,237,.13);color:#7c3aed}
.ic-orange{background:rgba(245,158,11,.13);color:var(--warn)}
.ic-red{background:rgba(239,68,68,.13);color:var(--danger)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between;gap:10px}
.card-head h3{font-size:15px;font-weight:700;flex:1}
.card-body{padding:18px}
.chart-wrap{position:relative;height:260px}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-stat{padding:13px;border-radius:10px;background:var(--surface-2)}
.mini-stat .v{font-size:19px;font-weight:800}
.mini-stat .l{font-size:11.5px;color:var(--text-dim);font-weight:500}

/* ---------- TABLE ---------- */
.toolbar{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.filter-sel{padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);outline:none;font-weight:500}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto;overflow-y:hidden;width:100%;-webkit-overflow-scrolling:touch}
/* ===== Horizontal scroll wrapper for the wide procurement table =====
   The wrapper shrinks to the available width (min-width:0) so the inner
   fixed-min-width table overflows INSIDE this box, producing a horizontal
   scrollbar at the bottom of the table — never breaking the page layout. */
.cu-group-body{width:100%;max-width:100%;min-width:0}
#tableHost{width:100%;max-width:100%;min-width:0}
.hscroll{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:auto;
  overflow-y:auto;
  max-height:400px;            /* ~6 rows + header; keeps horizontal scrollbar reachable */
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  box-shadow:var(--shadow);
  scrollbar-width:thin;
  scrollbar-color:var(--primary) var(--surface-2);
}
/* Keep the header row visible while scrolling the 6-row body */
.hscroll table.data.proc-table thead th{position:sticky;top:0;z-index:5;background:var(--surface-2)}
.hscroll table.data.proc-table thead th:nth-child(16),.hscroll table.data.proc-table thead th:nth-child(17){z-index:7;background:var(--surface-2)}
/* Always-visible, theme-matched horizontal scrollbar */
.hscroll::-webkit-scrollbar{height:11px;-webkit-appearance:none}
.hscroll::-webkit-scrollbar-track{background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.hscroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px;border:2px solid var(--surface-2)}
.hscroll::-webkit-scrollbar-thumb:hover{filter:brightness(1.15)}
/* The procurement table keeps a comfortable minimum width so 16 columns
   never squeeze; it grows with content but never below this. */
table.data.proc-table{min-width:1700px;width:max-content;max-width:none;margin:0;table-layout:auto}
table.data.proc-table th,table.data.proc-table td{vertical-align:middle;white-space:nowrap}
/* Per-column sizing + ellipsis for long text so columns never overlap */
table.data.proc-table th:nth-child(1),table.data.proc-table td:nth-child(1){min-width:200px;max-width:240px}   /* Name */
table.data.proc-table td:nth-child(1) b{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.data.proc-table th:nth-child(14),table.data.proc-table td:nth-child(14){max-width:150px}                /* Attachment */
table.data.proc-table th:nth-child(15),table.data.proc-table td:nth-child(15){min-width:150px;max-width:200px}/* Remarks */
table.data.proc-table td:nth-child(15) span{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.data.proc-table th:nth-child(16),table.data.proc-table td:nth-child(16){min-width:140px;width:140px;position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -6px rgba(0,0,0,.25)}
table.data.proc-table tbody tr:hover td:nth-child(16){background:var(--surface-2)}
.hscroll .att-pill{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
/* Purchase Order table: cap to ~6 rows, both-axis scroll, sticky header + action column */
.po-scroll{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--primary) var(--surface-2)}
.po-scroll::-webkit-scrollbar{height:11px;width:11px}
.po-scroll::-webkit-scrollbar-track{background:var(--surface-2)}
.po-scroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px;border:2px solid var(--surface-2)}
.po-scroll table.po-table{min-width:1000px;margin:0}
.po-scroll table.po-table thead th{position:sticky;top:0;z-index:5;background:var(--surface-2)}
.po-scroll table.po-table th:last-child,.po-scroll table.po-table td:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -6px rgba(0,0,0,.25);min-width:150px}
.po-scroll table.po-table thead th:last-child{z-index:7;background:var(--surface-2)}
.po-scroll table.po-table tbody tr:hover td:last-child{background:var(--surface-2)}
table.data{width:100%;border-collapse:collapse;min-width:1080px}
table.data th{text-align:left;padding:13px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
table.data td{padding:13px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
td.ell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ell-sm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ell b{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;white-space:nowrap}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--surface-2)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-todo{background:rgba(105,116,134,.14);color:#697586}
.s-pending{background:rgba(245,158,11,.15);color:#d97706}
.s-inprogress{background:rgba(59,130,246,.15);color:#2563eb}
.s-ordered{background:rgba(124,58,237,.15);color:#7c3aed}
.s-delivered{background:rgba(20,184,166,.15);color:#0d9488}
.s-completed{background:rgba(19,185,129,.16);color:#059669}
.s-cancelled{background:rgba(239,68,68,.15);color:#dc2626}
.s-overdue{background:rgba(239,68,68,.18);color:#dc2626;font-weight:800}
.s-draft{background:rgba(105,116,134,.14);color:#697586}
.s-issued{background:rgba(59,130,246,.15);color:#2563eb}
.s-approved{background:rgba(124,58,237,.15);color:#7c3aed}
.s-partiallydelivered{background:rgba(245,158,11,.15);color:#d97706}
.s-closed{background:rgba(19,185,129,.16);color:#059669}
.s-waitingquotation{background:rgba(168,85,247,.15);color:#9333ea}
.s-waitingapproval{background:rgba(236,72,153,.15);color:#db2777}
/* Campus colored tags */
.camp-tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap}
.camp-wukpc{background:rgba(59,130,246,.15);color:#2563eb}
.camp-btb4{background:rgba(19,185,129,.15);color:#059669}
.camp-ckdii{background:rgba(245,158,11,.16);color:#d97706}
.camp-bchreno{background:rgba(168,85,247,.15);color:#9333ea}
.camp-general{background:rgba(105,116,134,.16);color:#5b6677}
.camp-other{background:rgba(20,184,166,.15);color:#0d9488}
/* Grouped list view */
.group-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);background:var(--surface-2)}
.group-head:hover{background:var(--border)}
.group-head .chev{transition:transform .18s;display:flex}
.group-head.collapsed .chev{transform:rotate(-90deg)}
.group-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.group-head .gname{font-weight:700;font-size:13px;letter-spacing:.3px}
.group-head .gcount{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:700;padding:1px 9px;border-radius:11px}
.group-head .gsum{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-dim)}
.group-body.collapsed{display:none}
.row-actions{display:flex;gap:5px}
.act-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);transition:.13s}
.act-btn:hover{background:var(--primary-soft);color:var(--primary)}
.act-btn.del:hover{background:rgba(239,68,68,.13);color:var(--danger)}
.empty{padding:54px 20px;text-align:center;color:var(--text-dim)}
.empty svg{opacity:.4;margin-bottom:12px}
.empty h4{font-size:15px;color:var(--text);margin-bottom:5px}
.chip-cat{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--text-dim)}
/* ClickUp-style grouped list view */
.cu-group{margin-bottom:18px;max-width:100%;min-width:0}
.cu-group-head{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;user-select:none}
.cu-group-bar{width:4px;height:18px;border-radius:3px;flex-shrink:0}
.cu-group-name{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 11px;border-radius:7px}
.cu-group-count{font-size:11.5px;font-weight:700;color:var(--text-dim);background:var(--surface-2);padding:2px 9px;border-radius:20px}
.cu-group-sum{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-dim)}
.cu-caret{transition:transform .15s;color:var(--text-dim)}
.cu-caret.collapsed{transform:rotate(-90deg)}
.cu-add-row{padding:8px 14px;font-size:12.5px;color:var(--text-dim);cursor:pointer;border-top:1px dashed var(--border)}
.cu-add-row:hover{color:var(--primary)}
.campus-tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap;display:inline-block}
.cp0{background:rgba(59,130,246,.15);color:#2563eb}
.cp1{background:rgba(19,185,129,.15);color:#059669}
.cp2{background:rgba(124,58,237,.15);color:#7c3aed}
.cp3{background:rgba(245,158,11,.15);color:#d97706}
.cp4{background:rgba(236,72,153,.15);color:#db2777}
.cp5{background:rgba(13,148,136,.15);color:#0d9488}
.cp6{background:rgba(168,85,247,.15);color:#9333ea}
.cp7{background:rgba(234,88,12,.15);color:#ea580c}
.cp8{background:rgba(8,145,178,.15);color:#0891b2}
.cp9{background:rgba(101,163,13,.15);color:#65a30d}
.cp10{background:rgba(225,29,72,.15);color:#e11d48}
.cp11{background:rgba(2,132,199,.15);color:#0284c7}
.ct-other{background:var(--surface-2);color:var(--text-dim)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
/* Construction Project module */
.con-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.con-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.con-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--primary)}
.con-card-cover{height:128px;background-size:cover;background-position:center;background-color:var(--surface-2)}
.con-card-nocover{display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
.con-card-body{padding:14px 15px}
.con-card-title{font-weight:800;font-size:15px;line-height:1.25}
.con-card-code{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.con-card-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px;margin-top:4px}
.con-card-meta>div{display:flex;flex-direction:column}.con-card-meta .muted{font-size:10.5px}
.con-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);padding-bottom:0;scrollbar-width:thin}
.con-tab{flex-shrink:0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:9px 13px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
.con-tab:hover{color:var(--text);background:var(--surface-2)}
.con-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.con-report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.con-report-item{border:1px solid var(--border);border-radius:10px;padding:13px}
.file-chip{display:inline-block;background:var(--surface-2);border-radius:6px;padding:3px 9px;font-size:11.5px;margin:2px}
/* Procurement expandable sidebar lists */
.nav-caret{flex-shrink:0;transition:transform .15s;margin-right:-2px;opacity:.7;cursor:pointer}
.nav-caret.collapsed{transform:rotate(-90deg)}
.nav-add{margin-left:auto;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-size:14px;line-height:1;opacity:.55;flex-shrink:0}
.nav-add:hover{opacity:1;background:var(--surface-2)}
.nav-sublists{display:flex;flex-direction:column;margin:2px 0 6px}
.nav-sublist{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;color:var(--text-dim);font-size:12.5px;padding:7px 12px 7px 34px;cursor:pointer;border-radius:8px;text-align:left}
.nav-sublist:hover{background:var(--surface-2);color:var(--text)}
.nav-sublist.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-sublist-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.nav-sublist-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sublist .badge{flex-shrink:0}
/* Procurement board view */
.proc-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.proc-board-col{flex:0 0 270px;background:var(--surface-2);border-radius:12px;padding:10px}
.proc-board-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.proc-board-sum{font-size:11px;color:var(--text-dim);margin:0 0 8px 2px}
.proc-board-cards{display:flex;flex-direction:column;gap:8px}
.proc-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:pointer;transition:border-color .12s,transform .12s}
.proc-card:hover{border-color:var(--primary);transform:translateY(-1px)}
/* Maintenance quarterly matrix */
.maint-matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--primary) var(--surface-2);max-width:100%}
.maint-matrix-wrap::-webkit-scrollbar{height:10px}
.maint-matrix-wrap::-webkit-scrollbar-track{background:var(--surface-2)}
.maint-matrix-wrap::-webkit-scrollbar-thumb{background:var(--primary);border-radius:6px}
table.maint-matrix{border-collapse:separate;border-spacing:0;min-width:max-content;font-size:11.5px}
table.maint-matrix th,table.maint-matrix td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 8px;white-space:nowrap}
table.maint-matrix thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;font-size:10px;text-transform:uppercase;letter-spacing:.2px}
table.maint-matrix .freeze-1{position:sticky;left:0;z-index:3;background:var(--surface);min-width:34px;text-align:center}
table.maint-matrix .freeze-2{position:sticky;left:34px;z-index:3;background:var(--surface);min-width:140px;text-align:left}
table.maint-matrix thead .freeze-1,table.maint-matrix thead .freeze-2{z-index:4;background:var(--surface-2)}
table.maint-matrix tfoot td{position:sticky;bottom:0;background:var(--surface-2)}
table.maint-matrix tfoot .freeze-1{left:0;z-index:3}table.maint-matrix tfoot .freeze-2{left:34px;z-index:3}
.maint-cell.editable{cursor:text;background:var(--primary-soft)}
.maint-cell.editable:focus{outline:2px solid var(--primary);outline-offset:-2px;background:var(--surface)}
.maint-cell:not(.editable){color:var(--text)}
/* Quarter-to-quarter comparison highlighting */
.maint-cell.diff-up{background:rgba(5,150,105,.16);box-shadow:inset 0 0 0 1px rgba(5,150,105,.45)}
.maint-cell.diff-down{background:rgba(220,38,38,.14);box-shadow:inset 0 0 0 1px rgba(220,38,38,.4)}
.maint-cell.diff-new{background:rgba(217,119,6,.16);box-shadow:inset 0 0 0 1px rgba(217,119,6,.45)}
.maint-cell.diff-removed{background:rgba(100,116,139,.18);box-shadow:inset 0 0 0 1px rgba(100,116,139,.4)}
.diff-mark{display:inline-block;margin-left:4px;font-size:9px;font-weight:800;vertical-align:top;opacity:.85}
.maint-cell.diff-up .diff-mark{color:#059669}
.maint-cell.diff-down .diff-mark{color:#dc2626}
.maint-cell.diff-new .diff-mark{color:#d97706}
.maint-cell.diff-removed .diff-mark{color:#64748b}
.maint-diff-banner{margin:0 0 10px;padding:9px 12px;border:1px solid var(--primary);border-radius:9px;background:var(--primary-soft);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.diff-chip{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.diff-chip.up{background:rgba(5,150,105,.18);color:#059669}
.diff-chip.down{background:rgba(220,38,38,.16);color:#dc2626}
.diff-chip.new{background:rgba(217,119,6,.18);color:#d97706}
.diff-chip.removed{background:rgba(100,116,139,.18);color:#64748b}
.maint-price-edit{cursor:pointer;border-bottom:1px dashed var(--primary);color:var(--primary)}
.maint-approvals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.maint-appr{border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.maint-matrix .num{text-align:center}
/* AC maintenance */
.ac-dot{display:inline-block;width:14px;height:14px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.ac-checklist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:10px}
.ac-check-row{display:grid;grid-template-columns:1fr 90px 1.3fr;gap:8px;align-items:center}
.ac-check-label{font-size:12px}
.ac-check-sel,.ac-check-comment{padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px}
.att-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:7px;cursor:pointer;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--text-dim)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,32,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:200;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;animation:pop .25s ease;margin:auto}
.modal.wide{max-width:860px}
.modal.narrow{max-width:440px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:17px;font-weight:700;flex:1}
.modal-body{padding:22px 24px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}
.req::after{content:" *";color:var(--danger)}
.file-drop{border:2px dashed var(--border);border-radius:11px;padding:18px;text-align:center;cursor:pointer;transition:.15s}
.file-drop:hover{border-color:var(--primary);background:var(--primary-soft)}
.file-drop input{display:none}
.file-list{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.file-row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--surface-2);border-radius:9px}
.file-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.file-row .fn{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .fs{font-size:11px;color:var(--text-dim)}

/* ---------- TOAST ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:11px;box-shadow:var(--shadow-lg);padding:13px 17px;display:flex;align-items:center;gap:11px;min-width:280px;animation:slideIn .3s ease}
.toast.ok{border-left-color:var(--accent)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast .tx{font-size:13px;font-weight:600}
.toast .tx span{display:block;font-weight:500;color:var(--text-dim);font-size:12px}

/* ---------- MISC ---------- */
.page-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px}
.page-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px}
.settings-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info h4{font-size:14px;font-weight:600}
.settings-row .info p{font-size:12.5px;color:var(--text-dim)}
.switch{width:46px;height:26px;border-radius:20px;background:var(--border);position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:23px}
.radio-group{display:flex;flex-direction:column;gap:9px}
.radio-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:.13s}
.radio-opt:hover{border-color:var(--primary)}
.radio-opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.pdf-preview{background:#fff;color:#222;border-radius:8px;padding:30px;font-size:12px;box-shadow:var(--shadow);max-height:520px;overflow-y:auto}
.pdf-preview h1{font-size:18px;color:#5b5fef}
.pdf-preview table{width:100%;border-collapse:collapse;margin-top:12px}
.pdf-preview th,.pdf-preview td{border:1px solid #ddd;padding:6px 8px;text-align:left;font-size:10.5px}
.pdf-preview th{background:#f1f3f7}
.tag-list{display:flex;gap:7px;flex-wrap:wrap}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
  .sidebar-overlay.show{display:block}
}
@media(max-width:640px){
  .content{padding:15px}
  .topbar{padding:0 14px}
  .search-box{display:none}
  .topbar h2{font-size:16px}
  .form-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:11px}
  .kpi .val{font-size:20px}
  .modal-body{max-height:70vh}
  .toolbar .filter-sel{flex:1}
  #toasts{left:14px;right:14px;bottom:14px}
  .toast{min-width:auto}
}
</style>
</head>

const IDB_NAME="pmpts_files", IDB_STORE="files";
let _idb=null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(_idb) return resolve(_idb);
    if(!("indexedDB" in window)){ resolve(null); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>{ _idb=req.result; resolve(_idb); };
    req.onerror=()=>{ console.warn("IndexedDB open failed",req.error); resolve(null); };
  });
}
async function idbPut(id,dataUrl){
  const db=await idbOpen(); if(!db) throw new Error("IndexedDB unavailable");
  return new Promise((resolve,reject)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(dataUrl,id); tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error); });
}
async function idbGet(id){
  const db=await idbOpen(); if(!db) return null;
  return new Promise((resolve)=>{ const tx=db.transaction(IDB_STORE,"readonly"); const r=tx.objectStore(IDB_STORE).get(id); r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>resolve(null); });
}
async function idbDelete(id){
  const db=await idbOpen(); if(!db) return;
  return new Promise((resolve)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(id); tx.oncomplete=()=>resolve(true); tx.onerror=()=>resolve(false); });
}

async function persistStagedFile(f){

  });

    for(let i=0;i<arr.length;i++){

}

function loadDB(){
  try{

    // Guard against stored "null", arrays, or any non-object value
    DB = (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : defaultDB();
  }catch(e){ DB=defaultDB(); }
  // ensure shape
  const d=defaultDB();
  for(const k in d){ if(DB[k]===undefined || DB[k]===null) DB[k]=d[k]; }
  if(!Array.isArray(DB.users) || !DB.users.length) DB.users=d.users;
  ["procurement","projects","maintenance","suppliers","budget","po","stock","uniform","gepUniform","construction","procurementLists","maintQuarters","maintCampuses","acUnits","acRecords","acCorrective"].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });

  if(!DB.poItemCatalog || typeof DB.poItemCatalog!=="object" || Array.isArray(DB.poItemCatalog)) DB.poItemCatalog={};
  // Repair any duplicate record IDs across record collections (legacy data could cause edits to update the wrong copy)
  ["procurement","maintenance","po","stock","construction","acUnits","acRecords","acCorrective"].forEach(k=>{
    const seen=new Set();
    (DB[k]||[]).forEach(r=>{ if(!r.id||seen.has(r.id)){ r.id=uid(); } seen.add(r.id); });
  });
  if(typeof DB.settings!=="object"||DB.settings===null) DB.settings=d.settings;
  if(!DB.users.some(u=>u.role==="superadmin")) DB.users.unshift(d.users[0]);
  saveDB();

// JSONP helper — bypasses CORS entirely by loading the response via a <script> tag
function jsonpRequest(baseUrl, params, timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb="__gsync_cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    let done=false;
    const cleanup=()=>{ try{delete window[cb];}catch(_){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); };
    const timer=setTimeout(()=>{ if(done)return; done=true; cleanup(); reject(new Error("timeout")); }, timeoutMs||20000);
    window[cb]=(data)=>{ if(done)return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    const qs=Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    s.src=baseUrl+(baseUrl.indexOf("?")<0?"?":"&")+qs+"&callback="+cb+"&t="+Date.now();
    s.onerror=()=>{ if(done)return; done=true; clearTimeout(timer); cleanup(); reject(new Error("network")); };
    document.body.appendChild(s);
  });

    form.method="POST"; form.action=url; form.target=name; form.style.display="none";
    form.acceptCharset="utf-8";
    Object.keys(fields).forEach(k=>{ const ta=document.createElement("textarea"); ta.name=k; ta.value=fields[k]; form.appendChild(ta); });
    document.body.appendChild(form);
    let settled=false;
    const finish=()=>{ if(settled)return; settled=true; setTimeout(()=>{ if(form.parentNode)form.remove(); if(ifr.parentNode)ifr.remove(); },1000); resolve(true); };
    ifr.onload=finish;
    form.submit();
    setTimeout(finish, 8000); // fallback: assume delivered
  });
}
// Count the "real" records in the local DB — used to guard against pushing an empty DB over a populated Sheet
function localRecordCount(){
  try{
    const b=dbForSync();
    let n=0;
    ["procurement","suppliers","po","stock","construction"].forEach(k=>{ if(Array.isArray(b[k])) n+=b[k].length; });
    return n;
  }catch(_){ return 0; }
}
async function syncPush(silent){
  const cfg=syncCfg(); if(!cfg.url){ if(!silent)toast("Sync not set up","Add your Apps Script URL in Settings","err"); return false; }
  if(_syncState.busy) return false;
  // SAFETY GUARD: never let an empty local DB overwrite a populated Sheet.
  // If this browser has 0 records, first check what's on the Sheet; if the Sheet has data, block the push.
  if(localRecordCount()===0){
    try{
      const chk=await jsonpRequest(cfg.url,{action:"load", key:cfg.key},15000);
      const remoteHas = chk && chk.ok && chk.data && (
        (Array.isArray(chk.data.procurement)&&chk.data.procurement.length) ||
        (Array.isArray(chk.data.po)&&chk.data.po.length) ||
        (Array.isArray(chk.data.suppliers)&&chk.data.suppliers.length) ||
        (Array.isArray(chk.data.stock)&&chk.data.stock.length) ||
        (Array.isArray(chk.data.construction)&&chk.data.construction.length)
      );
      if(remoteHas){
        setSyncBadge(_syncState.last?"live":"off");
        if(!silent) toast("Push blocked — Sheet has data","This browser is empty (0 records) but the Sheet is not. Click ⬇ Pull latest now to load it. (Pushing would erase everyone's data.)","err",10000);
        return false;
      }
    }catch(_){ /* if the check itself fails, fall through — the deploy/URL is likely wrong and the push will surface that */ }
  }
  _syncState.busy=true; setSyncBadge("syncing","Saving to Sheet…");
  try{
    const dataStr=JSON.stringify(dbForSync());
    await iframePost(cfg.url, {action:"save", key:cfg.key, ts:String(Date.now()), data:dataStr});
    _syncState.busy=false;
    // The iframe POST delivered the data. Mark live. (We deliberately don't hard-fail on a
    // follow-up check, because Apps Script's post-redirect responses aren't readable cross-origin.)
    _syncState.last=Date.now(); setSyncBadge("live");
    if(!silent) toast("Synced to Google Sheet","","ok");
    // Best-effort background verification: if a JSONP load clearly rejects the key, warn (but don't
    // wipe the success state, since the save itself already went through).
    jsonpRequest(cfg.url,{action:"ping", key:cfg.key},12000)
      .then(ping=>{ if(ping && ping.ok===false && !silent){ setSyncBadge("error","Key rejected"); toast("Check secret key","The script rejected the key on verify — data may not be saved. Re-check the key & re-deploy.","warn",8000); } })
      .catch(()=>{ /* ignore verify network hiccups; the push already succeeded */ });
    return true;
  }catch(e){ _syncState.busy=false; setSyncBadge("error"); if(!silent)toast("Sync failed","Could not reach Google. Check the URL ends in /exec and access is ‘Anyone’.","err",8000); console.warn("syncPush error",e); return false; }
}
async function syncPull(silent){
  const cfg=syncCfg(); if(!cfg.url){ if(!silent)toast("Sync not set up","","err"); return false; }
  if(_syncState.busy) return false; _syncState.busy=true; setSyncBadge("syncing","Loading from Sheet…");
  try{
    const j=await jsonpRequest(cfg.url,{action:"load", key:cfg.key},25000);
    _syncState.busy=false;
    if(j&&j.ok&&j.data){
      const incoming=j.data;
      const keepSettings=DB.settings||{};
      DB=incoming;
      DB.settings=Object.assign({}, incoming.settings||{}, {tgToken:keepSettings.tgToken, gsUrl:keepSettings.gsUrl, gsKey:keepSettings.gsKey, gsAuto:keepSettings.gsAuto, gsInterval:keepSettings.gsInterval, prepSig:keepSettings.prepSig||(incoming.settings||{}).prepSig, apprSig:keepSettings.apprSig||(incoming.settings||{}).apprSig});
      loadDBGuards(); saveDB(); _syncState.last=Date.now(); setSyncBadge("live");
      if(!silent){ buildNav(); navigate(CURRENT||"dashboard"); toast("Loaded latest from Google Sheet","","ok"); }
      else if(typeof buildNav==="function"){ buildNav(); if(CURRENT) navigate(CURRENT); }
      return true;
    }
    if(j&&j.ok&&!j.data){ setSyncBadge("live","Live · empty Sheet"); if(!silent)toast("Sheet is empty","Push your data first with Push to Sheet","warn"); return true; }
    if(j&&!j.ok){ setSyncBadge("error","Key rejected"); if(!silent)toast("Load failed",(j.error||"Secret key doesn't match"),"err",8000); return false; }
    setSyncBadge("error"); if(!silent)toast("Load failed","Unexpected response from script","err",8000); return false;
  }catch(e){ _syncState.busy=false; if(silent){ /* transient auto-pull failure: restore prior state, retry next tick */ setSyncBadge(_syncState.last?"live":"off"); } else { setSyncBadge("error"); toast("Load failed","Could not reach Google, or the deployed script is the OLD code. Re-paste the new code, Deploy → New version, and set access to ‘Anyone’.","err",9000); } console.warn("syncPull error",e); return false; }
}

// Diagnostic: ping the deployed Apps Script and tell the user exactly which state they're in.
async function testSync(){
  // Read the live values from the Settings fields (so the user can test before saving)
  const url=(document.getElementById("set_gsUrl")?.value||DB.settings.gsUrl||"").trim();
  const key=(document.getElementById("set_gsKey")?.value||DB.settings.gsKey||"").trim();
  if(!url){ toast("No URL","Paste the Apps Script Web App URL (ends in /exec) first","err"); return; }
  if(!/\/exec$/.test(url)){ toast("Check the URL","It should end in /exec (not /dev). Copy it from Deploy → Manage deployments.","warn",8000); }
  toast("Testing connection…","Contacting the Apps Script","ok");
  try{
    const r=await jsonpRequest(url,{action:"load", key:key},15000);
    if(r && r.ok===true){
      const d=r.data||{};
      const n=(Array.isArray(d.procurement)?d.procurement.length:0);
      const sup=(Array.isArray(d.suppliers)?d.suppliers.length:0);
      const po=(Array.isArray(d.po)?d.po.length:0);
      toast("✅ Connected","Sheet reachable · "+n+" procurement, "+sup+" suppliers, "+po+" POs on the Sheet.","ok",9000);
      return;
    }
    if(r && r.ok===false){
      toast("⚠ Key rejected","Connected to the script, but the Shared Secret Key doesn't match the SECRET in the Apps Script. Fix one to match the other (case-sensitive).","err",10000);
      return;
    }
    toast("Unexpected reply","The script responded but not in the expected format. Make sure the deployed code is the current version.","err",9000);
  }catch(e){
    // JSONP failed to load at all — almost always a deployment/access problem, i.e. Google's "file not found"
    toast("❌ Cannot reach the script","Google returned an error (often \"file not found\"). Causes: URL points to an old/deleted deployment, or access isn't set to \"Anyone\". Redeploy: Manage deployments → Edit → New version → Anyone.","err",12000);
    console.warn("testSync failed:",e);
  }
}

function computeStats(){
  const recs=allRecords();
  const sum=arr=>arr.reduce((a,r)=>a+(Number(r.budget)||0),0);
  const byStatus={}; STATUSES.forEach(s=>byStatus[s]=0);
  recs.forEach(r=>{ const st=isOverdue(r)?"Overdue":r.status; byStatus[st]=(byStatus[st]||0)+1; });
  const completedAmt=sum(recs.filter(r=>r.status==="Completed"));
  const pendingAmt=sum(recs.filter(r=>["To Do","Pending"].includes(r.status)));
  const inProgAmt=sum(recs.filter(r=>["In Progress","Ordered"].includes(r.status)));
  const now=new Date(), monthVal=sum(recs.filter(r=>{ const d=new Date(r.created||r.due); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); }));
  return {
    recs, totalBudget:sum(recs), completedAmt, pendingAmt, inProgAmt, monthVal,
    nProc:DB.procurement.length, nProj:DB.projects.length, nMaint:DB.maintenance.length, nSupp:DB.suppliers.length,
    completed:recs.filter(r=>r.status==="Completed").length,
    pending:recs.filter(r=>["To Do","Pending"].includes(r.status)).length,
    overdue:recs.filter(r=>isOverdue(r)).length,
    delivered:recs.filter(r=>r.status==="Delivered").length,
    ordered:recs.filter(r=>r.status==="Ordered").length,
    byStatus
  };
}

function chartColors(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  return {grid:dark?"#2a3346":"#e3e7ee", text:dark?"#94a0b4":"#697586",
    palette:["#5b5fef","#13b981","#f59e0b","#3b82f6","#7c3aed","#ef4444","#0d9488","#ec4899","#84cc16","#06b6d4"]};
}
function drawCharts(s){
  destroyCharts();
  const C=chartColors();
  Chart.defaults.color=C.text; Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  // status doughnut
  const stLabels=STATUSES.filter(x=>s.byStatus[x]>0), stData=stLabels.map(x=>s.byStatus[x]);
  window._charts.status=new Chart(document.getElementById("chStatus"),{type:"doughnut",
    data:{labels:stLabels.length?stLabels:["No data"],datasets:[{data:stData.length?stData:[1],backgroundColor:C.palette,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:14,font:{size:11.5}}}}}});
  // budget by module bar
  const bm=[DB.procurement,DB.projects,DB.maintenance].map(a=>a.reduce((x,r)=>x+(Number(r.budget)||0),0));
  window._charts.budget=new Chart(document.getElementById("chBudget"),{type:"bar",
    data:{labels:["Procurement","Projects","Maintenance"],datasets:[{data:bm,backgroundColor:["#5b5fef","#7c3aed","#f59e0b"],borderRadius:8,maxBarThickness:60}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},x:{grid:{display:false}}}}});
  // campus bar (horizontal)
  const camp={}; allRecords().forEach(r=>{ if(r.campus) camp[r.campus]=(camp[r.campus]||0)+1; });
  const cL=Object.keys(camp), cV=cL.map(k=>camp[k]);
  window._charts.campus=new Chart(document.getElementById("chCampus"),{type:"bar",
    data:{labels:cL.length?cL:["No data"],datasets:[{data:cV.length?cV:[0],backgroundColor:C.palette,borderRadius:7,maxBarThickness:26}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:10.5}}}}}});
  // maintenance status
  const mSt={}; STATUSES.forEach(x=>mSt[x]=0); DB.maintenance.forEach(r=>{ const st=isOverdue(r)?"Overdue":r.status; mSt[st]=(mSt[st]||0)+1; });
  const mL=STATUSES.filter(x=>mSt[x]>0), mV=mL.map(x=>mSt[x]);
  window._charts.maint=new Chart(document.getElementById("chMaint"),{type:"polarArea",
    data:{labels:mL.length?mL:["No data"],datasets:[{data:mV.length?mV:[1],backgroundColor:C.palette.map(c=>c+"cc"),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:12,font:{size:11}}}},scales:{r:{grid:{color:C.grid},ticks:{display:false}}}}});
  // procurement spend by category (horizontal bar, sorted desc, click to open category)
  const cat=document.getElementById("chProcCat");
  if(cat){
    const lists=activeProcLists();
    const spend=lists.map(l=>({id:l.id,name:l.name,total:DB.procurement.filter(r=>r.listId===l.id).reduce((x,r)=>x+(Number(r.budget)||0),0),count:DB.procurement.filter(r=>r.listId===l.id).length}));
    // include an "Unassigned" bucket if any records have no valid category
    const unassignedRecs=DB.procurement.filter(r=>!r.listId||!lists.some(l=>l.id===r.listId));
    if(unassignedRecs.length) spend.push({id:"",name:"Unassigned",total:unassignedRecs.reduce((x,r)=>x+(Number(r.budget)||0),0),count:unassignedRecs.length});
    spend.sort((a,b)=>b.total-a.total);
    // Only chart categories that actually have spend — keeps the dashboard clean (empty ones still appear in the dropdown/Manage Categories)
    const spendNZ=spend.filter(x=>x.total>0);
    const pcL=spendNZ.map(x=>x.name), pcV=spendNZ.map(x=>x.total), pcIds=spendNZ.map(x=>x.id), pcCnt=spendNZ.map(x=>x.count);
    window._charts.procCat=new Chart(cat,{type:"bar",
      data:{labels:pcL.length?pcL:["No data"],datasets:[{data:pcV.length?pcV:[0],backgroundColor:C.palette.concat(C.palette).slice(0,Math.max(1,pcL.length)),borderRadius:7,maxBarThickness:28}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
        onClick:(e,els)=>{ if(els&&els.length){ const i=els[0].index; _pendingProcCat=pcIds[i]||""; navigate("procurement"); } },
        onHover:(e,els)=>{ e.native&&(e.native.target.style.cursor=els&&els.length?"pointer":"default"); },
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${shortMoney(ctx.parsed.x)} · ${pcCnt[ctx.dataIndex]} record(s)`}}},
        scales:{x:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
  }
}

let _collapsedGroups={};
function toggleGroup(key){ _collapsedGroups[key]=!_collapsedGroups[key]; paintTable("procurement"); }

function filteredRecords(set){
  let base=DB[set];
  if(set==="procurement"){
    base=DB.procurement.slice();
    // Category is now driven purely by the dropdown filter (sidebar sub-lists removed)
    if(_procFilter2.list) base=base.filter(r=>r.listId===_procFilter2.list);
    if(_procFilter2.supplier) base=base.filter(r=>r.supplier===_procFilter2.supplier);
    if(_procFilter2.responsible) base=base.filter(r=>r.responsible===_procFilter2.responsible);
  }
  const result=base.filter(r=>{
    if(_filter.campus && r.campus!==_filter.campus) return false;
    if(_filter.status){ const st=(set!=="procurement"&&isOverdue(r))?"Overdue":r.status; if(st!==_filter.status) return false; }
    if(_filter.q){ const q=_filter.q.toLowerCase(); const blob=[r.name,r.pr,r.quote,r.po,r.supplier,r.remarks,r.category,r.depositInv,r.finalInv,r.responsible].join(" ").toLowerCase(); if(!blob.includes(q)) return false; }
    return true;
  });
  if(set==="procurement"){
    // Sort by PO Number ascending (smallest on top, largest at bottom). Blank PO numbers go last.
    result.sort((a,b)=>poSortKey(a.po)-poSortKey(b.po) || String(a.po||"").localeCompare(String(b.po||"")));
  }
  return result;
}
// Convert a PO number like "0626-01" or "PO-9" into a sortable numeric value (digits only, in order)
function poSortKey(po){
  const s=String(po||"").trim();
  if(!s) return Number.POSITIVE_INFINITY; // empty PO numbers sort to the bottom
  const digits=s.replace(/\D/g,"");
  return digits?Number(digits):Number.POSITIVE_INFINITY;
}

/* ---------- Procurement Board view ---------- */
function paintProcurementBoard(host){
  const rows=filteredRecords("procurement");
  const usd=v=>"$"+(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const groups={}; PROC_STATUSES.forEach(s=>groups[s]=[]);
  rows.forEach(r=>{ const s=PROC_STATUSES.includes(r.status)?r.status:"To Do"; groups[s].push(r); });
  host.innerHTML=`<div class="proc-board">${PROC_STATUSES.map(status=>{
    const list=groups[status]; const color=PROC_GROUP_COLORS[status]||"#697586";

        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim)"><span>${esc(r.pr||"—")}</span><b style="color:var(--text)">${usd(r.budget)}</b></div>

/* ---------- Procurement list management ---------- */
// Manage all procurement categories from one modal (replaces the old sidebar per-list menus)
function openManageCategories(){
  const usd=v=>"$"+(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const lists=activeProcLists();
  const catTotal=id=>DB.procurement.filter(r=>r.listId===id).reduce((s,r)=>s+(Number(r.budget)||0),0);
  const unassigned=DB.procurement.filter(r=>!r.listId||!DB.procurementLists.some(l=>l.id===r.listId));
  const rows=lists.map((l,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13.5px">${esc(l.name)}</div>
        <div class="muted" style="font-size:11.5px">${procListCount(l.id)} record(s) · ${usd(catTotal(l.id))}${l.campus?" · "+esc(l.campus):""}</div>
      </div>
      <button class="btn btn-ghost btn-sm" title="Move up" onclick="moveProcList('${l.id}',-1);openManageCategories()" ${i===0?'disabled style="opacity:.4"':''}>↑</button>
      <button class="btn btn-ghost btn-sm" title="Move down" onclick="moveProcList('${l.id}',1);openManageCategories()" ${i===lists.length-1?'disabled style="opacity:.4"':''}>↓</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal();openProcListForm('${l.id}')">Rename</button>
      <button class="btn btn-ghost btn-sm" onclick="archiveProcList('${l.id}');setTimeout(openManageCategories,50)">Archive</button>
      ${procListCount(l.id)===0?`<button class="btn btn-danger btn-sm" onclick="closeModal();deleteProcList('${l.id}')">Delete</button>`:''}
    </div>`).join("");
  const archived=DB.procurementLists.filter(x=>x.archived);
  openModal(`<div class="modal-head"><h3>Manage Categories</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <p class="muted" style="font-size:12.5px;margin:0">${lists.length} categor${lists.length===1?'y':'ies'} · ${DB.procurement.length} total record(s)</p>
      <button class="btn btn-primary btn-sm" onclick="closeModal();openProcListForm()">+ Add Category</button>
    </div>
    ${rows||'<p class="muted" style="font-size:13px">No categories yet. Click “Add Category” to create one.</p>'}
    ${unassigned.length?`<div style="margin-top:10px;padding:9px 10px;border:1px dashed var(--border);border-radius:9px"><div style="font-weight:600;font-size:13px">Unassigned</div><div class="muted" style="font-size:11.5px">${unassigned.length} record(s) · ${usd(unassigned.reduce((s,r)=>s+(Number(r.budget)||0),0))} — edit a record to assign it a category</div></div>`:''}
    ${archived.length?`<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px"><div class="muted" style="font-size:12px;margin-bottom:8px">Archived categories</div>${archived.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span style="font-size:13px">${esc(x.name)}</span><button class="btn btn-ghost btn-sm" onclick="restoreProcList('${x.id}');setTimeout(openManageCategories,50)">Restore</button></div>`).join("")}</div>`:''}
  </div>
  <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>`,{size:"wide"});
}
function openProcListForm(id){
  const l=id?DB.procurementLists.find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><h3>${id?"Rename":"New"} Procurement List</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

    <div class="field full"><label>Assign Campus / Project (optional)</label><select id="pl_campus"><option value="">— None —</option>${PROC_CAMPUSES.map(c=>`<option ${l?.campus===c?'selected':''}>${c}</option>`).join("")}</select></div>

function saveProcList(id){
  const name=document.getElementById("pl_name").value.trim();
  if(!name){ toast("List name is required","","err"); return; }
  const campus=document.getElementById("pl_campus").value;
  if(id){ const l=DB.procurementLists.find(x=>x.id===id); l.name=name; l.campus=campus; toast("List renamed","","ok"); }
  else { DB.procurementLists.push({id:uid(),name,campus,archived:false,order:DB.procurementLists.length,created:Date.now()}); toast("List created","","ok"); }
  saveDB(); closeModal(); buildNav(); if(CURRENT==="procurement") renderProcurement();
}
function openProcListMenu(id){
  const l=DB.procurementLists.find(x=>x.id===id);

      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="moveProcList('${id}',-1)">Move up</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="moveProcList('${id}',1)">Move down</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="archiveProcList('${id}')">Archive list</button>
      <button class="btn btn-danger" style="justify-content:flex-start" onclick="deleteProcList('${id}')">Delete list</button>
    </div>
    ${DB.procurementLists.some(x=>x.archived)?`<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px"><div class="muted" style="font-size:12px;margin-bottom:8px">Archived lists</div>${DB.procurementLists.filter(x=>x.archived).map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${esc(x.name)}</span><button class="btn btn-ghost btn-sm" onclick="restoreProcList('${x.id}')">Restore</button></div>`).join("")}</div>`:""}
  </div>`);
}
function moveProcList(id,dir){
  const lists=activeProcLists(); const i=lists.findIndex(l=>l.id===id);
  const j=i+dir; if(j<0||j>=lists.length){ return; }
  const a=lists[i],b=lists[j]; const ao=a.order, bo=b.order; a.order=bo; b.order=ao;
  saveDB(); buildNav();
}
function archiveProcList(id){
  const l=DB.procurementLists.find(x=>x.id===id);
  l.archived=true; saveDB(); closeModal(); buildNav();
  if(_procListId===id){ _procListId="all"; }
  if(CURRENT==="procurement") renderProcurement();
  toast("List archived","","ok");
}
function restoreProcList(id){ const l=DB.procurementLists.find(x=>x.id===id); l.archived=false; saveDB(); buildNav(); openProcListMenu(id); toast("List restored","","ok"); }
function deleteProcList(id){
  const count=procListCount(id);
  if(count>0){ toast("List not empty",`Move or archive its ${count} record(s) first`,"err"); return; }
  confirmModal("Delete empty list?","This list has no records and will be removed.",()=>{
    DB.procurementLists=DB.procurementLists.filter(x=>x.id!==id); saveDB(); closeModal(); buildNav();
    if(_procListId===id) _procListId="all";
    if(CURRENT==="procurement") renderProcurement(); toast("List deleted","","ok");
  },"Delete");
}
function openMoveRecord(rid){
  const r=DB.procurement.find(x=>x.id===rid);
  openModal(`<div class="modal-head"><h3>Move Record</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><p style="margin:0 0 12px;font-size:13.5px">Move <b>${esc(r.name)}</b> to:</p>
    <div class="field"><label class="req">Target List</label><select id="mv_list"><option value="">All Procurement (unassigned)</option>${activeProcLists().map(l=>`<option value="${l.id}" ${r.listId===l.id?'selected':''}>${esc(l.name)}</option>`).join("")}</select></div>
    <p class="muted" style="font-size:12px;margin-top:8px">All field values, attachments, and history are preserved.</p>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doMoveRecord('${rid}')">Move</button></div>`);
}
function doMoveRecord(rid){
  const r=DB.procurement.find(x=>x.id===rid);
  const to=document.getElementById("mv_list").value||"";
  const from=r.listId||"";
  r.listId=to;
  r.history=r.history||[]; r.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:`Moved from "${procListName(from)}" to "${procListName(to)}"`});
  saveDB(); closeModal(); buildNav(); renderProcurement();
  toast("Record moved","Now in "+procListName(to),"ok");
}

/* ---- attachment staging for forms ---- */
let _stagedFiles=[];
const FILE_WARN_BYTES=50*1024*1024;     // soft warning threshold (~50 MB); uploads are NOT blocked
function fileSizeLabel(bytes){ const mb=bytes/1024/1024; return mb>=1?(mb.toFixed(1)+" MB"):((bytes/1024).toFixed(0)+" KB"); }
function handleFileInput(input){
  const files=Array.from(input.files);
  files.forEach(f=>{
    if(f.size>FILE_WARN_BYTES){
      toast("Large file",`"${f.name}" is ${fileSizeLabel(f.size)}. It will still upload, but large files may be slow and use a lot of browser storage.`,"warn",7000);
    }
    const reader=new FileReader();
    reader.onload=e=>{
      _stagedFiles.push({name:f.name,size:f.size,type:f.type,data:e.target.result});
      renderStagedFiles();
    };
    reader.readAsDataURL(f);
  });
  input.value="";
}
function renderStagedFiles(){
  const host=document.getElementById("fileList"); if(!host)return;
  host.innerHTML=_stagedFiles.map((f,i)=>{
    const [lbl,col]=fileIcon(f.name);
    return `<div class="file-row"><div class="file-ic" style="background:${col}">${lbl}</div>
      <div style="flex:1;min-width:0"><div class="fn">${esc(f.name)}</div><div class="fs">${(f.size/1024).toFixed(1)} KB</div></div>
      <button class="act-btn" onclick="_stagedFiles.splice(${i},1);renderStagedFiles()" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
  }).join("");
}

  const lbl=document.getElementById("procItemsTotal"); if(lbl)lbl.textContent=money(total);

}
// When a procurement item description changes, auto-fill its unit price from the shared catalog if empty
function procItemDescChanged(i,val){
  _procItems2[i].desc=val;
  const known=(typeof poCatalogPrice==="function")?poCatalogPrice(val):null;
  if(known!=null && (!_procItems2[i].price || Number(_procItems2[i].price)===0)){
    _procItems2[i].price=known; renderProcItems();
  }
  procItemRecalc();
}
function renderProcItems(){

function saveRecord(set,id){
  const g=n=>{ const el=document.getElementById("f_"+n); return el?el.value:""; };
  const name=g("name").trim(), budget=g("budget");
  if(!name){ toast("Name is required","Please enter a task / item name","err"); return; }
  if(set==="procurement" && !g("listId")){ toast("Procurement list is required","Select which list this record belongs to","err"); return; }
  if(!g("campus")){ toast("Campus is required","","err"); return; }
  if(budget===""||isNaN(budget)){ toast("Budget is required","Enter a valid number","err"); return; }
  // Duplicate-number check (procurement only): quote, PO, deposit & final invoice numbers must be unique
  if(set==="procurement"){
    const _curPo=document.getElementById("f_po")?g("po").trim():(id?((DB[set].find(x=>x.id===id)||{}).po||""):"");
    const dups=findProcDuplicates(id,{quote:g("quote").trim(),po:_curPo,depositInv:g("depositInv").trim(),finalInv:g("finalInv").trim()});
    if(dups.length){
      const msg=dups.map(d=>`<b>${esc(d.label)}</b> "${esc(d.value)}" is already used by record: <b>${esc(d.recName)}</b>${d.recList?` (${esc(d.recList)})`:""}.`).join("<br><br>");
      confirmModal("Duplicate number detected",msg+"<br><br>Do you want to save anyway?",()=>doSaveRecord(set,id),"Save anyway",false);
      return;
    }
  }
  doSaveRecord(set,id);
}
// Returns a list of fields that collide with another procurement record (excluding the one being edited)
function findProcDuplicates(id,vals){
  const checks=[["quote","Quote Number"],["po","PO Number"],["depositInv","Deposit Invoice #"],["finalInv","Final Payment Invoice #"]];
  const norm=s=>String(s||"").trim().toLowerCase();
  const out=[];
  checks.forEach(([key,label])=>{
    const v=vals[key]; if(!v) return; // blanks are allowed and never count as duplicates
    const hit=DB.procurement.find(r=>r.id!==id && norm(r[key])===norm(v));
    if(hit) out.push({field:key,label,value:v,recName:hit.name||"(unnamed)",recList:hit.listId?procListName(hit.listId):""});
  });
  return out;
}
async function doSaveRecord(set,id){
  const g=n=>{ const el=document.getElementById("f_"+n); return el?el.value:""; };
  const budget=g("budget");
  const numOrEmpty=v=>v===""||v==null||isNaN(v)?"":Number(v);
  const prev=id?DB[set].find(x=>x.id===id):null;
  // Move staged file blobs into IndexedDB; record stores only light references
  const fileRefs=await persistStagedFiles(_stagedFiles);
  const obj={
    id:id||uid(), name:g("name").trim(), campus:g("campus"), category:g("category")||(prev?prev.category:""), pr:g("pr").trim(), quote:g("quote").trim(),
    po:(document.getElementById("f_po")?g("po").trim():(prev?prev.po:""))||"", supplier:g("supplier"), budget:Number(budget), status:g("status"), due:g("due"),
    confirm:g("confirm"),
    deposit:numOrEmpty(g("deposit")), depositInv:g("depositInv").trim(),
    finalPay:numOrEmpty(g("finalPay")), finalInv:g("finalInv").trim(),
    remarks:g("remarks").trim(), files:fileRefs,
    created:id?prev.created:Date.now(), updated:Date.now()
  };
  if(set==="procurement"){
    obj.listId=g("listId")||""; obj.responsible=g("responsible").trim();
    // Budget line items: keep only rows that have a price or description; recompute budget from them
    const items=(_procItems2||[]).filter(it=>(Number(it.price)||0)>0 || (it.desc&&it.desc.trim()))
      .map(it=>({desc:(it.desc||"").trim(),qty:Number(it.qty)||0,price:Number(it.price)||0}));
    obj.items=items;
    if(items.length){ obj.budget=items.reduce((a,it)=>a+(it.qty*it.price),0); }
    if(typeof poRememberItems==="function") poRememberItems(items); // feed the shared item price catalog
    obj.comments=prev?(prev.comments||[]):[];
    obj.history=prev?(prev.history||[]):[];
    obj.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:id?"Record updated":"Record created"});
  }
  // Snapshot for rollback if storage save fails (e.g. quota exceeded)
  const _backup=JSON.parse(JSON.stringify(DB[set]));
  if(id){
    const matches=DB[set].filter(x=>x.id===id);
    if(matches.length>1){ // de-dupe any accidental id collisions, keep only the one we're editing
      let kept=false; DB[set]=DB[set].filter(x=>{ if(x.id!==id) return true; if(kept) return false; kept=true; return true; });
    }
    const i=DB[set].findIndex(x=>x.id===id);
    if(i>=0){ DB[set][i]=obj; } else { DB[set].unshift(obj); }
  } else { DB[set].unshift(obj); }
  const okSaved=saveDB();
  if(!okSaved){
    // storage failed (quota) — restore previous data and keep the form open so nothing is lost
    DB[set]=_backup;
    return; // saveDB already showed an error toast explaining storage is full
  }
  if(id){ toast("Record updated", (set==="procurement"&&obj.files&&obj.files.length)?(obj.files.length+" attachment(s) saved"):"Changes saved successfully","ok"); }
  else { toast("Record added", set==="procurement"?("Saved to “"+procListName(obj.listId)+"”"+((obj.files&&obj.files.length)?(" · "+obj.files.length+" file(s)"):"")):"New record created","ok"); }
  closeModal();
  if(set==="procurement"){
    // jump to the list the record was saved to, so it's always visible (and never hidden by the current filter)
    if(obj.listId && _procListId!=="all" && _procListId!==obj.listId) _procListId=obj.listId;
    renderProcurement(); buildNav();
  } else { paintTable(set); buildNav(); }
}

function deleteRecord(set,id){
  const r=DB[set].find(x=>x.id===id);
  confirmModal("Delete record?",`"${esc(r.name)}" will be permanently removed. This cannot be undone.`,()=>{
    DB[set]=DB[set].filter(x=>x.id!==id); saveDB(); paintTable(set); buildNav();
    toast("Record deleted","","ok");
  },"Delete");
}

/* attachment preview/download */
function getFile(set,id,i){ return DB[set].find(x=>x.id===id).files[i]; }
async function previewFile(set,id,i){
  const f=getFile(set,id,i); const ext=(f.name.split(".").pop()||"").toLowerCase();
  const data=await resolveFileData(f);
  let body="";
  if(!data){ body=`<div style="text-align:center;padding:40px"><p class="muted">File data could not be loaded.</p></div>`; }
  else if(["jpg","jpeg","png","gif","webp"].includes(ext)) body=`<img src="${data}" style="max-width:100%;border-radius:8px">`;
  else if(ext==="pdf") body=`<iframe src="${data}" style="width:100%;height:60vh;border:none;border-radius:8px"></iframe>`;
  else { const [lbl,col]=fileIcon(f.name); body=`<div style="text-align:center;padding:40px"><div class="file-ic" style="background:${col};width:64px;height:64px;font-size:16px;margin:0 auto 14px">${lbl}</div><p style="font-weight:600">${esc(f.name)}</p><p class="muted">Preview not available for this file type.</p><button class="btn btn-primary" style="margin-top:14px" onclick="downloadFile('${set}','${id}',${i})">Download File</button></div>`; }
  openModal(`<div class="modal-head"><h3>${esc(f.name)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="downloadFile('${set}','${id}',${i})">Download</button></div>`,{size:"wide"});
}
async function downloadFile(set,id,i){ const f=getFile(set,id,i); const data=await resolveFileData(f); if(!data){ toast("File unavailable","Could not load file data","err"); return; } const a=document.createElement("a"); a.href=data; a.download=f.name; a.click(); toast("Download started",f.name,"ok"); }
function downloadRecord(set,id){
  const r=DB[set].find(x=>x.id===id);
  const blob=new Blob([JSON.stringify(r,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${set}-${(r.name||'record').replace(/\s+/g,'_')}.json`; a.click();
  toast("Record exported","Downloaded as JSON","ok");
}

function renderBudget(){
  const recs=allRecords();
  const byCampus={};
  CAMPUSES.forEach(c=>byCampus[c]={alloc:0,spent:0,count:0});
  DB.budget.forEach(b=>{ if(byCampus[b.campus]) byCampus[b.campus].alloc+=Number(b.amount)||0; });
  recs.forEach(r=>{ if(byCampus[r.campus]){ byCampus[r.campus].spent+=Number(r.budget)||0; byCampus[r.campus].count++; } });
  const totalAlloc=DB.budget.reduce((a,b)=>a+(Number(b.amount)||0),0);
  const totalSpent=recs.reduce((a,r)=>a+(Number(r.budget)||0),0);
  document.getElementById("content").innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="ic ic-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="val">${money(totalAlloc).replace(/\.00$/,"")}</div><div class="lbl">Total Allocated Budget</div></div>
      <div class="kpi"><div class="ic ic-orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg></div><div class="val">${money(totalSpent).replace(/\.00$/,"")}</div><div class="lbl">Committed / Spent</div></div>
      <div class="kpi"><div class="ic ${totalAlloc-totalSpent<0?'ic-red':'ic-blue'}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div><div class="val">${money(totalAlloc-totalSpent).replace(/\.00$/,"")}</div><div class="lbl">Remaining Balance</div></div>
    </div>
    <div class="toolbar"><button class="btn btn-primary" onclick="openBudgetForm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Budget Allocation</button></div>
    <div class="table-card"><div class="table-scroll"><table class="data" style="min-width:760px"><thead><tr><th>Campus / Project</th><th>Allocated</th><th>Spent / Committed</th><th>Remaining</th><th>Linked Records</th><th>Utilization</th></tr></thead><tbody>${
      CAMPUSES.map(c=>{ const b=byCampus[c]; if(b.alloc===0&&b.spent===0)return ""; const rem=b.alloc-b.spent; const pct=b.alloc?Math.min(100,Math.round(b.spent/b.alloc*100)):(b.spent?100:0);
        return `<tr><td><b>${c}</b></td><td>${money(b.alloc)}</td><td>${money(b.spent)}</td><td style="color:${rem<0?'var(--danger)':'var(--accent)'}"><b>${money(rem)}</b></td><td><span class="chip-cat">${b.count}</span></td>
        <td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden;min-width:70px"><div style="height:100%;width:${pct}%;background:${pct>90?'var(--danger)':pct>70?'var(--warn)':'var(--accent)'}"></div></div><span style="font-size:12px;font-weight:700">${pct}%</span></div></td></tr>`;
      }).join("")||`<tr><td colspan="6"><div class="empty"><h4>No budget data</h4><p>Add allocations and create records to track spend.</p></div></td></tr>`
    }</tbody></table></div></div>
    <div class="card" style="margin-top:18px"><div class="card-head"><h3>Budget Allocations</h3></div><div class="card-body"><div class="table-scroll"><table class="data" style="min-width:600px"><thead><tr><th>Campus / Project</th><th>Fiscal Year</th><th>Amount</th><th>Note</th><th>Action</th></tr></thead><tbody>${
      DB.budget.length?DB.budget.map(b=>`<tr><td>${esc(b.campus)}</td><td>${esc(b.year)||'—'}</td><td><b>${money(b.amount)}</b></td><td>${esc(b.note)||'<span class="muted">—</span>'}</td><td><div class="row-actions"><button class="act-btn" onclick="openBudgetForm('${b.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="act-btn del" onclick="deleteBudget('${b.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div></td></tr>`).join(""):`<tr><td colspan="5"><span class="muted">No allocations added.</span></td></tr>`

  const b=id?DB.budget.find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><h3>${id?"Edit":"Add"} Budget Allocation</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

function saveBudget(id){
  const g=n=>document.getElementById("b_"+n).value; const amount=g("amount");
  if(amount===""||isNaN(amount)){ toast("Valid amount required","","err"); return; }
  const obj={id:id||uid(),campus:g("campus"),year:g("year").trim(),amount:Number(amount),note:g("note").trim()};

function openUserForm(uid_){
  const u=uid_?DB.users.find(x=>x.id===uid_):null; const isSelf=u&&u.role==="superadmin";
  openModal(`<div class="modal-head"><h3>${u?"Edit":"Create"} User</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

    <div class="field"><label class="req">Full Name</label><input id="u_name" value="${esc(u?.name||'')}"></div>
    <div class="field"><label class="${u?'':'req'}">Password ${u?'(leave blank to keep)':''}</label><input type="text" id="u_pass" value=""></div>
    <div class="field"><label>Role</label><select id="u_role" ${isSelf?'disabled':''}><option value="admin" ${u?.role==="admin"?'selected':''}>Administrator</option><option value="superadmin" ${u?.role==="superadmin"?'selected':''}>Super Administrator</option></select></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser(${uid_?`'${esc(uid_)}'`:'null'})">Save User</button></div>`,{size:"narrow"});
}
function saveUser(uid_){
  const id=document.getElementById("u_id").value.trim(), name=document.getElementById("u_name").value.trim(), pass=document.getElementById("u_pass").value, role=document.getElementById("u_role").value;
  if(!id||!name){ toast("ID and name required","","err"); return; }
  if(uid_){
    const u=DB.users.find(x=>x.id===uid_); u.name=name; if(pass)u.password=pass; if(u.role!=="superadmin")u.role=role;
    toast("User updated","","ok");
  } else {
    if(!pass){ toast("Password required","","err"); return; }
    if(DB.users.some(x=>x.id.toLowerCase()===id.toLowerCase())){ toast("User ID already exists","","err"); return; }
    DB.users.push({id,name,password:pass,role,created:Date.now()}); toast("User created","","ok");
  }
  saveDB(); closeModal(); renderUsers();
}
function deleteUser(id){ confirmModal("Delete user?",`Account "${esc(id)}" will lose access immediately.`,()=>{ DB.users=DB.users.filter(x=>x.id!==id); saveDB(); renderUsers(); toast("User deleted","","ok"); },"Delete"); }

function doGet(e){ return handle(e.parameter); }
function doPost(e){
  var p = e.parameter || {};
  if (e.postData && e.postData.contents && !p.action) {
    try { p = JSON.parse(e.postData.contents); } catch (err) {}
  }
  return handle(p);
}
function handle(p){
  var callback = p.callback || "";
  var reply = function(o){
    var body = JSON.stringify(o);
    if (callback) {
      return ContentService.createTextOutput(callback + "(" + body + ")")
        .setMimeType(ContentService.MimeType.JAVASCRIPT);
    }
    return ContentService.createTextOutput(body)
      .setMimeType(ContentService.MimeType.JSON);
  };
  if (String(p.key || "") !== SECRET) return reply({ ok:false, error:"Bad key" });
  var props = PropertiesService.getScriptProperties();
  if (p.action === "ping") return reply({ ok:true });
  if (p.action === "save") {
    props.setProperty("DB", String(p.data || ""));
    props.setProperty("TS", String(p.ts || Date.now()));
    return reply({ ok:true });
  }
  if (p.action === "load") {
    var db = props.getProperty("DB");
    return reply({ ok:true, data: db ? JSON.parse(db) : null, ts: Number(props.getProperty("TS")||0) });
  }
  return reply({ ok:false, error:"Unknown action" });
}</textarea>

function uploadSavedSig(which,input){
  const f=input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{ DB.settings[which==="prep"?"prepSig":"apprSig"]=e.target.result; saveDB(); renderSettings(); toast("Signature uploaded","","ok"); };
  reader.readAsDataURL(f); input.value="";
}
