function filteredRecords(set){
  let base=DB[set];
  if(set==="procurement"){
    base=DB.procurement.slice();
    // Category is now driven purely by the dropdown filter (sidebar sub-lists removed)
    if(_procFilter2.list) base=base.filter(r=>r.listId===_procFilter2.list);
    if(_procFilter2.supplier) base=base.filter(r=>r.supplier===_procFilter2.supplier);
    if(_procFilter2.responsible) base=base.filter(r=>r.responsible===_procFilter2.responsible);
  }
  const result=base.filter(r=>{
    if(_filter.campus && r.campus!==_filter.campus) return false;
    if(_filter.status){ const st=(set!=="procurement"&&isOverdue(r))?"Overdue":r.status; if(st!==_filter.status) return false; }
    if(_filter.q){ const q=_filter.q.toLowerCase(); const blob=[r.name,r.pr,r.quote,r.po,r.supplier,r.remarks,r.category,r.depositInv,r.finalInv,r.responsible].join(" ").toLowerCase(); if(!blob.includes(q)) return false; }
    return true;
  });
  if(set==="procurement"){
    // Sort by PO Number ascending (smallest on top, largest at bottom). Blank PO numbers go last.
    result.sort((a,b)=>poSortKey(a.po)-poSortKey(b.po) || String(a.po||"").localeCompare(String(b.po||"")));
  }
  return result;
}
// Convert a PO number like "0626-01" or "PO-9" into a sortable numeric value (digits only, in order)
function poSortKey(po){
  const s=String(po||"").trim();
  if(!s) return Number.POSITIVE_INFINITY; // empty PO numbers sort to the bottom
  const digits=s.replace(/\D/g,"");
  return digits?Number(digits):Number.POSITIVE_INFINITY;
}

function moveProcList(id,dir){
  const lists=activeProcLists(); const i=lists.findIndex(l=>l.id===id);
  const j=i+dir; if(j<0||j>=lists.length){ return; }
  const a=lists[i],b=lists[j]; const ao=a.order, bo=b.order; a.order=bo; b.order=ao;
  saveDB(); buildNav();
}
function archiveProcList(id){
  const l=DB.procurementLists.find(x=>x.id===id);
  l.archived=true; saveDB(); closeModal(); buildNav();
  if(_procListId===id){ _procListId="all"; }
  if(CURRENT==="procurement") renderProcurement();
  toast("List archived","","ok");
}
function restoreProcList(id){ const l=DB.procurementLists.find(x=>x.id===id); l.archived=false; saveDB(); buildNav(); openProcListMenu(id); toast("List restored","","ok"); }
function deleteProcList(id){
  const count=procListCount(id);
  if(count>0){ toast("List not empty",`Move or archive its ${count} record(s) first`,"err"); return; }
  confirmModal("Delete empty list?","This list has no records and will be removed.",()=>{
    DB.procurementLists=DB.procurementLists.filter(x=>x.id!==id); saveDB(); closeModal(); buildNav();
    if(_procListId===id) _procListId="all";
    if(CURRENT==="procurement") renderProcurement(); toast("List deleted","","ok");
  },"Delete");
}

/* ---- attachment staging for forms ---- */
let _stagedFiles=[];
const FILE_WARN_BYTES=50*1024*1024;     // soft warning threshold (~50 MB); uploads are NOT blocked
function fileSizeLabel(bytes){ const mb=bytes/1024/1024; return mb>=1?(mb.toFixed(1)+" MB"):((bytes/1024).toFixed(0)+" KB"); }
function handleFileInput(input){
  const files=Array.from(input.files);
  files.forEach(f=>{
    if(f.size>FILE_WARN_BYTES){
      toast("Large file",`"${f.name}" is ${fileSizeLabel(f.size)}. It will still upload, but large files may be slow and use a lot of browser storage.`,"warn",7000);
    }
    const reader=new FileReader();
    reader.onload=e=>{
      _stagedFiles.push({name:f.name,size:f.size,type:f.type,data:e.target.result});
      renderStagedFiles();
    };
    reader.readAsDataURL(f);
  });
  input.value="";
}
function renderStagedFiles(){
  const host=document.getElementById("fileList"); if(!host)return;
  host.innerHTML=_stagedFiles.map((f,i)=>{
    const [lbl,col]=fileIcon(f.name);
    return `<div class="file-row"><div class="file-ic" style="background:${col}">${lbl}</div>
      <div style="flex:1;min-width:0"><div class="fn">${esc(f.name)}</div><div class="fs">${(f.size/1024).toFixed(1)} KB</div></div>
      <button class="act-btn" onclick="_stagedFiles.splice(${i},1);renderStagedFiles()" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
  }).join("");
}

function saveRecord(set,id){
  const g=n=>{ const el=document.getElementById("f_"+n); return el?el.value:""; };
  const name=g("name").trim(), budget=g("budget");
  if(!name){ toast("Name is required","Please enter a task / item name","err"); return; }
  if(set==="procurement" && !g("listId")){ toast("Procurement list is required","Select which list this record belongs to","err"); return; }
  if(!g("campus")){ toast("Campus is required","","err"); return; }
  if(budget===""||isNaN(budget)){ toast("Budget is required","Enter a valid number","err"); return; }
  // Duplicate-number check (procurement only): quote, PO, deposit & final invoice numbers must be unique
  if(set==="procurement"){
    const _curPo=document.getElementById("f_po")?g("po").trim():(id?((DB[set].find(x=>x.id===id)||{}).po||""):"");
    const dups=findProcDuplicates(id,{quote:g("quote").trim(),po:_curPo,depositInv:g("depositInv").trim(),finalInv:g("finalInv").trim()});
    if(dups.length){
      const msg=dups.map(d=>`<b>${esc(d.label)}</b> "${esc(d.value)}" is already used by record: <b>${esc(d.recName)}</b>${d.recList?` (${esc(d.recList)})`:""}.`).join("<br><br>");
      confirmModal("Duplicate number detected",msg+"<br><br>Do you want to save anyway?",()=>doSaveRecord(set,id),"Save anyway",false);
      return;
    }
  }
  doSaveRecord(set,id);
}
// Returns a list of fields that collide with another procurement record (excluding the one being edited)
function findProcDuplicates(id,vals){
  const checks=[["quote","Quote Number"],["po","PO Number"],["depositInv","Deposit Invoice #"],["finalInv","Final Payment Invoice #"]];
  const norm=s=>String(s||"").trim().toLowerCase();
  const out=[];
  checks.forEach(([key,label])=>{
    const v=vals[key]; if(!v) return; // blanks are allowed and never count as duplicates
    const hit=DB.procurement.find(r=>r.id!==id && norm(r[key])===norm(v));
    if(hit) out.push({field:key,label,value:v,recName:hit.name||"(unnamed)",recList:hit.listId?procListName(hit.listId):""});
  });
  return out;
}
async function doSaveRecord(set,id){
  const g=n=>{ const el=document.getElementById("f_"+n); return el?el.value:""; };
  const budget=g("budget");
  const numOrEmpty=v=>v===""||v==null||isNaN(v)?"":Number(v);
  const prev=id?DB[set].find(x=>x.id===id):null;
  // Move staged file blobs into IndexedDB; record stores only light references
  const fileRefs=await persistStagedFiles(_stagedFiles);
  const obj={
    id:id||uid(), name:g("name").trim(), campus:g("campus"), category:g("category")||(prev?prev.category:""), pr:g("pr").trim(), quote:g("quote").trim(),
    po:(document.getElementById("f_po")?g("po").trim():(prev?prev.po:""))||"", supplier:g("supplier"), budget:Number(budget), status:g("status"), due:g("due"),
    confirm:g("confirm"),
    deposit:numOrEmpty(g("deposit")), depositInv:g("depositInv").trim(),
    finalPay:numOrEmpty(g("finalPay")), finalInv:g("finalInv").trim(),
    remarks:g("remarks").trim(), files:fileRefs,
    created:id?prev.created:Date.now(), updated:Date.now()
  };
  if(set==="procurement"){
    obj.listId=g("listId")||""; obj.responsible=g("responsible").trim();
    obj.unit=g("unit").trim();
    // Budget line items: keep only rows that have a price or description; recompute budget from them
    const items=(_procItems2||[]).filter(it=>(Number(it.price)||0)>0 || (it.desc&&it.desc.trim()))
      .map(it=>({desc:(it.desc||"").trim(),qty:Number(it.qty)||0,price:Number(it.price)||0}));
    obj.items=items;
    if(items.length){ obj.budget=items.reduce((a,it)=>a+(it.qty*it.price),0); }
    if(typeof poRememberItems==="function") poRememberItems(items); // feed the shared item price catalog
    obj.comments=prev?(prev.comments||[]):[];
    obj.history=prev?(prev.history||[]):[];
    obj.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:id?"Record updated":"Record created"});
  }
  // Snapshot for rollback if storage save fails (e.g. quota exceeded)
  const _backup=JSON.parse(JSON.stringify(DB[set]));
  if(id){
    const matches=DB[set].filter(x=>x.id===id);
    if(matches.length>1){ // de-dupe any accidental id collisions, keep only the one we're editing
      let kept=false; DB[set]=DB[set].filter(x=>{ if(x.id!==id) return true; if(kept) return false; kept=true; return true; });
    }
    const i=DB[set].findIndex(x=>x.id===id);
    if(i>=0){ DB[set][i]=obj; } else { DB[set].unshift(obj); }
  } else { DB[set].unshift(obj); }
  const okSaved=saveDB();
  if(!okSaved){
    // storage failed (quota) — restore previous data and keep the form open so nothing is lost
    DB[set]=_backup;
    return; // saveDB already showed an error toast explaining storage is full
  }
  if(id){ toast("Record updated", (set==="procurement"&&obj.files&&obj.files.length)?(obj.files.length+" attachment(s) saved"):"Changes saved successfully","ok"); }
  else { toast("Record added", set==="procurement"?("Saved to “"+procListName(obj.listId)+"”"+((obj.files&&obj.files.length)?(" · "+obj.files.length+" file(s)"):"")):"New record created","ok"); }
  closeModal();
  if(set==="procurement"){
    // jump to the list the record was saved to, so it's always visible (and never hidden by the current filter)
    if(obj.listId && _procListId!=="all" && _procListId!==obj.listId) _procListId=obj.listId;
    renderProcurement(); buildNav();
    if(!id){ try{ openProcDrawer(obj.id); toast("Record created","It's highlighted at the top of the list — you can create its Purchase Order right from this panel.","ok",6000); }catch(e){} }
  } else { paintTable(set); buildNav(); }
}

/* attachment preview/download */
function getFile(set,id,i){ return DB[set].find(x=>x.id===id).files[i]; }
async function previewFile(set,id,i){
  const f=getFile(set,id,i); const ext=(f.name.split(".").pop()||"").toLowerCase();
  const data=await resolveFileData(f);
  let body="";
  if(!data){ body=`<div style="text-align:center;padding:40px"><p class="muted">File data could not be loaded.</p></div>`; }
  else if(["jpg","jpeg","png","gif","webp"].includes(ext)) body=`<img src="${data}" style="max-width:100%;border-radius:8px">`;
  else if(ext==="pdf") body=`<iframe src="${data}" style="width:100%;height:60vh;border:none;border-radius:8px"></iframe>`;
  else { const [lbl,col]=fileIcon(f.name); body=`<div style="text-align:center;padding:40px"><div class="file-ic" style="background:${col};width:64px;height:64px;font-size:16px;margin:0 auto 14px">${lbl}</div><p style="font-weight:600">${esc(f.name)}</p><p class="muted">Preview not available for this file type.</p><button class="btn btn-primary" style="margin-top:14px" onclick="downloadFile('${set}','${id}',${i})">Download File</button></div>`; }
  openModal(`<div class="modal-head"><h3>${esc(f.name)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="downloadFile('${set}','${id}',${i})">Download</button></div>`,{size:"wide"});
}
async function downloadFile(set,id,i){ const f=getFile(set,id,i); const data=await resolveFileData(f); if(!data){ toast("File unavailable","Could not load file data","err"); return; } const a=document.createElement("a"); a.href=data; a.download=f.name; a.click(); toast("Download started",f.name,"ok"); }
function downloadRecord(set,id){
  const r=DB[set].find(x=>x.id===id);
  const blob=new Blob([JSON.stringify(r,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${set}-${(r.name||'record').replace(/\s+/g,'_')}.json`; a.click();
  toast("Record exported","Downloaded as JSON","ok");
}

function renderBudget(){

  recs.forEach(r=>{ if(byCampus[r.campus]){ byCampus[r.campus].spent+=Number(r.budget)||0; byCampus[r.campus].count++; } });
  const totalAlloc=DB.budget.reduce((a,b)=>a+(Number(b.amount)||0),0);
  const totalSpent=recs.reduce((a,r)=>a+(Number(r.budget)||0),0);
  document.getElementById("content").innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="ic ic-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="val">${money(totalAlloc).replace(/\.00$/,"")}</div><div class="lbl">Total Allocated Budget</div></div>

        return `<tr><td><b>${c}</b></td><td>${money(b.alloc)}</td><td>${money(b.spent)}</td><td style="color:${rem<0?'var(--danger)':'var(--accent)'}"><b>${money(rem)}</b></td><td><span class="chip-cat">${b.count}</span></td>
        <td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden;min-width:70px"><div style="height:100%;width:${pct}%;background:${pct>90?'var(--danger)':pct>70?'var(--warn)':'var(--accent)'}"></div></div><span style="font-size:12px;font-weight:700">${pct}%</span></div></td></tr>`;

function saveUser(uid_){
  const id=document.getElementById("u_id").value.trim(), name=document.getElementById("u_name").value.trim(), pass=document.getElementById("u_pass").value, role=document.getElementById("u_role").value;
  const title=(document.getElementById("u_title").value||"").trim(), tgChatId=(document.getElementById("u_tgchat").value||"").trim();
  if(!id||!name){ toast("ID and name required","","err"); return; }
  if(uid_){
    const u=DB.users.find(x=>x.id===uid_); u.name=name; if(pass)u.password=pass; if(u.role!=="superadmin")u.role=role; u.title=title; u.tgChatId=tgChatId;
    toast("User updated","","ok");
  } else {
    if(!pass){ toast("Password required","","err"); return; }
    if(DB.users.some(x=>x.id.toLowerCase()===id.toLowerCase())){ toast("User ID already exists","","err"); return; }
    DB.users.push({id,name,password:pass,role,title,tgChatId,created:Date.now()}); toast("User created","","ok");
  }
  saveDB(); closeModal(); renderUsers();
}

function doGet(e){ return handle(e.parameter); }
function doPost(e){
  var p = e.parameter || {};
  if (e.postData && e.postData.contents && !p.action) {
    try { p = JSON.parse(e.postData.contents); } catch (err) {}
  }
  return handle(p);
}
function handle(p){
  var callback = p.callback || "";
  var reply = function(o){
    var body = JSON.stringify(o);
    if (callback) {
      return ContentService.createTextOutput(callback + "(" + body + ")")
        .setMimeType(ContentService.MimeType.JAVASCRIPT);
    }
    return ContentService.createTextOutput(body)
      .setMimeType(ContentService.MimeType.JSON);
  };
  if (String(p.key || "") !== SECRET) return reply({ ok:false, error:"Bad key" });
  var props = PropertiesService.getScriptProperties();
  if (p.action === "ping") return reply({ ok:true });
  if (p.action === "save") {
    props.setProperty("DB", String(p.data || ""));
    props.setProperty("TS", String(p.ts || Date.now()));
    return reply({ ok:true });
  }
  if (p.action === "load") {
    var db = props.getProperty("DB");
    return reply({ ok:true, data: db ? JSON.parse(db) : null, ts: Number(props.getProperty("TS")||0) });
  }
  return reply({ ok:false, error:"Unknown action" });
}</textarea>

async function testTelegram(){
  const token=(DB.settings.tgToken||"").trim(), chat=(DB.settings.tgChat||"").trim();
  if(!token||!chat){ toast("Missing setup","Enter both Bot Token and Chat ID first","err"); return; }
  try{
    const res=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text:"✅ Test from "+(DB.settings.orgName||"Procurement System")+". Telegram delivery is working."})});
    const j=await res.json();
    if(j.ok) toast("Test sent","Check the approver's Telegram","ok");
    else toast("Telegram error",j.description||"Check token & chat ID","err",7000);
  }catch(e){ toast("Network error","Could not reach Telegram","err",6000); }
}
// Send a PDF Blob to Telegram via the bot
async function telegramSendPDF(blob,filename,caption){
  const token=(DB.settings.tgToken||"").trim(), chat=(DB.settings.tgChat||"").trim();
  if(!token||!chat) return {ok:false,reason:"not_configured"};
  try{
    const fd=new FormData();
    fd.append("chat_id",chat);
    fd.append("caption",caption||DB.settings.tgCaption||"Purchase Order");
    fd.append("document",blob,filename);
    const res=await fetch(`https://api.telegram.org/bot${token}/sendDocument`,{method:"POST",body:fd});
    const j=await res.json();
    return j.ok?{ok:true}:{ok:false,reason:j.description||"telegram_error"};
  }catch(e){ return {ok:false,reason:"network"}; }
}

function doReset(){
  const pass=document.getElementById("reset_pass").value;
  const me=DB.users.find(u=>u.id===SESSION.id);
  if(!me||me.password!==pass){ toast("Incorrect password","Reset cancelled","err"); return; }
  const alsoUsers=document.getElementById("reset_users").checked;
  const keepSettings=DB.settings;
  const fresh=defaultDB(); fresh.settings=keepSettings;
  if(!alsoUsers) fresh.users=DB.users;
  DB=fresh; saveDB();
  if(alsoUsers){ closeModal(); toast("All data reset","Users restored to default","ok"); doLogout(); return; }
  closeModal(); buildNav(); navigate("dashboard"); toast("All data reset","Records cleared to zero","ok");
}

const PO_SUPPLIER_DEFAULT=["Westec Corporation","Kheang Chanpheavy","Office: +855 23 882 580","Mobile: +855 16 991 580"];
// Generate next PO# as mmyy-## (e.g. 0626-01). Sequence resets each month.
function nextPONumber(){
  const d=new Date(); const mm=String(d.getMonth()+1).padStart(2,"0"); const yy=String(d.getFullYear()%100).padStart(2,"0");
  const prefix=mm+yy+"-";
  let max=0;
  DB.po.forEach(p=>{ if(p.poNo&&p.poNo.indexOf(prefix)===0){ const n=parseInt(p.poNo.slice(prefix.length),10); if(!isNaN(n)&&n>max)max=n; } });
  return prefix+String(max+1).padStart(2,"0");
}
let _poFilter={q:"",status:"",campus:""};
function poStatusClass(s){ return "s-"+s.toLowerCase().replace(/[^a-z]/g,""); }
function renderPO(){
  _poFilter={q:"",status:"",campus:""};
  const total=DB.po.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const open=DB.po.filter(p=>!["Closed","Cancelled","Delivered"].includes(p.status)).length;
  document.getElementById("content").innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="ic ic-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="val">${DB.po.length}</div><div class="lbl">Total Purchase Orders</div></div>
      <div class="kpi"><div class="ic ic-orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="val">${open}</div><div class="lbl">Open / In Progress</div></div>
      <div class="kpi"><div class="ic ic-green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="val">${money(total).replace(/\.00$/,"")}</div><div class="lbl">Total PO Value</div></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openPOForm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create Purchase Order</button>
      <div class="grow"></div>
      <input class="filter-sel" id="poQ" placeholder="Search PO..." style="min-width:160px" oninput="_poFilter.q=this.value;paintPO()">
      <select class="filter-sel" id="poCampus" onchange="_poFilter.campus=this.value;paintPO()"><option value="">All Campus/Project</option>${PROC_CAMPUSES.map(c=>`<option>${c}</option>`).join("")}</select>
      <select class="filter-sel" onchange="_poFilter.status=this.value;paintPO()"><option value="">All Status</option>${PO_STATUS.map(s=>`<option>${s}</option>`).join("")}</select>
    </div>
    <div id="poHost"></div>`;
  paintPO();
}
function filteredPO(){
  return DB.po.filter(p=>{
    if(_poFilter.status && p.status!==_poFilter.status) return false;
    if(_poFilter.campus && p.campus!==_poFilter.campus) return false;
    if(_poFilter.q){ const q=_poFilter.q.toLowerCase(); if(![p.poNo,p.supplier,p.campus,p.pr,p.remarks].join(" ").toLowerCase().includes(q)) return false; }
    return true;
  });
}
function paintPO(){
  const rows=filteredPO(); const host=document.getElementById("poHost");
  if(!host) return; // PO view not currently mounted (e.g. PO created from another module)
  if(!rows.length){ host.innerHTML=`<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><h4>No purchase orders yet</h4><p>Create your first PO to start tracking.</p></div>`; return; }
  host.innerHTML=`<div class="po-scroll"><table class="data po-table" style="min-width:1000px"><thead><tr><th>PO Number</th><th>Supplier</th><th>Campus / Project</th><th>PR Number</th><th>Items</th><th>Amount</th><th>Status</th><th>Order Date</th><th>Expected Delivery</th><th>Attachment</th><th>Action</th></tr></thead><tbody>${
    rows.map(p=>{
      const att=(p.files&&p.files.length)?`<span class="att-pill" onclick="previewFile('po','${p.id}',0)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${p.files.length} file(s)</span>`:'<span class="muted">—</span>';
      return `<tr><td><b>${esc(p.poNo)}</b></td><td>${esc(p.supplier)||'<span class="muted">—</span>'}</td><td>${p.campus?`<span class="campus-tag ${campusTagClass(p.campus)}">${esc(p.campus)}</span>`:'<span class="muted">—</span>'}</td><td>${esc(p.pr)||'<span class="muted">—</span>'}</td><td><span class="chip-cat">${(p.items||[]).length} line(s)</span></td><td><b>${money(p.amount)}</b></td><td><span class="status ${poStatusClass(p.status)}">${esc(p.status)}</span></td><td>${fmtDate(p.orderDate)}</td><td>${fmtDate(p.delivery)}</td><td>${att}</td>

async function savePO(id){

// Check PO number / PR number / Quote number against all other POs (case-insensitive, blanks ignored)
function findPODuplicates(id,vals){
  const checks=[["poNo","PO Number"],["pr","PR Number"],["quote","Quote Number"]];
  const norm=s=>String(s||"").trim().toLowerCase();
  const out=[];
  checks.forEach(([key,label])=>{
    const v=vals[key]; if(!v) return;
    const hit=DB.po.find(r=>r.id!==id && norm(r[key])===norm(v));
    if(hit) out.push({field:key,label,value:v,poNo:hit.poNo||"(no number)",supplier:hit.supplier||""});
  });
  return out;
}
let _poFromRecord=null;
// Back-fill: for procurement records missing a PO number, find a PO that shares the same
// PR Number or Quote Number and copy its PO number onto the record. Returns count filled.
function backfillProcPONumbers(force){
  const norm=s=>String(s||"").trim().toLowerCase();
  let filled=0;
  (DB.procurement||[]).forEach(rec=>{
    if(!force && rec.po && rec.po.trim()) return; // already has a PO number
    const recPr=norm(rec.pr), recQ=norm(rec.quote);
    if(!recPr && !recQ) return;
    // find a PO matching by PR or Quote (that actually has a PO number)
    const hit=(DB.po||[]).find(po=>{
      if(!po.poNo||!String(po.poNo).trim()) return false;
      const poPr=norm(po.pr), poQ=norm(po.quote);
      return (recPr && poPr && recPr===poPr) || (recQ && poQ && recQ===poQ);
    });
    if(hit && (rec.po||"")!==hit.poNo){
      rec.po=hit.poNo; rec.updated=Date.now();
      if(Array.isArray(rec.history)) rec.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"PO number auto-filled ("+hit.poNo+") from matching PO"});
      // also link them for future edits
      if(!hit.fromRecord) hit.fromRecord=rec.id;
      filled++;
    }
  });
  if(filled>0) saveDB();
  return filled;
}

function initSignPad(existing){
  const c=document.getElementById("sigCanvas"); if(!c)return;
  const ctx=c.getContext("2d");

  const rect=c.getBoundingClientRect(); c.width=rect.width; c.height=rect.height;
  ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#10243e";

  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); _sigPad.drawing=true; _sigPad.last=pos(e); };

// Issue & Send: ensure signatures, build the signed PDF, deliver to Telegram (or fallback)
async function issueAndSendPO(id){
  const p=DB.po.find(x=>x.id===id);
  // auto-apply saved signatures if not already signed
  if(!poSig(p,"prepared") && DB.settings.prepSig) applySavedSig_quiet(id,"prepared");

  const blob=downloadPOPdf(id,"blob");
  const filename=`PO ${p.poNo}.pdf`;
  const caption=`${DB.settings.tgCaption||"Purchase Order for your approval"}\nPO#: ${p.poNo}\nSupplier: ${p.supplier||"-"}\nAmount: ${money(p.amount)}`;
  if(DB.settings.tgToken && DB.settings.tgChat){
    toast("Sending to Telegram…","","ok");
    const r=await telegramSendPDF(blob,filename,caption);
    if(r.ok){ p.status=p.status==="Draft"?"Ordered":p.status; p.issuedAt=Date.now(); saveDB(); closeModal(); paintPO(); toast("PO sent to Telegram","Delivered to the approver","ok"); return; }
    toast("Telegram send failed",(r.reason||"")+" — downloading PDF instead","err",6000);
  }
  // Fallback: download the PDF and open Telegram with a prefilled message to attach it
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  const msg=encodeURIComponent(caption+"\n(PDF downloaded — please attach it here)");
  window.open("https://t.me/share/url?url=&text="+msg,"_blank");
  toast("PDF downloaded","Telegram opened — attach the downloaded PDF","warn",7000);
}
function applySavedSig_quiet(id,role){
  const p=DB.po.find(x=>x.id===id); const isAppr=role==="approved";
  const img=isAppr?DB.settings.apprSig:DB.settings.prepSig; if(!img)return;
  p.signatures=p.signatures||{};
  // Store a REFERENCE ("saved:prep"/"saved:appr") rather than a full copy of the image.
  // 36 POs x 2 signatures used to mean ~72 duplicate base64 images filling the records cache.
  p.signatures[role]={name:(isAppr?DB.settings.apprName:DB.settings.prepName)||(isAppr?PO_COMPANY.approvedBy:PO_COMPANY.preparedBy),title:(isAppr?DB.settings.apprTitle:DB.settings.prepTitle)||(isAppr?PO_COMPANY.approvedTitle:PO_COMPANY.preparedTitle),sigRef:(isAppr?"appr":"prep"),date:new Date().toISOString().slice(0,10),by:(SESSION&&SESSION.name)||"System",at:Date.now(),saved:true};
  saveDB();
}
// Resolve a signature record to a displayable image (handles both new refs and old inline copies)
function sigImage(s){
  if(!s) return "";
  if(s.sigRef) return (s.sigRef==="appr"?DB.settings.apprSig:DB.settings.prepSig)||"";
  return s.dataUrl||"";
}
// One-time cleanup: replace duplicated inline signature images on POs with light references.
function dedupePOSignatures(){
  let freed=0, changed=0;
  const prep=DB.settings.prepSig||"", appr=DB.settings.apprSig||"";
  (DB.po||[]).forEach(p=>{
    if(!p.signatures) return;
    ["prepared","approved"].forEach(role=>{
      const s=p.signatures[role];
      if(s && s.dataUrl){
        const isAppr=(role==="approved");
        const matches=(isAppr? s.dataUrl===appr : s.dataUrl===prep);
        // If it matches the saved signature, swap for a reference. Otherwise keep it (it's a hand-drawn one-off).
        if(matches){ freed+=s.dataUrl.length; delete s.dataUrl; s.sigRef=isAppr?"appr":"prep"; changed++; }
      }
    });
  });
  if(changed>0) saveDB({noRev:true,noPush:true});   // representation-only change — must not forge freshness
  return {changed, freed};
}

function downloadPOExcel(id){
  const p=DB.po.find(x=>x.id===id);
  const wb=XLSX.utils.book_new();
  const d=p.orderDate?new Date(p.orderDate):new Date();
  const dstr=d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}).replace(/ /g,"-");
  // Build a 2D array matching the template layout (A..F = cols 0..5)
  const rows=[];
  for(let i=0;i<33;i++) rows.push(["","","","","",""]);
  rows[1][5]="PURCHASE ORDER";                         // F2
  rows[2][4]="DATE:"; rows[2][5]=dstr;                 // E3/F3
  rows[3][0]=PO_COMPANY.addr[0]; rows[3][4]="PO#:"; rows[3][5]=p.poNo;  // A4/E4/F4
  rows[4][0]=PO_COMPANY.addr[1];                       // A5
  rows[5][0]=PO_COMPANY.addr[2];                       // A6
  rows[6][0]=PO_COMPANY.addr[3];                       // A7
  rows[8][0]="SUPPLIER";                               // A9
  // Full supplier block: selected supplier's contact details, else default company block
  const supObj=p.supplier?DB.suppliers.find(s=>s.name===p.supplier):null;
  const supBlock=supObj?[supObj.name,supObj.contact,supObj.phone?("Office: "+supObj.phone):"",supObj.email].filter(Boolean):(p.supplier?[p.supplier]:PO_SUPPLIER_DEFAULT.slice());
  supBlock.slice(0,4).forEach((line,i)=>{ rows[9+i][0]=line; });  // A10..A13
  // header row 15 (index 14)
  rows[14]=["ITEM#","DESCRIPTION","","QTY","UNIT PRICE","TOTAL"];
  // 10 item rows (index 15..24); only actual items get values, blanks stay empty
  (p.items||[]).slice(0,10).forEach((it,i)=>{
    const r=15+i; const qty=Number(it.qty)||0, price=Number(it.price)||0;
    rows[r]=[i+1,it.desc||"","",qty,price,qty*price];
  });
  // campus/quote + total row (index 25, right after the 10 item rows)
  const FOOT=25;
  rows[FOOT][0]="Campus: "+(p.campus||"")+"\nQUOTE#: "+(p.quote||"")+(p.quoteDesc?", "+p.quoteDesc:"");
  rows[FOOT][4]="Total:"; rows[FOOT][5]=Number(p.amount)||0;
  rows[FOOT+2][0]="Prepared by:"; rows[FOOT+2][4]="Approved by:";
  rows[FOOT+6][0]=PO_COMPANY.preparedBy; rows[FOOT+6][4]=PO_COMPANY.approvedBy;
  rows[FOOT+7][0]=PO_COMPANY.preparedTitle; rows[FOOT+7][4]=PO_COMPANY.approvedTitle;
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // column widths
  ws["!cols"]=[{wch:10},{wch:18},{wch:24},{wch:10},{wch:14},{wch:13}];
  // merges to match template
  ws["!merges"]=[
    {s:{r:1,c:5},e:{r:1,c:5}},
    {s:{r:FOOT,c:0},e:{r:FOOT,c:3}},
    {s:{r:FOOT+2,c:0},e:{r:FOOT+2,c:1}}
  ];
  for(let i=15;i<FOOT;i++) ws["!merges"].push({s:{r:i,c:1},e:{r:i,c:2}});
  ws["!merges"].push({s:{r:14,c:1},e:{r:14,c:2}});
  XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  XLSX.writeFile(wb,`PO ${p.poNo} - ${(p.supplier||"PO").slice(0,20)}.xlsx`);
  toast("PO Excel downloaded","Template format","ok");
}

function acTaskFiltered(){
  const f=_acTaskFilter;
  return DB.acTasks.filter(t=>{

    if(f.q){ const q=f.q.toLowerCase(); if(![t.task,t.campus,t.pr,t.quote,t.invoiceNo,t.notes].join(" ").toLowerCase().includes(q)) return false; }
    return true;
  });
}

async function saveACTask(id){
  const g=n=>{ const el=document.getElementById("at_"+n); return el?el.value:""; };
  const task=g("task").trim();
  if(!task){ toast("Task is required","Please enter what needs to be done","err"); return; }
  const fileRefs=await persistStagedFiles(_stagedFiles);
  const prev=id?DB.acTasks.find(x=>x.id===id):null;
  const obj={
    id:id||uid(),
    task, campus:g("campus").trim(), model:g("model").trim(), pr:g("pr").trim(), quote:g("quote").trim(),
    budget:g("budget")===""?"":(Number(g("budget"))||0), status:g("status"),
    invoiceDate:g("invoiceDate"), invoiceNo:g("invoiceNo").trim(), notes:g("notes").trim(),
    files:fileRefs, created:prev?prev.created:Date.now(), updated:Date.now()
  };
  if(id){ const i=DB.acTasks.findIndex(x=>x.id===id); DB.acTasks[i]=obj; toast("Task updated","","ok"); }
  else { DB.acTasks.unshift(obj); toast("Task added","","ok"); }
  saveDB(); closeModal(); renderACTasks(); buildNav();
}

function deleteACTask(id){
  const t=DB.acTasks.find(x=>x.id===id); if(!t) return;
  confirmModal("Delete task?",`"${esc(t.task||"this task")}" will be permanently removed.`,()=>{
    DB.acTasks=DB.acTasks.filter(x=>x.id!==id); saveDB(); renderACTasks(); buildNav(); toast("Task deleted","","ok");
  },"Delete");
}

async function acTaskOpenFile(id,idx){
  const t=DB.acTasks.find(x=>x.id===id); if(!t||!t.files||!t.files[idx]) return;
  const f=t.files[idx]; const data=await resolveFileData(f);
  if(!data){ toast("File unavailable","It may not have been included in this backup","err"); return; }
  const w=window.open("","_blank");
  if(w) w.document.write(`<iframe src="${data}" style="border:0;width:100%;height:100vh"></iframe>`);
}

/* ============================================================
   PO APPROVAL ROUTING + NOTIFICATIONS
   Preparer submits a PO -> routes to a chosen approver's ACCOUNT
   -> that account sees a notification bell alert
   -> only that approver (or a super admin, but never the submitter) can Approve/Reject
============================================================ */

// --- approval object accessor ---
function poApproval(p){ return p && p.approval ? p.approval : null; }
function poApprState(p){ const a=poApproval(p); return a? a.state : "draft"; }

// Am I the assigned approver for this PO?
function poIsMyApproval(p){ const a=poApproval(p); return !!(a && SESSION && a.approverId===SESSION.id); }
// Did I submit this PO?
function poIsMySubmission(p){ const a=poApproval(p); return !!(a && SESSION && a.submittedById===SESSION.id); }
// Can the current user act on (approve/reject) this PO? (assigned approver or super admin, but NOT the person who submitted it)
function poCanDecide(p){
  const a=poApproval(p); if(!a || a.state!=="pending" || !SESSION) return false;
  if(a.submittedById===SESSION.id) return false;              // separation of duties
  return a.approverId===SESSION.id || isSuper();
}

// --- notifications (derived from PO state for the logged-in user) ---
function poMyPendingApprovals(){
  if(!SESSION) return [];
  return DB.po.filter(p=>{ const a=poApproval(p); return a && a.state==="pending" && a.submittedById!==SESSION.id && (a.approverId===SESSION.id || isSuper()); })
    .sort((x,y)=>(y.approval.submittedAt||0)-(x.approval.submittedAt||0));
}
function poMyDecisionUpdates(){
  if(!SESSION) return [];
  return DB.po.filter(p=>{ const a=poApproval(p); return a && (a.state==="approved"||a.state==="rejected") && a.submittedById===SESSION.id; })
    .sort((x,y)=>(y.approval.decidedAt||0)-(x.approval.decidedAt||0));
}
// per-user "seen decisions" tracking (local, so decision alerts stop nagging once viewed)
function poSeenKey(){ return "pmpts_seen_dec_"+((SESSION&&SESSION.id)||"anon"); }
function poSeenDecisions(){ try{ return JSON.parse(localStorage.getItem(poSeenKey())||"[]"); }catch(e){ return []; } }
function poMarkDecisionsSeen(){
  const ids=poMyDecisionUpdates().map(p=>p.id+":"+(p.approval.decidedAt||0));
  localStorage.setItem(poSeenKey(), JSON.stringify(ids));
}
function poUnseenDecisions(){
  const seen=poSeenDecisions();
  return poMyDecisionUpdates().filter(p=> !seen.includes(p.id+":"+(p.approval.decidedAt||0)) );
}
function poNotifCount(){ return poMyPendingApprovals().length + poUnseenDecisions().length; }

// --- render the topbar bell badge ---
function renderNotifBell(){
  const badge=document.getElementById("notifBadge"); if(!badge) return;
  const n=poNotifCount();
  if(n>0){ badge.textContent=n>99?"99+":String(n); badge.style.display="flex"; }
  else { badge.style.display="none"; }
}

// --- notification dropdown panel ---
let _notifOutsideHandler=null;
function toggleNotifPanel(ev){
  if(ev){ ev.stopPropagation(); }
  const panel=document.getElementById("notifPanel"); if(!panel) return;
  if(panel.style.display==="block"){ closeNotifPanel(); return; }
  panel.innerHTML=notifPanelHTML();
  panel.style.display="block";
  poMarkDecisionsSeen();          // opening the panel clears the "new decision" part of the badge
  renderNotifBell();
  setTimeout(()=>{ _notifOutsideHandler=(e)=>{ if(!panel.contains(e.target) && e.target.id!=="notifBtn" && !document.getElementById("notifBtn").contains(e.target)) closeNotifPanel(); };
    document.addEventListener("click",_notifOutsideHandler); },0);
}
function closeNotifPanel(){
  const panel=document.getElementById("notifPanel"); if(panel) panel.style.display="none";
  if(_notifOutsideHandler){ document.removeEventListener("click",_notifOutsideHandler); _notifOutsideHandler=null; }
}
function notifOpenPO(id){ closeNotifPanel(); navigate("purchaseorder"); setTimeout(()=>{ if(typeof viewPO==="function") viewPO(id); },130); }
function notifPanelHTML(){
  const pend=poMyPendingApprovals();
  const upd=poMyDecisionUpdates().slice(0,6);
  const item=(icon,color,title,sub,onclick)=>`<div class="notif-item" onclick="${onclick}">
     <div class="notif-ic" style="background:${color}22;color:${color}">${icon}</div>
     <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px">${title}</div><div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div></div></div>`;
  let html=`<div class="notif-head"><span style="font-weight:800;font-size:13px">Notifications</span><button class="act-btn" onclick="closeNotifPanel()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;
  if(!pend.length && !upd.length){ html+=`<div class="muted" style="padding:22px 16px;text-align:center;font-size:12.5px">You're all caught up — no notifications.</div>`; return html; }
  if(pend.length){
    html+=`<div class="notif-group">Needs your approval (${pend.length})</div>`;
    html+=pend.map(p=>item('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
      "#d97706", `${esc(p.poNo)} needs your approval`,
      `${esc(p.supplier||"—")} · ${money(p.amount)} · from ${esc(p.approval.submittedByName||"—")}`,
      `notifOpenPO('${p.id}')`)).join("");
  }
  if(upd.length){
    html+=`<div class="notif-group">Updates on your submissions</div>`;
    html+=upd.map(p=>{ const ap=p.approval.state==="approved";
      return item(ap?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',

      `${ap?"Approved":"Rejected"} by ${esc(p.approval.approverName||"—")}${(!ap&&p.approval.note)?" · "+esc(p.approval.note):""}`,
      `notifOpenPO('${p.id}')`); }).join("");

  const others=DB.users.filter(u=> !SESSION || u.id!==SESSION.id );
  if(!others.length){
    openModal(`<div class="modal-head"><h3>No approver available</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body"><p style="font-size:13.5px;line-height:1.6">To route this PO for approval you first need an account for your approver (e.g. your VP of Operations).</p>
    <p class="muted" style="font-size:12.5px">Go to <b>User Management</b> and add an account for them, then come back and submit.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="closeModal();navigate('users')">Open User Management</button></div>`);

  openModal(`<div class="modal-head"><h3>Submit PO for Approval</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p class="muted" style="font-size:12.5px;margin:0 0 14px">This sends <b>${esc(p.poNo)}</b> (${money(p.amount)}) to the selected person's account. They'll see it via the in-app notification bell${((DB.settings.tgToken||"").trim() && DB.settings.tgNotifyApprover)?" and a Telegram alert on their phone":""}.</p>
    <div class="field"><label class="req">Send to (approver)</label><select id="po_appr_select">${others.map(u=>`<option value="${esc(u.id)}" ${u.id===def?'selected':''}>${esc(u.name)}${u.role==="superadmin"?" (Super Admin)":""}</option>`).join("")}</select></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="po_appr_default" checked style="width:auto"> Remember this person as my default approver</label>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="poDoSubmit('${id}')">Submit for Approval</button></div>`);
}
function poDoSubmit(id){
  const p=DB.po.find(x=>x.id===id); if(!p) return;
  const sel=document.getElementById("po_appr_select"); const approverId=sel?sel.value:null;
  const approver=DB.users.find(u=>u.id===approverId); if(!approver){ toast("Pick an approver","","err"); return; }
  const remember=document.getElementById("po_appr_default"); if(remember&&remember.checked) DB.settings.defaultApproverId=approverId;
  p.approval={
    state:"pending", approverId:approver.id, approverName:approver.name,
    submittedById:(SESSION&&SESSION.id)||"", submittedByName:(SESSION&&SESSION.name)||"System",
    submittedAt:Date.now(), decidedAt:null, note:""
  };
  // stamp preparer in the existing workflow + apply preparer signature if configured
  const w=poWorkflow(p);
  w.requested={name:DB.settings.prepName||(SESSION&&SESSION.name)||PO_COMPANY.preparedBy, title:DB.settings.prepTitle||PO_COMPANY.preparedTitle, at:Date.now(), by:(SESSION&&SESSION.name)||"System"};
  w.approved=null; // clear any prior approval stamp (e.g. on resubmit)
  if(DB.settings.prepSig) applySavedSig_quiet(id,"prepared");
  p.status="Pending Approval"; p.issuedAt=Date.now();
  saveDB(); closeModal(); if(typeof viewPO==="function") viewPO(id); buildNav(); renderNotifBell();
  toast("Submitted for approval","Sent to "+approver.name+" — they'll see it in the app","ok",5000);
  if(DB.settings.tgNotifyApprover) poNotifyApproverTelegram(p, approver);
}

// --- approve ---
function poApproveRouted(id){
  const p=DB.po.find(x=>x.id===id); if(!p) return;
  if(!poCanDecide(p)){ toast("Not permitted","Only the assigned approver can approve this PO","err"); return; }
  const a=p.approval;
  confirmModal("Approve this Purchase Order?",`${esc(p.poNo)} (${money(p.amount)}) will be marked <b>Approved</b>${DB.settings.apprSig?", and the approver's e-signature applied":""}.`,()=>{
    a.state="approved"; a.decidedAt=Date.now(); a.decidedById=(SESSION&&SESSION.id)||""; a.approverName=(SESSION&&SESSION.name)||a.approverName;
    const meU=DB.users.find(u=>SESSION&&u.id===SESSION.id);
    const w=poWorkflow(p);
    w.approved={name:(SESSION&&SESSION.name)||DB.settings.apprName||PO_COMPANY.approvedBy, title:(meU&&meU.title)||DB.settings.apprTitle||PO_COMPANY.approvedTitle, at:Date.now(), by:(SESSION&&SESSION.name)||"System"};
    if(DB.settings.apprSig) applySavedSig_quiet(id,"approved");
    p.status="Approved"; p.approvedAt=Date.now();
    saveDB(); if(typeof viewPO==="function") viewPO(id); buildNav(); renderNotifBell();
    toast("Purchase order approved","","ok");
    if(DB.settings.tgNotifySubmitter!==false) poNotifySubmitterTelegram(p);
  },"Approve",false);
}

// --- reject ---
function poRejectRouted(id){
  const p=DB.po.find(x=>x.id===id); if(!p) return;

  openModal(`<div class="modal-head"><h3>Reject Purchase Order</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

}
function poDoReject(id){
  const p=DB.po.find(x=>x.id===id); if(!p) return;
  const a=p.approval; if(!a) return;
  const note=(document.getElementById("po_reject_note")||{}).value||"";
  a.state="rejected"; a.decidedAt=Date.now(); a.decidedById=(SESSION&&SESSION.id)||""; a.approverName=(SESSION&&SESSION.name)||a.approverName; a.note=note.trim();
  const w=poWorkflow(p); w.approved=null;
  p.status="Draft";
  saveDB(); closeModal(); if(typeof viewPO==="function") viewPO(id); buildNav(); renderNotifBell();
  toast("Purchase order rejected","Returned to "+(a.submittedByName||"preparer"),"ok");
  if(DB.settings.tgNotifySubmitter!==false) poNotifySubmitterTelegram(p);
}

// --- Telegram notifications for the approval workflow ---
function escTG(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function telegramSendMessage(text, chatId){
  const token=(DB.settings.tgToken||"").trim();
  const chat=(chatId||DB.settings.tgChat||"").trim();
  if(!token||!chat) return {ok:false, reason:"not-configured"};
  try{
    const res=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text,parse_mode:"HTML",disable_web_page_preview:true})});
    const j=await res.json();
    return {ok:!!j.ok, reason:j.description||""};
  }catch(e){ return {ok:false, reason:"network"}; }
}
// Notify the approver's personal Telegram (falls back to the global chat) that a PO needs approval
async function poNotifyApproverTelegram(p, approver){
  if(!(DB.settings.tgToken||"").trim()) return;                 // Telegram not set up — silently skip
  const chat=(approver && approver.tgChatId && approver.tgChatId.trim()) ? approver.tgChatId.trim() : (DB.settings.tgChat||"").trim();
  if(!chat) return;
  const link=(DB.settings.appUrl||"").trim()?`\n\n<a href="${escTG(DB.settings.appUrl.trim())}">Open the Procurement system to approve →</a>`:"";
  const text=`🔔 <b>Purchase Order — Approval Needed</b>\n`+
    `PO#: <b>${escTG(p.poNo)}</b>\n`+
    `Supplier: ${escTG(p.supplier||"—")}\n`+
    `Amount: <b>${money(p.amount)}</b>\n`+
    `Campus/Project: ${escTG(p.campus||"—")}\n`+
    `Submitted by: ${escTG((SESSION&&SESSION.name)||"—")}`+link;
  const r=await telegramSendMessage(text, chat);
  if(r.ok) toast("Telegram alert sent",(approver&&approver.name?approver.name:"Approver")+" was notified on Telegram","ok");
  else if(r.reason && r.reason!=="not-configured") toast("Telegram alert not sent",r.reason==="network"?"Could not reach Telegram":r.reason,"err",6500);
}
// Notify the submitter's personal Telegram of a decision (only if they have their own chat id)
async function poNotifySubmitterTelegram(p){
  if(!(DB.settings.tgToken||"").trim() || !p.approval) return;
  const submitter=DB.users.find(u=>u.id===p.approval.submittedById);
  const chat=(submitter && submitter.tgChatId && submitter.tgChatId.trim()) ? submitter.tgChatId.trim() : "";
  if(!chat) return;                                             // don't send decisions to the global chat
  const approved=p.approval.state==="approved";
  const text=`${approved?"✅":"❌"} <b>Purchase Order ${approved?"Approved":"Rejected"}</b>\n`+
    `PO#: <b>${escTG(p.poNo)}</b>\n`+
    `Amount: <b>${money(p.amount)}</b>\n`+
    `${approved?"Approved":"Rejected"} by: ${escTG(p.approval.approverName||"—")}`+
    ((!approved && p.approval.note)?`\nReason: ${escTG(p.approval.note)}`:"");
  await telegramSendMessage(text, chat);
}


function poRecall(id){
  const p=DB.po.find(x=>x.id===id); if(!p||!p.approval) return;
  if(!poIsMySubmission(p)){ toast("Not permitted","Only the person who submitted it can recall it","err"); return; }
  confirmModal("Recall this PO?","It will return to Draft and the approval request will be withdrawn.",()=>{
    p.approval.state="draft"; p.approval.decidedAt=Date.now();
    const w=poWorkflow(p); w.requested=null; w.approved=null;
    p.status="Draft";
    saveDB(); if(typeof viewPO==="function") viewPO(id); buildNav(); renderNotifBell();
    toast("Purchase order recalled","Back to draft","ok");
  },"Recall",false);
}


/* ============================================================
   PR INTAKE — Telegram → Drive/Sheet → confirm → Procurement
   The bot (Google Apps Script) writes rows to a PR_Intake sheet.
   This module pulls them, shows a confirm queue, and turns an
   approved row into a normal procurement record. Nothing is
   written into procurement until you confirm it.
============================================================ */
let _intakeBusy=false;

function intakeCfg(){ DB.settings=DB.settings||{}; return {url:(DB.settings.gsUrl||"").trim(), key:(DB.settings.gsKey||"").trim()}; }
function intakePending(){ return (DB.prIntake||[]).filter(x=>x && x.state!=="done" && x.state!=="dismissed"); }
function intakeCount(){ return intakePending().length; }

/* ---- Pull new intake rows from the Apps Script ---- */
async function fetchPRIntake(silent){
  const cfg=intakeCfg();
  if(!cfg.url){ if(!silent) toast("Sync not configured","Add your Google Apps Script URL in Settings first","err"); return false; }
  if(_intakeBusy) return false;
  _intakeBusy=true;
  try{
    const j=await jsonpRequest(cfg.url,{action:"intake", key:cfg.key},20000);
    if(!(j&&j.ok&&Array.isArray(j.rows))){
      if(!silent) toast("Could not load PR intake", (j&&j.error)||"Check that the bot script is deployed","err",6000);
      return false;
    }
    DB.prIntake=DB.prIntake||[];
    const known=new Set(DB.prIntake.map(x=>x.uid));
    let added=0;
    j.rows.forEach(r=>{
      if(!r || !r.uid || known.has(r.uid)) return;
      DB.prIntake.push({
        uid:String(r.uid), receivedAt:Number(r.receivedAt)||Date.now(),
        sender:String(r.sender||""), campus:String(r.campus||""),
        fileName:String(r.fileName||""), fileUrl:String(r.fileUrl||""),
        caption:String(r.caption||""),
        pr:String(r.pr||""), quote:String(r.quote||""), amount:(r.amount===""||r.amount==null)?"":Number(r.amount)||"",
        note:String(r.note||""), confidence:String(r.confidence||"low"),
        state:"new"
      });
      added++;
    });
    if(added){ saveDB(); buildNav(); }
    if(!silent) toast(added?("PR intake updated"):("No new purchase requests"), added?(added+" new item(s) waiting to confirm"):"","ok");
    return true;
  }catch(e){ if(!silent) toast("PR intake failed","Could not reach the bot script","err",6000); return false; }
  finally{ _intakeBusy=false; }
}

/* ---- Tell the script a row has been handled (so it isn't re-sent) ---- */
function intakeMarkRemote(uid,state){
  const cfg=intakeCfg(); if(!cfg.url) return;
  try{ jsonpRequest(cfg.url,{action:"intakeDone", key:cfg.key, uid:uid, state:state||"done"},12000); }catch(e){}
}

/* ============================================================
   UNIFORM STOCK TRACKING (sub-module of Stock Management)
============================================================ */
// Uniform module supports two independent datasets: regular "uniform" and "gep".
let _uniformKind="uniform";
let _uniformState={ uniform:{period:null,view:"summary",filter:{outlet:"",q:""}}, gep:{period:null,view:"summary",filter:{outlet:"",q:""}} };
function uniformDB(){ return _uniformKind==="gep"?DB.gepUniform:DB.uniform; }
function uniLabel(){ return _uniformKind==="gep"?"GEP Uniform":"Uniform Stock"; }
// Back-compat accessors that proxy to the active kind's state
Object.defineProperty(window,"_uniformPeriod",{get(){return _uniformState[_uniformKind].period;},set(v){_uniformState[_uniformKind].period=v;},configurable:true});
Object.defineProperty(window,"_uniformView",{get(){return _uniformState[_uniformKind].view;},set(v){_uniformState[_uniformKind].view=v;},configurable:true});
Object.defineProperty(window,"_uniformFilter",{get(){return _uniformState[_uniformKind].filter;},set(v){_uniformState[_uniformKind].filter=v;},configurable:true});

function uniformPeriods(){
  // distinct periods present in data, plus the baseline month, the cutoff-based
  // current month, and next month.
  const set=new Set(uniformDB().map(r=>r.period).filter(Boolean));
  set.add(UNIFORM_BASE_PERIOD);
  set.add(currentPeriod());
  set.add(nextPeriodOf(currentPeriod()));
  if(_uniformPeriod) set.add(_uniformPeriod);
  // fill any gap months between the earliest and latest so none are skipped
  const arr=Array.from(set).sort();
  if(arr.length>1){
    let cur=arr[0]; const last=arr[arr.length-1]; const full=new Set(arr);
    let guard=0;
    while(cur!==last && guard++<240){ cur=nextPeriodOf(cur); full.add(cur); }
    return Array.from(full).sort().reverse();
  }
  return arr.reverse();
}
function uniformRowsFor(period){
  return uniformDB().filter(r=>r.period===period);
}
function uniformRowFor(period,outlet){
  return uniformDB().find(r=>r.period===period && r.outlet===outlet);
}

function renderUniform(){
  if(!_uniformPeriod) _uniformPeriod=latestUniformPeriod();
  const periods=uniformPeriods();
  const rows=uniformRowsFor(_uniformPeriod);
  // totals
  const sum=k=>rows.reduce((a,r)=>a+(k==="bb"?(Number(r.bb)||0):uniformSum(r,k)),0);
  const totBB=sum("bb"),totMI=sum("moveIn"),totAI=sum("adjustIn"),totMO=sum("moveOut"),totSO=sum("soldOut"),totFr=sum("free"),totBr=sum("broken"),totAO=sum("adjustOut");
  const totEB=rows.reduce((a,r)=>a+uniformEB(r),0);
  const canEdit=isSuper()||(SESSION&&SESSION.role!=="viewer");
  document.getElementById("stockTabBody").innerHTML=`
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      ${uniKpi("ic-blue",totBB,"Beginning Balance")}
      ${uniKpi("ic-green",totMI,"Total Move In")}
      ${uniKpi("ic-green",totAI,"Total Adjust In")}
      ${uniKpi("ic-orange",totMO,"Total Move Out")}
      ${uniKpi("ic-purple",totSO,"Total Sold Out")}
      ${uniKpi("ic-orange",totFr,"Total Free")}
      ${uniKpi("ic-red",totBr,"Total Broken")}
      ${uniKpi("ic-orange",totAO,"Total Adjust Out")}
      ${uniKpi("ic-blue",totEB,"Ending Balance")}
    </div>

function uniformDisplayRows(){

  return rows.slice().sort((a,b)=>UNIFORM_OUTLETS.indexOf(a.outlet)-UNIFORM_OUTLETS.indexOf(b.outlet));

let _uniformTx={};
function openUniformForm(id){
  const r=id?uniformDB().find(x=>x.id===id):null;
  const usedOutlets=uniformRowsFor(_uniformPeriod).map(x=>x.outlet);
  const availOutlets=UNIFORM_OUTLETS.filter(o=>!usedOutlets.includes(o)||(r&&r.outlet===o));
  // staging arrays for each movement type (migrates legacy single numbers)

  UNIFORM_MOVE_FIELDS.forEach(f=>{ _uniformTx[f.k]=r?uniformArr(r,f.k).slice():[]; });
  const blockFor=f=>`
    <div class="field full" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <label style="margin:0;flex:1">${f.label} <span class="muted" style="font-weight:500">(${f.dir==='+'?'adds to':'subtracts from'} stock)</span></label>

  openModal(`<div class="modal-head"><h3>${id?"Edit":"Add"} Uniform Stock — ${monthLabel(_uniformPeriod)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="field"><label class="req">Stock Outlet / Campus</label><select id="u_outlet" ${id?'disabled':''} onchange="uniformSuggestBB()">${availOutlets.map(o=>`<option ${r?.outlet===o?'selected':''}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Beginning Balance (BB)</label><input type="number" min="0" id="u_bb" value="${r&&r.bb!==''&&r.bb!=null?r.bb:''}" placeholder="0"></div>
    ${blockFor(UNIFORM_MOVE_FIELDS[0])}
    ${blockFor(UNIFORM_MOVE_FIELDS[1])}
    ${blockFor(UNIFORM_MOVE_FIELDS[2])}
    ${blockFor(UNIFORM_MOVE_FIELDS[3])}
    ${blockFor(UNIFORM_MOVE_FIELDS[4])}
    ${blockFor(UNIFORM_MOVE_FIELDS[5])}
    ${blockFor(UNIFORM_MOVE_FIELDS[6])}
    <div class="field full"><label>Status / Remark</label><input id="u_remark" value="${esc(r?.remark||'')}"></div>
    <div class="field full"><div style="background:var(--surface-2);border-radius:9px;padding:11px 13px;font-size:13px">Ending Balance (auto): <b id="u_ebPreview" style="font-size:15px">—</b><div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">EB = BB + Move In + Adjust In − Move Out − Sold Out − Free − Broken − Adjust Out</div></div></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUniform(${id?`'${id}'`:'null'})">Save</button></div>`,{size:"wide"});
  UNIFORM_MOVE_FIELDS.forEach(f=>renderUniformTx(f.k));
  const bb=document.getElementById("u_bb"); if(bb) bb.addEventListener("input",updateUniformEBPreview);
  if(!id) uniformSuggestBB(); else updateUniformEBPreview();
}
function uniformAddTx(k){ _uniformTx[k]=_uniformTx[k]||[]; _uniformTx[k].push(""); renderUniformTx(k); // focus the new input
  setTimeout(()=>{ const inputs=document.querySelectorAll(`#u_list_${k} input`); if(inputs.length)inputs[inputs.length-1].focus(); },30); }
function renderUniformTx(k){
  const host=document.getElementById("u_list_"+k); if(!host)return;
  const arr=_uniformTx[k]||[];
  if(!arr.length){ host.innerHTML=`<div class="muted" style="font-size:12px;padding:2px 0">No entries. Click “+ Add” to record a transaction.</div>`; }
  else host.innerHTML=arr.map((v,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span class="muted" style="font-size:11px;width:18px">#${i+1}</span>
    <input type="number" min="0" value="${v===''||v==null?'':v}" placeholder="Qty" style="flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" oninput="_uniformTx['${k}'][${i}]=this.value;uniformRecalcSum('${k}');updateUniformEBPreview()">
    <button type="button" class="act-btn" onclick="_uniformTx['${k}'].splice(${i},1);renderUniformTx('${k}');uniformRecalcSum('${k}');updateUniformEBPreview()" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>`).join("");
  uniformRecalcSum(k);
}
function uniformRecalcSum(k){
  const arr=_uniformTx[k]||[]; const s=arr.reduce((a,x)=>a+(Number(x)||0),0);
  const el=document.getElementById("u_sum_"+k); if(el) el.textContent=s.toLocaleString();
}
function txSum(k){ return (_uniformTx[k]||[]).reduce((a,x)=>a+(Number(x)||0),0); }
function uniformSuggestBB(){
  const sel=document.getElementById("u_outlet"); if(!sel)return;
  const bbEl=document.getElementById("u_bb");
  if(bbEl && bbEl.value==="" ){
    const prev=uniformRowFor(prevPeriod(_uniformPeriod), sel.value);
    if(prev){ bbEl.value=uniformEB(prev); }
  }
  updateUniformEBPreview();
}
function updateUniformEBPreview(){
  const bb=Number(document.getElementById("u_bb")?.value)||0;
  const eb=bb+txSum("moveIn")+txSum("adjustIn")-txSum("moveOut")-txSum("soldOut")-txSum("free")-txSum("broken")-txSum("adjustOut");
  const el=document.getElementById("u_ebPreview"); if(el){ el.textContent=eb.toLocaleString(); el.style.color=eb<0?"var(--danger)":""; }
}
function saveUniform(id){
  const outlet=document.getElementById("u_outlet")?.value; if(!outlet){ toast("Outlet is required","","err"); return; }
  const bb=Number(document.getElementById("u_bb")?.value)||0;
  const ins=bb+txSum("moveIn")+txSum("adjustIn");
  const outs=txSum("moveOut")+txSum("soldOut")+txSum("free")+txSum("broken")+txSum("adjustOut");
  if(outs>ins){
    confirmModal("Negative ending balance","Total out ("+outs.toLocaleString()+") exceeds available stock ("+ins.toLocaleString()+"). Ending balance will be negative. Save anyway?",()=>doSaveUniform(id),"Save anyway",false);
    return;
  }
  doSaveUniform(id);
}
function doSaveUniform(id){
  const bbEl=document.getElementById("u_bb");
  const clean=k=>(_uniformTx[k]||[]).map(x=>Number(x)||0).filter(x=>x!==0); // drop empty/zero entries
  const obj={
    id:id||uid(), period:_uniformPeriod, outlet:document.getElementById("u_outlet").value,
    bb:bbEl.value===""?"":Number(bbEl.value),
    moveIn:clean("moveIn"), adjustIn:clean("adjustIn"), moveOut:clean("moveOut"),
    soldOut:clean("soldOut"), free:clean("free"), broken:clean("broken"), adjustOut:clean("adjustOut"),
    remark:document.getElementById("u_remark").value.trim(), updated:Date.now()
  };
  const COL=uniformDB();
  if(id){ const i=COL.findIndex(x=>x.id===id); obj.created=COL[i].created; COL[i]=obj; toast("Outlet updated","","ok"); }
  else { obj.created=Date.now(); COL.push(obj); toast("Outlet added","","ok"); }
  saveDB(); closeModal(); renderUniform();
}
function deleteUniform(id){
  if(!isSuper()){ toast("Permission denied","Only Super Admin can delete","err"); return; }
  const r=uniformDB().find(x=>x.id===id);
  confirmModal("Delete outlet record?",`"${esc(r.outlet)}" for ${monthLabel(r.period)} will be removed.`,()=>{ const COL=uniformDB(); const i=COL.findIndex(x=>x.id===id); if(i>-1)COL.splice(i,1); saveDB(); renderUniform(); toast("Deleted","","ok"); },"Delete");
}
function carryForwardUniform(){
  const rows=uniformRowsFor(_uniformPeriod);
  if(!rows.length){ toast("Nothing to carry","Add outlet balances first","err"); return; }
  const next=nextPeriodOf(_uniformPeriod);
  const existing=uniformRowsFor(next);
  const proceed=()=>{
    const COL=uniformDB();
    // remove existing next-month rows that we will replace
    for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===next) COL.splice(i,1); }
    rows.forEach(r=>{
      COL.push({id:uid(),period:next,outlet:r.outlet,bb:uniformEB(r),
        moveIn:[],adjustIn:[],moveOut:[],soldOut:[],free:[],broken:[],adjustOut:[],
        remark:"",created:Date.now()});
    });
    saveDB(); _uniformPeriod=next; renderUniform();
    toast("Carried forward",monthLabel(next)+" created from ending balances","ok");
  };
  if(existing.length) confirmModal("Overwrite "+monthLabel(next)+"?",monthLabel(next)+" already has "+existing.length+" outlet record(s). Carrying forward will replace them with ending balances from "+monthLabel(_uniformPeriod)+".",proceed,"Overwrite");
  else proceed();
}
function nextPeriodOf(period){ let [y,m]=period.split("-").map(Number); m++; if(m>12){m=1;y++;} return y+"-"+String(m).padStart(2,"0"); }

// Move every record in the currently-viewed month to a different month.
function reassignUniformMonth(){
  const from=_uniformPeriod;
  const rows=uniformRowsFor(from);
  if(!rows.length){ toast("No data to move","This month has no records","err"); return; }
  // build a list of candidate target months (12 around the current data range)
  const opts=[]; let base=prevPeriod(prevPeriod(prevPeriod(from)));
  for(let i=0;i<12;i++){ opts.push(base); base=nextPeriodOf(base); }
  const uniqueOpts=Array.from(new Set(opts));
  openModal(`<div class="modal-head"><h3>Change Month</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p style="margin:0 0 14px;font-size:13.5px">Move all <b>${rows.length}</b> outlet record(s) from <b>${monthLabel(from)}</b> to:</p>
    <div class="field"><label class="req">Target Month</label>
      <select id="reassign_to">${uniqueOpts.filter(p=>p!==from).map(p=>`<option value="${p}">${monthLabel(p)}</option>`).join("")}</select>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">If the target month already has records for the same outlet, they will be replaced by the moved records.</div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doReassignUniformMonth('${from}')">Move Records</button></div>`);
}
function doReassignUniformMonth(from){
  const to=document.getElementById("reassign_to").value;
  if(!to||to===from){ toast("Pick a different month","","err"); return; }
  const moving=uniformRowsFor(from);
  const movingOutlets=moving.map(r=>r.outlet);
  // remove target-month rows for the same outlets (avoid duplicates), then re-stamp the period
  const COL=uniformDB();
  // remove target-month rows for the same outlets (avoid duplicates), then re-stamp the period
  for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===to && movingOutlets.includes(COL[i].outlet)) COL.splice(i,1); }
  COL.forEach(r=>{ if(r.period===from) r.period=to; });
  saveDB(); _uniformPeriod=to; closeModal(); renderUniform();
  toast("Records moved",moving.length+" record(s) → "+monthLabel(to),"ok");
}

function drawUniformCharts(rows){
  if(typeof Chart==="undefined")return;
  if(!window._uniCharts)window._uniCharts={};
  ["move","outlet"].forEach(k=>{ if(window._uniCharts[k]){try{window._uniCharts[k].destroy();}catch(e){}} });
  const C=chartColors();
  const sum=k=>rows.reduce((a,r)=>a+uniformSum(r,k),0);
  const mc=document.getElementById("uniMoveChart");
  if(mc) window._uniCharts.move=new Chart(mc,{type:"bar",
    data:{labels:["Move In","Adjust In","Move Out","Sold Out","Free","Broken","Adjust Out"],
      datasets:[{data:[sum("moveIn"),sum("adjustIn"),sum("moveOut"),sum("soldOut"),sum("free"),sum("broken"),sum("adjustOut")],
      backgroundColor:["#13b981","#22c55e","#f59e0b","#7c3aed","#3b82f6","#ef4444","#f97316"],borderRadius:7,maxBarThickness:42}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid},ticks:{precision:0}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
  const oc=document.getElementById("uniOutletChart");

/* ---- Uniform Excel import ---- */
function importUniformExcel(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    // Prefer a sheet named like UniformStock; else first sheet
    let sheetName=wb.SheetNames.find(n=>/uniform/i.test(n))||wb.SheetNames[0];
    const json=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:""});
    if(!json.length){ toast("No rows found","Check the sheet format","err"); return; }
    const norm=s=>String(s||"").trim().toUpperCase();
    const matchOutlet=v=>{ const u=norm(v); return UNIFORM_OUTLETS.find(o=>norm(o)===u)||UNIFORM_OUTLETS.find(o=>norm(o).startsWith(u)||u.startsWith(norm(o)))||v; };
    const numB=v=>v===""||v==null||isNaN(v)?0:Number(v);
    // Parse a movement value: prefer an "Entries" column (comma/plus separated) else the single total
    const toArr=(entries,total)=>{
      if(entries!=null && String(entries).trim()!==""){
        return String(entries).split(/[,+]/).map(x=>Number(String(x).trim())||0).filter(x=>x!==0);
      }
      const n=numB(total); return n?[n]:[];
    };
    const period=_uniformPeriod;
    const imported=[];
    json.forEach(row=>{
      const outlet=matchOutlet(row.Outlet||row.outlet||row["Stock Outlet"]||row["Stock Outlet / Campus"]);
      if(!outlet) return;
      imported.push({id:uid(),period:row.Period||period,outlet,
        bb:numB(row.BB),
        moveIn:toArr(row.MoveIn_Entries,row.MoveIn||row["Move In"]),
        adjustIn:toArr(row.AdjustIn_Entries,row.AdjustIn||row["Adjust In"]),
        moveOut:toArr(row.MoveOut_Entries,row.MoveOut||row["Move Out"]),
        soldOut:toArr(row.SoldOut_Entries,row.SoldOut||row["Sold Out"]),
        free:toArr(row.Free_Entries,row.Free),
        broken:toArr(row.Broken_Entries,row.Broken),
        adjustOut:toArr(row.AdjustOut_Entries,row.AdjustOut||row["Adjust Out"]),
        remark:row.Remark||row.Status||"", created:Date.now()});
    });
    if(!imported.length){ toast("No matching outlets","Could not map rows to outlets","err"); return; }
    confirmModal("Import "+imported.length+" outlet rows?","Rows will be added for "+monthLabel(imported[0].period||period)+". Existing rows for the same outlet & month will be replaced.",()=>{
      const COL=uniformDB();
      imported.forEach(im=>{ for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===im.period&&COL[i].outlet===im.outlet) COL.splice(i,1); } COL.push(im); });
      saveDB(); renderUniform(); toast("Imported",imported.length+" rows added","ok");
    },"Import",false);
  }catch(err){ console.error(err); toast("Import failed","Could not read the file","err"); } };
  reader.readAsArrayBuffer(f); input.value="";
}

// ---- delivery / replacement progress helpers ----
function spDeliveryProgress(r){
  const lines=r.lines||[]; if(!lines.length) return {pct:0,text:"—"};
  let ord=0,rec=0; lines.forEach(li=>{ ord+=(Number(li.qtyOrdered)||0); rec+=(Number(li.qtyReceived)||0); });
  if(ord<=0) return {pct:0,text:"Not ordered"};
  const pct=Math.min(100,Math.round(rec/ord*100));
  return {pct,text:rec+" / "+ord+" recv"};
}
function spReplacementProgress(r){
  const lines=r.lines||[]; if(!lines.length) return {pct:0,text:"—"};
  let rec=0,ins=0; lines.forEach(li=>{ rec+=(Number(li.qtyReceived)||0); ins+=(Number(li.qtyInstalled)||0); });
  if(rec<=0) return {pct:0,text:"Awaiting parts"};
  const pct=Math.min(100,Math.round(ins/rec*100));
  return {pct,text:ins+" / "+rec+" inst"};
}

      <th>Date</th><th>Priority</th><th>Campus</th><th>Asset ID</th><th>AC Type</th><th>Fault</th>
      <th style="text-align:center">Parts</th><th style="text-align:right">Est Cost</th><th style="text-align:right">Act Cost</th>
      <th>Approved PR</th><th>Supplier</th><th>PO Number</th><th>Exp. Delivery</th>
      <th>Delivery</th><th>Replacement</th><th>Status</th><th>Responsible</th><th>Att</th><th style="min-width:120px">Actions</th>
    </tr></thead><tbody>${rows.length?rows.map(r=>spRequestRow(r)).join(""):`<tr><td colspan="20"><div class="empty" style="padding:26px"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><h4>No spare-parts requests</h4><p>${spCanEdit()?'Click “New Request”, or use “Request Spare Parts” on an AC record.':'No requests to display.'}</p></div></td></tr>`}</tbody></table></div>`;
}
function spRequestRow(r){
  const dp=spDeliveryProgress(r), rp=spReplacementProgress(r);
  const overdue=spIsOverdue(r);
  const att=(r.files&&r.files.length)?`<span class="att-pill" onclick="spPreviewFile('${r.id}',0)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${r.files.length}</span>`:'<span class="muted">—</span>';
  const hasProc=r.procurementId&&DB.procurement.some(p=>p.id===r.procurementId);
  const hasPO=Array.isArray(r.poIds)&&r.poIds.length;
  const fin=spCanFinance();
  let proc="";
  if(!hasProc){
    proc=fin?`<button class="act-btn" title="Create Procurement Record" onclick="spCreateProcurement('${r.id}')" style="color:var(--primary)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>`:"";
  } else {
    proc=`<button class="act-btn" title="View Procurement Record" onclick="spGotoProcurement('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>`;
    if(hasPO) proc+=`<button class="act-btn" title="View Purchase Order" onclick="spViewPO('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg></button>`;
    else if(fin) proc+=`<button class="act-btn" title="Create Purchase Order" onclick="spCreatePOFromRequest('${r.id}')" style="color:var(--primary)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg></button>`;
  }
  return `<tr>
    <td style="position:sticky;left:0;background:var(--surface)"><b>${esc(r.reqNo||"—")}</b>${overdue?` <span class="status s-overdue" style="margin-left:2px">Overdue</span>`:""}</td>
    <td>${fmtDateUS(r.requestDate)}</td>
    <td>${spPriorityBadge(r.priority)}</td>
    <td>${r.campus?`<span class="campus-tag ${campusTagClass(r.campus)}">${esc(r.campus)}</span>`:'<span class="muted">—</span>'}</td>
    <td><b>${esc(r.assetId||"—")}</b></td>
    <td>${esc(r.acType||"—")}</td>
    <td class="ell" style="max-width:170px" title="${esc(r.faultDescription||'')}">${esc(r.faultDescription||"—")}</td>
    <td style="text-align:center">${spReqPartsCount(r)}</td>
    <td style="text-align:right">${sp_usd(spReqEstTotal(r))}</td>
    <td style="text-align:right">${sp_usd(spReqActTotal(r))}</td>
    <td>${esc(r.prNumber||"—")}</td>
    <td>${esc(r.selectedSupplier||r.proposedSupplier||"—")}</td>
    <td>${esc(r.poNumber||"—")}</td>
    <td>${fmtDateUS(r.expectedDelivery)}</td>
    <td>${spProgressBar(dp.pct,dp.text)}</td>
    <td>${spProgressBar(rp.pct,rp.text)}</td>
    <td>${spStatusBadge(r.status)}</td>
    <td>${esc(r.responsible||"—")}</td>
    <td>${att}</td>
    <td><div class="row-actions" style="display:flex;gap:2px;flex-wrap:wrap">
      <button class="act-btn" title="View" onclick="spViewRequest('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      ${spCanEdit()?`<button class="act-btn" title="Edit" onclick="spOpenRequestForm('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>`:""}
      ${proc}
      ${(spCanEdit()&&hasPO)?`<button class="act-btn" title="Record Delivery" onclick="spOpenReceiveForm('${r.id}')" style="color:#0891b2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16h2a2 2 0 0 0 2-2V7l-4-4H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/></svg></button>`:""}
      ${(spCanEdit()&&(r.lines||[]).some(li=>spAcceptedForLine(r.id,li.id)>0))?`<button class="act-btn" title="Record Installation" onclick="spOpenInstallForm('${r.id}')" style="color:#7c3aed"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button>`:""}
      <button class="act-btn" title="Print" onclick="spPrintOne('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
      ${spCanDelete()?`<button class="act-btn del" title="Delete" onclick="spDeleteRequest('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>`:""}
    </div></td>
  </tr>`;
}
