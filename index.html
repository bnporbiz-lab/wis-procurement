let _spLines=[];      // working line items during form edit
let _spEditId=null;   // request being edited (null=new)
let _spPrefill=null;  // prefill payload from AC record integration (phase 3)

function spBlankLine(){
  return {id:uid(),partName:"",partNumber:"",spec:"",compat:"",preferredBrand:"",uom:"pcs",
    qtyRequested:1,qtyApproved:0,qtyOrdered:0,qtyReceived:0,qtyInstalled:0,
    estUnitPrice:0,actUnitPrice:0,proposedSupplier:"",selectedSupplier:"",
    expDelivery:"",actDelivery:"",warrantyPeriod:"",warrantyExpiry:"",remarks:""};
}
function spOpenRequestForm(id){
  if(!spCanEdit()){ toast("Permission denied","You do not have permission to create or edit requests","err"); return; }
  const r=id?DB.acSpareRequests.find(x=>x.id===id):null;
  _spEditId=id||null;
  _stagedFiles=r&&r.files?JSON.parse(JSON.stringify(r.files)):[];
  _spLines=r&&Array.isArray(r.lines)&&r.lines.length?JSON.parse(JSON.stringify(r.lines)):[spBlankLine()];
  const pf=_spPrefill||{}; _spPrefill=null; // consume prefill once
  const val=(k,d)=> r?(r[k]!=null?r[k]:""):(pf[k]!=null?pf[k]:(d!=null?d:""));
  const today=new Date().toISOString().slice(0,10);
  const reqNo=r?r.reqNo:spNextRequestNo(new Date().getFullYear());
  const campusOpts=acCampuses();
  const unitOpts=DB.acUnits.slice();
  const sel=(cur,opts)=>opts.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join("");
  openModal(`
    <div class="modal-head"><h3>${id?"Edit":"New"} Spare Parts Request</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="sp-sec-title">A. Request Information</div>
      <div class="form-grid">
        <div class="field"><label>Spare Parts Request ID</label><input id="sp_reqNo" value="${esc(reqNo)}" readonly></div>
        <div class="field"><label class="req">Request Date</label><input type="date" id="sp_requestDate" value="${esc(val('requestDate',today))}"></div>
        <div class="field"><label>Requested By</label><input id="sp_requestedBy" value="${esc(val('requestedBy',spUser()))}"></div>
        <div class="field"><label>Department</label><input id="sp_department" value="${esc(val('department'))}"></div>
        <div class="field"><label class="req">Campus</label><select id="sp_campus"><option value="">— Select —</option>${sel(val('campus'),campusOpts)}</select></div>
        <div class="field"><label>Building</label><input id="sp_building" value="${esc(val('building'))}"></div>
        <div class="field"><label>Floor</label><input id="sp_floor" value="${esc(val('floor'))}"></div>
        <div class="field"><label>Room / Location</label><input id="sp_room" value="${esc(val('room'))}"></div>
        <div class="field"><label class="req">Priority</label><select id="sp_priority">${sel(val('priority','Medium'),SP_PRIORITIES)}</select></div>
        <div class="field"><label>Required Date</label><input type="date" id="sp_requiredDate" value="${esc(val('requiredDate'))}"></div>
        <div class="field"><label>Maintenance Category</label><select id="sp_maintCategory"><option value="">—</option>${sel(val('maintCategory'),SP_MAINT_CATS)}</select></div>
        <div class="field"><label>Linked Maintenance Record ID</label><input id="sp_linkedMaint" value="${esc(val('linkedMaint'))}"></div>
        <div class="field"><label>Linked Corrective (CM) ID</label><input id="sp_linkedCM" value="${esc(val('linkedCM'))}"></div>
        <div class="field"><label>Responsible Person</label><input id="sp_responsible" value="${esc(val('responsible'))}"></div>
        <div class="field"><label>Current Overall Status</label><select id="sp_status">${sel(val('status','Spare Parts Needed'),SP_STATUSES)}</select></div>
      </div>

      <div class="sp-sec-title">B. AC Equipment Information</div>
      <div class="form-grid">
        <div class="field"><label>AC System Type</label><select id="sp_acType"><option value="">—</option>${sel(val('acType'),SP_ACTYPES)}</select></div>
        <div class="field"><label>Asset ID (from register)</label><select id="sp_assetSel" onchange="spFillFromUnit(this.value)"><option value="">— Select Equipment —</option>${unitOpts.map(u=>`<option value="${u.id}" ${r&&r.assetUnitId===u.id?'selected':''}>${esc(spUnitLabel(u))}</option>`).join("")}</select></div>
        <div class="field"><label>Asset ID (text)</label><input id="sp_assetId" value="${esc(val('assetId'))}"></div>
        <div class="field"><label>VRF System ID</label><input id="sp_vrfSystemId" value="${esc(val('vrfSystemId'))}"></div>
        <div class="field"><label>Parent Outdoor Unit</label><input id="sp_parentOutdoor" value="${esc(val('parentOutdoor'))}"></div>
        <div class="field"><label>Indoor / Outdoor</label><select id="sp_inout"><option value="">—</option>${sel(val('inout'),["Indoor","Outdoor"])}</select></div>
        <div class="field"><label>Brand</label><input id="sp_brand" value="${esc(val('brand'))}"></div>
        <div class="field"><label>Model</label><input id="sp_model" value="${esc(val('model'))}"></div>
        <div class="field"><label>Serial Number</label><input id="sp_serial" value="${esc(val('serial'))}"></div>
        <div class="field"><label>Capacity</label><input id="sp_capacity" value="${esc(val('capacity'))}"></div>
        <div class="field"><label>Current Condition</label><select id="sp_condition"><option value="">—</option>${sel(val('condition'),AC_CONDITIONS)}</select></div>
        <div class="field"><label>Current Operating Status</label><select id="sp_opStatus"><option value="">—</option>${sel(val('opStatus'),AC_OP_STATUS)}</select></div>
        <div class="field full"><label>Equipment Location</label><input id="sp_equipLocation" value="${esc(val('equipLocation'))}"></div>
      </div>

      <div class="sp-sec-title">C. Technical Assessment</div>
      <div class="form-grid">
        <div class="field full"><label>Fault Description</label><textarea id="sp_faultDescription" rows="2">${esc(val('faultDescription'))}</textarea></div>
        <div class="field full"><label>Inspection Findings</label><textarea id="sp_findings" rows="2">${esc(val('findings'))}</textarea></div>
        <div class="field"><label>Root Cause</label><input id="sp_rootCause" value="${esc(val('rootCause'))}"></div>
        <div class="field"><label>Recommended Repair Action</label><input id="sp_repairAction" value="${esc(val('repairAction'))}"></div>
        <div class="field"><label>Reason for Replacement</label><input id="sp_replaceReason" value="${esc(val('replaceReason'))}"></div>
        <div class="field"><label>Temporary Action Taken</label><input id="sp_tempAction" value="${esc(val('tempAction'))}"></div>
        <div class="field"><label>Existing Part Condition</label><input id="sp_existingCond" value="${esc(val('existingCond'))}"></div>
        <div class="field"><label>Estimated Downtime (h)</label><input type="number" min="0" step="0.5" id="sp_downtime" value="${esc(val('downtime'))}"></div>
        <div class="field"><label>Tech Spec Confirmed</label><select id="sp_specConfirmed">${sel(val('specConfirmed','No'),["No","Yes"])}</select></div>
        <div class="field"><label>Confirmed By</label><input id="sp_confirmedBy" value="${esc(val('confirmedBy'))}"></div>
        <div class="field"><label>Confirmation Date</label><input type="date" id="sp_confirmDate" value="${esc(val('confirmDate'))}"></div>
        <div class="field full"><label>Technical Remarks</label><textarea id="sp_techRemarks" rows="2">${esc(val('techRemarks'))}</textarea></div>
      </div>

      <div class="sp-sec-title" style="display:flex;justify-content:space-between;align-items:center">D. Spare-Parts Line Items <button class="btn btn-ghost btn-sm" onclick="spAddLine()">+ Add Item</button></div>
      <div id="sp_linesHost"></div>
      <div id="sp_linesTotals" style="text-align:right;font-weight:700;margin-top:6px"></div>

      <div class="sp-sec-title">Attachments</div>
      <label class="file-drop"><input type="file" multiple accept="${FILE_TYPES}" onchange="handleFileInput(this)"><span>Click to attach photos, reports, specs, quotations, POs, invoices, delivery/warranty docs…</span></label>
      <div id="fileList" class="file-list"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="spSaveRequest()">${id?"Save Changes":"Create Request"}</button></div>
  `,{size:"wide"});
  spRenderLines();
  renderStagedFiles();
}
function spAddLine(){ _spLines.push(spBlankLine()); spRenderLines(); }
function spRemoveLine(i){ _spLines.splice(i,1); if(!_spLines.length)_spLines.push(spBlankLine()); spRenderLines(); }
function spLineInput(i,field,val,isNum){
  _spLines[i][field]= isNum ? Math.max(0,Number(val)||0) : val;
  // live recalc totals only (avoid full re-render so focus stays)
  spUpdateLineTotals();
}
function spUpdateLineTotals(){
  _spLines.forEach((li,i)=>{
    const et=document.getElementById("sp_et_"+i), at=document.getElementById("sp_at_"+i);
    if(et) et.textContent=sp_usd(spLineEstTotal(li));
    if(at) at.textContent=sp_usd(spLineActTotal(li));
  });
  const totEst=_spLines.reduce((s,li)=>s+spLineEstTotal(li),0);
  const totAct=_spLines.reduce((s,li)=>s+spLineActTotal(li),0);
  const host=document.getElementById("sp_linesTotals");
  if(host) host.innerHTML=`Request Total — Estimated: <span style="color:var(--brand)">${sp_usd(totEst)}</span> &nbsp;·&nbsp; Actual: <span style="color:#059669">${sp_usd(totAct)}</span>`;
}
function spRenderLines(){
  const host=document.getElementById("sp_linesHost");
  if(!host) return;
  const suppliers=[...new Set(DB.suppliers.map(s=>s.name).filter(Boolean))];
  const supOpts=v=>`<option value="">—</option>`+suppliers.map(s=>`<option ${v===s?'selected':''}>${esc(s)}</option>`).join("")+(v&&!suppliers.includes(v)?`<option selected>${esc(v)}</option>`:"");
  host.innerHTML=_spLines.map((li,i)=>`
    <div class="sp-line" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:12.5px">Item ${i+1}</b><button class="act-btn del" title="Remove line" onclick="spRemoveLine(${i})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>
      <div class="form-grid">
        <div class="field"><label class="req">Spare Part Name</label><input value="${esc(li.partName)}" oninput="spLineInput(${i},'partName',this.value)"></div>
        <div class="field"><label>Part Number</label><input value="${esc(li.partNumber)}" oninput="spLineInput(${i},'partNumber',this.value)"></div>

  for(const li of cleanLines){
    if((Number(li.qtyRequested)||0)<0||(Number(li.estUnitPrice)||0)<0||(Number(li.actUnitPrice)||0)<0){ toast("No negative values","Quantities and prices must be 0 or more","err"); return; }
    const req=Number(li.qtyRequested)||0, ord=Number(li.qtyOrdered)||0, rec=Number(li.qtyReceived)||0, ins=Number(li.qtyInstalled)||0;

    confirmedBy:g("sp_confirmedBy"), confirmDate:g("sp_confirmDate"), techRemarks:g("sp_techRemarks"),
    lines:cleanLines,

  });
  // persist attachments (async), then finalize

    else { if(prevStatus!==obj.status) spAudit(obj.id,"Status changed",prevStatus,obj.status,""); else spAudit(obj.id,"Edited",prevStatus,obj.status,""); toast("Request updated",obj.reqNo,"ok"); }
    saveDB(); buildNav(); closeModal();

// Map a maintenance-category string to the short PM/CM/EM code
function spMaintCatCode(category){
  if(!category) return "";
  if(/PM|Preventive/i.test(category)) return "PM";
  if(/CM|Corrective/i.test(category)) return "CM";
  if(/EM|Emergency/i.test(category)) return "EM";
  return "";
}
// Resolve equipment fields from a unit id into a prefill fragment
function spUnitPrefill(unitId){
  const u=spFindUnit(unitId); if(!u) return {};
  const frag={
    assetUnitId:u.id, assetId:u.assetId||u.systemId||"",
    brand:u.brand||"", model:u.model||"", serial:u.serial||"", capacity:u.capacity||"",
    condition:u.condition||"", opStatus:u.opStatus||"", campus:u.campus||"",
    building:u.building||"", floor:u.floor||"", room:u.location||"",
    equipLocation:[u.building,u.floor,u.location].filter(Boolean).join(" / ")
  };
  if(u.kind==="vrf-out"){ frag.acType="VRF"; frag.vrfSystemId=u.systemId||""; frag.inout="Outdoor"; }
  else if(u.kind==="vrf-in"){ frag.acType="VRF"; frag.inout="Indoor"; const p=DB.acUnits.find(x=>x.id===u.parentId); if(p){ frag.vrfSystemId=p.systemId||""; frag.parentOutdoor=p.systemId||p.assetId||""; } }
  else { frag.acType="Single Split"; }
  return frag;
}
// Try to find a unit by its visible assetId text (fallback when record has no unitId)
function spUnitByAssetId(assetId){
  if(!assetId) return null;
  const a=String(assetId).trim().toLowerCase();
  return DB.acUnits.find(u=>String(u.assetId||"").trim().toLowerCase()===a || String(u.systemId||"").trim().toLowerCase()===a)||null;
}

// ---- Build prefill from each source type ----
function spPrefillFromPMEM(rec){
  let pf={};
  if(rec.unitId) pf=spUnitPrefill(rec.unitId);
  else { const u=spUnitByAssetId(rec.assetId); if(u) pf=spUnitPrefill(u.id); }
  pf.acType=pf.acType||rec.acType||"";
  pf.assetId=pf.assetId||rec.assetId||"";
  pf.campus=pf.campus||rec.campus||"";
  pf.room=pf.room||rec.location||"";
  pf.equipLocation=pf.equipLocation||rec.location||"";
  pf.maintCategory=spMaintCatCode(rec.category);
  pf.linkedMaint=rec.recId||"";
  pf.technician=rec.technician||"";
  pf.responsible=rec.technician||"";
  pf.faultDescription=rec.findings||"";
  pf.findings=rec.findings||"";
  pf.repairAction=rec.action||"";
  pf.techRemarks=rec.remarks||"";
  pf.priority=(spMaintCatCode(rec.category)==="EM")?"Critical":"Medium";
  pf.requestDate=new Date().toISOString().slice(0,10);
  pf.sourceType=spMaintCatCode(rec.category)||"PM";
  pf.sourceId=rec.id;
  return pf;
}
function spPrefillFromCM(c){
  let pf={};
  const u=spUnitByAssetId(c.assetId); if(u) pf=spUnitPrefill(u.id);
  pf.acType=pf.acType||"";
  pf.assetId=pf.assetId||c.assetId||"";
  pf.maintCategory="CM";

// Build a request from the CURRENTLY OPEN PM/EM form (reads live field values + failed items)
function spRequestFromChecklist(){

   SPARE PARTS — PHASE 4: procurement + PO integration

// Map spare-parts status -> closest existing procurement status
function spToProcStatus(spStatus){
  const map={
    "Spare Parts Needed":"To Do","Technical Specification Pending":"To Do","Specification Confirmed":"To Do",
    "Pending Approved PR":"Pending Approval","Approved PR Received":"Approved",
    "Requesting Quotation":"Requesting Quotation","Quotation Received":"Quotation Received",
    "Pending Supplier Selection":"Quotation Received","Supplier Approved":"Approved",
    "Purchase Order Created":"Ordered","Ordered":"Ordered","Partially Delivered":"Partially Delivered",
    "Delivered":"Delivered","Waiting for Installation":"Delivered","Installation Scheduled":"Delivered",
    "Installed":"Completed","Testing":"Completed","Completed":"Completed","Closed":"Completed",
    "On Hold":"On Hold","Cancelled":"Cancelled"
  };
  return map[spStatus]||"To Do";
}

// Find or create the AC Spare Parts procurement category (list). Never renames/removes existing lists.
function spEnsureProcCategory(){
  const norm=s=>String(s||"").trim().toLowerCase();
  let list=DB.procurementLists.find(l=>norm(l.name)===norm(SP_PROC_CATEGORY));
  if(!list){
    list={id:uid(),name:SP_PROC_CATEGORY,campus:"",archived:false,order:DB.procurementLists.length,created:Date.now()};
    DB.procurementLists.push(list);
  } else if(list.archived){ list.archived=false; }
  return list;
}

// Build the procurement record object from a spare-parts request (cost-control aware)
function spBuildProcObject(r,listId){
  // budget line items from spare lines: use approved qty if set else requested; est unit price (or actual if present)
  const items=(r.lines||[]).map(li=>{
    const qty=(Number(li.qtyApproved)||0)>0?Number(li.qtyApproved):(Number(li.qtyRequested)||0);
    const price=(Number(li.actUnitPrice)||0)>0?Number(li.actUnitPrice):(Number(li.estUnitPrice)||0);
    return {desc:(li.partName||"Spare part")+(li.partNumber?(" ("+li.partNumber+")"):""),qty,price};
  });
  const budget=items.reduce((a,it)=>a+(it.qty*it.price),0);
  const remarks=[
    "Spare Parts Request: "+(r.reqNo||""),
    r.assetId?("AC Asset: "+r.assetId):"",
    r.faultDescription?("Fault: "+r.faultDescription):"",
    (r.linkedMaint||r.linkedCM)?("Maint Record: "+[r.linkedMaint,r.linkedCM].filter(Boolean).join(" / ")):""
  ].filter(Boolean).join(" | ");
  return {
    id:uid(),
    name:"AC Spare Parts – "+(r.assetId||"Unknown")+" – "+(r.campus||""),
    campus:r.campus||"",
    category:"HVAC / AC Maintenance",
    listId:listId,
    pr:r.prNumber||"",
    quote:"",
    po:r.poNumber||"",
    supplier:r.selectedSupplier||r.proposedSupplier||"",
    budget:budget,
    status:spToProcStatus(r.status),
    due:r.requiredDate||"",
    responsible:r.responsible||"",
    items:items,
    remarks:remarks,
    files:r.files?JSON.parse(JSON.stringify(r.files)):[],
    comments:[],
    history:[{by:spUser(),at:Date.now(),action:"Created from spare-parts request "+(r.reqNo||"")}],
    created:Date.now(), updated:Date.now(),
    fromSpareRequest:r.id
  };
}

// Create the linked procurement record (guarded: once only, PR required)
function spCreateProcurement(reqId){
  if(!spCanFinance()){ toast("Permission denied","You cannot create procurement records","err"); return; }
  const r=DB.acSpareRequests.find(x=>x.id===reqId); if(!r){ toast("Request not found","","err"); return; }
  if(r.procurementId && DB.procurement.some(p=>p.id===r.procurementId)){
    toast("Already created","A procurement record already exists for this request","err"); return;
  }
  // PR number must be entered before creating the connected procurement record
  if(!r.prNumber || !String(r.prNumber).trim()){
    spPromptPRNumber(reqId, ()=>spCreateProcurement(reqId));
    return;
  }
  const list=spEnsureProcCategory();
  const obj=spBuildProcObject(r,list.id);
  DB.procurement.unshift(obj);
  r.procurementId=obj.id;
  r.updated=spNow();
  if(r.status==="Spare Parts Needed"||r.status==="Specification Confirmed"||r.status==="Approved PR Received") r.status="Requesting Quotation";
  spAudit(r.id,"Procurement record created","",r.status,"Linked procurement "+(obj.pr||obj.name));
  if(typeof poRememberItems==="function") poRememberItems(obj.items);
  saveDB(); buildNav();
  if(CURRENT==="maintenance") renderMaintenance();
  toast("Procurement record created","Added to “"+SP_PROC_CATEGORY+"” · "+sp_usd(obj.budget),"ok");
}

/* ============================================================
   SPARE PARTS — PHASE 5: delivery/receiving + replacement/installation
   - Receiving with cumulative history (acSpareReceipts)
   - Installation/replacement records (acReplacementRecords)
   - Auto status: Partially Delivered / Delivered / Waiting for Installation
   - Equipment + maintenance updates on successful install
   - Closure guards
============================================================ */
const SP_TEST_RESULTS=["Pass","Fail","Further Action Required"];
const SP_PART_CONDITIONS=["New / Good","Damaged","Wrong Item","Incomplete"];

// ---- receiving totals (from cumulative receipts) ----
function spReceivedForLine(reqId,lineId){
  return DB.acSpareReceipts.filter(x=>x.reqId===reqId).reduce((s,rc)=>{
    const li=(rc.lines||[]).find(l=>l.lineId===lineId);
    return s+(li?(Number(li.currentReceived)||0):0);
  },0);
}
function spAcceptedForLine(reqId,lineId){
  return DB.acSpareReceipts.filter(x=>x.reqId===reqId).reduce((s,rc)=>{
    const li=(rc.lines||[]).find(l=>l.lineId===lineId);
    return s+(li?(Number(li.accepted)||0):0);
  },0);
}
function spInstalledForLine(reqId,lineId){
  return DB.acReplacementRecords.filter(x=>x.reqId===reqId).reduce((s,rr)=>{
    const li=(rr.lines||[]).find(l=>l.lineId===lineId);
    return s+(li?(Number(li.qtyInstalled)||0):0);
  },0);
}
// Recompute per-line received/installed onto the request lines from cumulative history, then set status
function spRecomputeRequest(r){
  let allReceived=true, anyReceived=false, allInstalled=true, anyAccepted=false;
  (r.lines||[]).forEach(li=>{
    const ordered=(Number(li.qtyOrdered)||0)>0?Number(li.qtyOrdered):(Number(li.qtyApproved)||Number(li.qtyRequested)||0);
    const rec=spReceivedForLine(r.id,li.id);
    const acc=spAcceptedForLine(r.id,li.id);
    const ins=spInstalledForLine(r.id,li.id);
    li.qtyReceived=rec; li.qtyInstalled=ins;
    if(acc>0) anyAccepted=true;
    if(rec>0) anyReceived=true;
    if(ordered>0 && rec<ordered) allReceived=false;
    if(ordered<=0) allReceived=false;
    if(acc>0 && ins<acc) allInstalled=false;
    if(acc<=0) allInstalled=false;
  });
  // don't override terminal states
  if(["Completed","Closed","Cancelled","On Hold"].includes(r.status)) return;
  if(DB.acReplacementRecords.some(x=>x.reqId===r.id) && allInstalled && anyAccepted){
    // installation stage handled by installer; leave as-is unless clearly done
  }
  if(anyReceived && !allReceived) r.status="Partially Delivered";
  else if(allReceived && anyReceived){
    // all approved items received
    if(anyAccepted) r.status="Waiting for Installation"; else r.status="Delivered";
  }
}

// ---- outstanding for a line (ordered - cumulative received) ----
function spOutstandingForLine(r,li){
  const ordered=(Number(li.qtyOrdered)||0)>0?Number(li.qtyOrdered):(Number(li.qtyApproved)||Number(li.qtyRequested)||0);
  return Math.max(0, ordered - spReceivedForLine(r.id,li.id));
}

// ============================================================

let _spReceiveLines=[]; let _spReceiveReqId=null;

    lineId:li.id, partName:li.partName, partNumber:li.partNumber, uom:li.uom,
    ordered:(Number(li.qtyOrdered)||0)>0?Number(li.qtyOrdered):(Number(li.qtyApproved)||Number(li.qtyRequested)||0),
    prevReceived:spReceivedForLine(reqId,li.id),

  }));

  const supplier=r.selectedSupplier||r.proposedSupplier||"";
  openModal(`
    <div class="modal-head"><h3>Record Delivery — ${esc(r.reqNo||"")}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label class="req">Receiving Date</label><input type="date" id="spr_date" value="${today}"></div>
        <div class="field"><label>PO Number</label><input id="spr_po" value="${esc(r.poNumber||'')}"></div>
        <div class="field"><label>Supplier</label><input id="spr_supplier" value="${esc(supplier)}"></div>
        <div class="field"><label>Delivery Note Number</label><input id="spr_dn" value=""></div>
        <div class="field"><label>Invoice Number</label><input id="spr_inv" value=""></div>
        <div class="field"><label>Received By</label><input id="spr_by" value="${esc(spUser())}"></div>
        <div class="field"><label>Storage Location</label><input id="spr_store" value=""></div>
      </div>

      <div class="table-wrap" style="overflow-x:auto"><table class="sp-table"><thead><tr>
        <th>Part</th><th class="n">Ordered</th><th class="n">Prev. Recv</th><th class="n">Outstanding</th><th class="n">Now Received</th><th class="n">Accepted</th><th class="n">Rejected</th><th>Reject Reason</th><th>Condition</th><th>Serial/Batch</th>
      </tr></thead><tbody>${_spReceiveLines.map((li,i)=>{
        const outstanding=Math.max(0,li.ordered-li.prevReceived);
        return `<tr>
          <td><b>${esc(li.partName)}</b>${li.partNumber?`<div class="muted" style="font-size:11px">${esc(li.partNumber)}</div>`:""}</td>
          <td class="n">${li.ordered}</td>
          <td class="n">${li.prevReceived}</td>
          <td class="n" id="spr_out_${i}">${outstanding}</td>
          <td class="n"><input type="number" min="0" step="1" value="0" style="width:70px" oninput="spReceiveInput(${i},'currentReceived',this.value)"></td>
          <td class="n"><input type="number" min="0" step="1" value="0" style="width:70px" oninput="spReceiveInput(${i},'accepted',this.value)"></td>
          <td class="n"><input type="number" min="0" step="1" value="0" style="width:70px" oninput="spReceiveInput(${i},'rejected',this.value)"></td>
          <td><input value="" placeholder="if rejected" style="width:120px" oninput="spReceiveInput(${i},'rejectReason',this.value)"></td>
          <td><select onchange="spReceiveInput(${i},'condition',this.value)">${SP_PART_CONDITIONS.map(c=>`<option ${li.condition===c?'selected':''}>${c}</option>`).join("")}</select></td>
          <td><input value="" style="width:110px" oninput="spReceiveInput(${i},'serialBatch',this.value)"></td>
        </tr>`;
      }).join("")}</tbody></table></div>
      <div class="sp-sec-title">Delivery Attachments</div>
      <label class="file-drop"><input type="file" multiple accept="${FILE_TYPES}" onchange="handleFileInput(this)"><span>Delivery notes, invoices, photos of received parts…</span></label>
      <div id="fileList" class="file-list"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="spSaveReceipt()">Save Delivery</button></div>
  `,{size:"wide"});
  renderStagedFiles();
}
function spReceiveInput(i,field,val){
  const isNum=["currentReceived","accepted","rejected"].includes(field);
  _spReceiveLines[i][field]= isNum ? Math.max(0,Number(val)||0) : val;
  if(field==="currentReceived"){
    // default accepted to received if user hasn't touched it
    // (kept simple: leave accepted to user)
  }
}
function spSaveReceipt(){
  if(!spCanEdit()){ toast("Permission denied","","err"); return; }
  const r=DB.acSpareRequests.find(x=>x.id===_spReceiveReqId); if(!r) return;
  const g=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const date=g("spr_date"); if(!date){ toast("Receiving date required","","err"); return; }
  // validate: current received <= outstanding (unless authorized), accepted+rejected <= received
  const authorized=spCanException();
  const recvLines=[];
  let anyQty=false;
  for(let i=0;i<_spReceiveLines.length;i++){
    const li=_spReceiveLines[i];
    const cur=Number(li.currentReceived)||0, acc=Number(li.accepted)||0, rej=Number(li.rejected)||0;
    const outstanding=Math.max(0,li.ordered-li.prevReceived);
    if(cur<0||acc<0||rej<0){ toast("No negative quantities","","err"); return; }
    if(cur>outstanding && !authorized){ toast("Received exceeds outstanding","Part \""+li.partName+"\": "+cur+" received but only "+outstanding+" outstanding. Only an authorized user can accept an over-delivery.","err"); return; }
    if((acc+rej)>cur){ toast("Accepted + rejected exceeds received","Part \""+li.partName+"\": accepted+rejected cannot exceed received.","err"); return; }
    if(cur>0){ anyQty=true; }
    recvLines.push({lineId:li.lineId,partName:li.partName,partNumber:li.partNumber,uom:li.uom,ordered:li.ordered,prevReceived:li.prevReceived,currentReceived:cur,cumulative:li.prevReceived+cur,outstanding:Math.max(0,outstanding-cur),accepted:acc,rejected:rej,rejectReason:li.rejectReason,condition:li.condition,serialBatch:li.serialBatch,warranty:li.warranty});
  }
  if(!anyQty){ toast("Nothing received","Enter a received quantity for at least one part","err"); return; }
  persistStagedFiles(_stagedFiles).then(fileRefs=>{
    const receipt={
      id:uid(), reqId:r.id, reqNo:r.reqNo, receivingDate:date, poNumber:g("spr_po"), supplier:g("spr_supplier"),
      deliveryNote:g("spr_dn"), invoiceNumber:g("spr_inv"), receivedBy:g("spr_by"), storageLocation:g("spr_store"),
      lines:recvLines, files:fileRefs, created:spNow(), createdBy:spUser()
    };
    DB.acSpareReceipts.push(receipt); // never overwrite previous receiving transactions
    const prev=r.status;
    spRecomputeRequest(r);
    r.actualDelivery=date;
    // reflect on request-level fields
    if(g("spr_dn")) r.deliveryNote=g("spr_dn");
    if(g("spr_inv")) r.invoiceNumber=g("spr_inv");
    r.deliveryStatus=(r.status==="Delivered"||r.status==="Waiting for Installation")?"Delivered":(r.status==="Partially Delivered"?"Partially Delivered":r.deliveryStatus||"");
    r.updated=spNow();
    spAudit(r.id,"Delivery recorded",prev,r.status,"DN "+(g("spr_dn")||"")+" · "+recvLines.reduce((s,l)=>s+l.currentReceived,0)+" item(s)");
    saveDB(); buildNav(); closeModal();
    if(CURRENT==="maintenance") renderMaintenance();
    toast("Delivery recorded","Status: "+r.status,"ok");
  });
}

function spInstallInput(i,val){ _spInstallLines[i].qtyInstalled=Math.max(0,Number(val)||0); }
function spSaveInstall(){
  if(!spCanEdit()){ toast("Permission denied","","err"); return; }
  const r=DB.acSpareRequests.find(x=>x.id===_spInstallReqId); if(!r) return;
  const g=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const date=g("spi_date"); if(!date){ toast("Replacement date required","","err"); return; }
  const authorized=spCanException();
  const insLines=[]; let anyInstall=false;
  for(let i=0;i<_spInstallLines.length;i++){
    const li=_spInstallLines[i];
    const q=Number(li.qtyInstalled)||0;
    const remaining=Math.max(0,li.accepted-li.alreadyInstalled);
    if(q<0){ toast("No negative quantities","","err"); return; }
    if(q>remaining && !authorized){ toast("Installed exceeds accepted","Part \""+li.partName+"\": cannot install "+q+"; only "+remaining+" accepted and not yet installed.","err"); return; }
    if(q>0) anyInstall=true;
    insLines.push({lineId:li.lineId,partName:li.partName,partNumber:li.partNumber,qtyInstalled:q});
  }
  if(!anyInstall){ toast("Nothing installed","Enter an installed quantity for at least one part","err"); return; }
  const testResult=g("spi_test");
  persistStagedFiles(_stagedFiles).then(fileRefs=>{
    const rec={
      id:uid(), reqId:r.id, reqNo:r.reqNo, maintRecordId:r.linkedMaint||r.linkedCM||"", assetId:r.assetId,
      assetUnitId:r.assetUnitId||"", campus:r.campus, location:r.equipLocation,
      replacementDate:date, technician:g("spi_tech"), supervisor:g("spi_supervisor"),
      removedPartName:g("spi_removedName"), removedPartNumber:g("spi_removedNo"), removedPartSerial:g("spi_removedSerial"),
      removedPartCondition:g("spi_removedCond"), disposalMethod:g("spi_disposal"),
      newPartName:insLines.map(l=>l.partName).join(", "), newPartSerial:g("spi_newSerial"),
      qtyInstalled:insLines.reduce((s,l)=>s+l.qtyInstalled,0), installAction:g("spi_action"), refrigerantAdded:g("spi_refrigerant"),
      testResult, coolingTest:g("spi_cooling"), voltageTest:g("spi_voltage"), operatingPressure:g("spi_pressure"),
      errorCode:g("spi_errorCode"), returnedToService:g("spi_returned"), finalCondition:g("spi_finalCond"), finalOpStatus:g("spi_finalOp"),
      totalDowntime:g("spi_downtime"), followup:g("spi_followup"), followupDate:g("spi_followupDate"),
      techSignature:g("spi_techSign"), supervisorVerify:g("spi_supVerify"), remarks:g("spi_remarks"),
      lines:insLines, files:fileRefs, created:spNow(), createdBy:spUser()
    };
    DB.acReplacementRecords.push(rec);
    const prev=r.status;
    spRecomputeRequest(r); // updates per-line installed
    // On successful installation + pass, update equipment + maintenance and set request Completed
    if(testResult==="Pass" && g("spi_returned")==="Yes"){
      // update equipment
      const u=r.assetUnitId?spFindUnit(r.assetUnitId):spUnitByAssetId(r.assetId);
      if(u){
        if(g("spi_finalCond")) u.condition=g("spi_finalCond");
        if(g("spi_finalOp")) u.opStatus=g("spi_finalOp");
        u.spareHistory=u.spareHistory||[];
        u.spareHistory.push({at:spNow(),reqNo:r.reqNo,date:date,parts:rec.newPartName,by:rec.technician,result:testResult});
      }
      // update linked maintenance / corrective record
      spUpdateLinkedMaintenance(r,rec);
      r.status="Completed";
    } else {
      // installed but testing not passed / not returned -> Installed or Testing stage
      if(testResult==="Fail"||testResult==="Further Action Required") r.status="Testing";
      else r.status="Installed";
    }
    r.installedDate=date; r.testResult=testResult; r.returnedToService=g("spi_returned");
    r.updated=spNow();
    spAudit(r.id,"Installation recorded",prev,r.status,"Test: "+testResult+" · Returned: "+g("spi_returned"));
    saveDB(); buildNav(); closeModal();
    if(CURRENT==="maintenance") renderMaintenance();
    toast("Installation recorded", testResult==="Pass"?"Testing passed · Status: "+r.status:"Status: "+r.status, testResult==="Fail"?"err":"ok");
  });
}
// Push the installed spare-parts cost onto the linked maintenance/corrective record (final installed cost)
function spUpdateLinkedMaintenance(r,rec){
  const installedCost=(r.lines||[]).reduce((s,li)=>{
    const price=(Number(li.actUnitPrice)||0)>0?Number(li.actUnitPrice):(Number(li.estUnitPrice)||0);
    return s+(spInstalledForLine(r.id,li.id)*price);
  },0);
  // maintenance record (acRecords) by recId
  if(r.linkedMaint){
    const m=DB.acRecords.find(x=>x.recId===r.linkedMaint);
    if(m){
      m.partsCost=Number(installedCost.toFixed(2));
      m.parts=((m.parts?m.parts+"; ":"")+"Replaced: "+rec.newPartName).slice(0,300);
      if(rec.finalCondition) m.conditionAfter=rec.finalCondition;
      m.updated=Date.now();
      if(!Array.isArray(m.checklist)) {}
    }
  }
  // corrective record (acCorrective) by cmId
  if(r.linkedCM){
    const c=DB.acCorrective.find(x=>x.cmId===r.linkedCM);
    if(c){
      c.repairCost=Number(((Number(c.repairCost)||0)+installedCost).toFixed(2))===installedCost?installedCost:Number(installedCost.toFixed(2));
      c.parts=((c.parts?c.parts+"; ":"")+"Replaced: "+rec.newPartName).slice(0,300);
      if(rec.testResult) c.testing=rec.testResult;
      if(rec.returnedToService==="Yes" && !["Completed","Closed"].includes(c.stage)) c.stage="Completed";
      c.updated=Date.now();
    }
  }
}

// ---- Closure guards ----
function spCanClose(r){
  const reasons=[];
  // all approved/ordered quantities received?
  let allReceived=true;
  (r.lines||[]).forEach(li=>{
    const ordered=(Number(li.qtyOrdered)||0)>0?Number(li.qtyOrdered):(Number(li.qtyApproved)||Number(li.qtyRequested)||0);
    if(ordered>0 && spReceivedForLine(r.id,li.id)<ordered) allReceived=false;
    if(ordered<=0) allReceived=false;
  });
  if(!allReceived) reasons.push("Not all required quantities have been received");
  if(!DB.acReplacementRecords.some(x=>x.reqId===r.id)) reasons.push("No installation/replacement has been recorded");
  const lastRep=DB.acReplacementRecords.filter(x=>x.reqId===r.id).slice(-1)[0];
  if(lastRep && lastRep.testResult!=="Pass") reasons.push("Latest testing result is not Pass");
  if(lastRep && lastRep.returnedToService!=="Yes") reasons.push("Equipment has not been returned to service");
  return reasons;
}
function spCloseRequest(reqId){
  const r=DB.acSpareRequests.find(x=>x.id===reqId); if(!r) return;
  const reasons=spCanClose(r);
  if(reasons.length){
    if(!spCanException()){
      toast("Cannot close request", reasons[0]+(reasons.length>1?(" (+"+(reasons.length-1)+" more)"):""),"err");
      return;
    }
    // authorized user may close with a justified exception
    confirmModal("Close with exception?","The following conditions are not met:<br><br>• "+reasons.map(esc).join("<br>• ")+"<br><br>As an authorized user you may record a justified exception and close anyway.",()=>{
      const prev=r.status; r.status="Closed"; r.closedException=true; r.updated=spNow();
      spAudit(r.id,"Closed (exception)",prev,"Closed","Closed despite: "+reasons.join("; "));
      saveDB(); buildNav(); if(CURRENT==="maintenance") renderMaintenance(); toast("Request closed (exception recorded)","","ok");
    },"Close anyway",false);
    return;
  }
  const prev=r.status; r.status="Closed"; r.updated=spNow();
  spAudit(r.id,"Closed",prev,"Closed","All closure conditions met");
  saveDB(); buildNav(); if(CURRENT==="maintenance") renderMaintenance(); toast("Request closed","","ok");
}

// ---- date helpers ----
function spInMonth(dstr,y,m){ if(!dstr)return false; const d=new Date(dstr); return d.getFullYear()===y && (d.getMonth()+1)===m; }
function spInYear(dstr,y){ if(!dstr)return false; return new Date(dstr).getFullYear()===y; }
function spDaysUntil(dstr){ if(!dstr)return null; const d=new Date(dstr); const now=new Date(new Date().toDateString()); return Math.round((d-now)/(1000*60*60*24)); }

// ---- KPI aggregations ----
function spKPIs(){
  const reqs=DB.acSpareRequests;
  const y=_acYear, m=_acMonth;
  const openReqs=reqs.filter(r=>SP_OPEN_STATUSES.includes(r.status));
  const kpi={
    open:openReqs.length,
    critical:reqs.filter(r=>r.priority==="Critical"&&SP_OPEN_STATUSES.includes(r.status)).length,
    pendingTech:reqs.filter(r=>["Technical Specification Pending"].includes(r.status)).length,
    pendingPR:reqs.filter(r=>["Pending Approved PR"].includes(r.status)).length,
    sourcing:reqs.filter(r=>["Requesting Quotation","Quotation Received","Pending Supplier Selection","Supplier Approved"].includes(r.status)).length,
    ordered:reqs.filter(r=>["Ordered","Purchase Order Created"].includes(r.status)).length,
    overdueDeliveries:reqs.filter(r=>spIsOverdue(r)&&["Ordered","Purchase Order Created","Partially Delivered"].includes(r.status)).length,
    waitingInstall:reqs.filter(r=>["Waiting for Installation","Delivered","Installation Scheduled"].includes(r.status)).length,
    installedThisMonth:DB.acReplacementRecords.filter(x=>spInMonth(x.replacementDate,y,m)).length,
    completedThisMonth:reqs.filter(r=>["Completed","Closed"].includes(r.status)&&spInMonth(r.installedDate||r.updated&&new Date(r.updated).toISOString().slice(0,10),y,m)).length,
    monthlyCost:0, annualCost:0, downtime:0
  };
  // cost = installed cost (actual, counted once); fall back to received*price
  reqs.forEach(r=>{
    (r.lines||[]).forEach(li=>{
      const price=(Number(li.actUnitPrice)||0)>0?Number(li.actUnitPrice):(Number(li.estUnitPrice)||0);
      const inst=Number(li.qtyInstalled)||0;
    });
  });
  // monthly/annual from replacement records (installed date drives realized cost)
  DB.acReplacementRecords.forEach(rr=>{
    const r=DB.acSpareRequests.find(x=>x.id===rr.reqId);
    let cost=0;
    (rr.lines||[]).forEach(l=>{
      const li=r&&(r.lines||[]).find(x=>x.id===l.lineId);
      const price=li?((Number(li.actUnitPrice)||0)>0?Number(li.actUnitPrice):(Number(li.estUnitPrice)||0)):0;
      cost+=(Number(l.qtyInstalled)||0)*price;
    });
    if(spInYear(rr.replacementDate,y)) kpi.annualCost+=cost;
    if(spInMonth(rr.replacementDate,y,m)) kpi.monthlyCost+=cost;
    kpi.downtime+=Number(rr.totalDowntime)||0;
  });
  return kpi;
}
// ---- alerts ----
function spAlerts(){
  const reqs=DB.acSpareRequests;
  const critical=reqs.filter(r=>r.priority==="Critical"&&SP_OPEN_STATUSES.includes(r.status));
  const overduePR=reqs.filter(r=>r.status==="Pending Approved PR"&&spIsOverdue(r));
  const overdueQuote=reqs.filter(r=>["Requesting Quotation"].includes(r.status)&&spIsOverdue(r));
  const overdueDelivery=reqs.filter(r=>spIsOverdue(r)&&["Ordered","Purchase Order Created","Partially Delivered"].includes(r.status));
  const waitingInstall=reqs.filter(r=>["Waiting for Installation","Delivered"].includes(r.status));
  const failedTesting=reqs.filter(r=>r.testResult&&r.testResult!=="Pass"&&["Testing","Installed"].includes(r.status));
  // warranty expiry within 30/60/90
  const warranty=[];
  reqs.forEach(r=>(r.lines||[]).forEach(li=>{
    const days=spDaysUntil(li.warrantyExpiry);
    if(days!=null && days>=0 && days<=90) warranty.push({req:r,part:li.partName,days,expiry:li.warrantyExpiry});
  }));
  warranty.sort((a,b)=>a.days-b.days);
  return {critical,overduePR,overdueQuote,overdueDelivery,waitingInstall,failedTesting,warranty};
}

// ---- lead time + supplier performance helpers ----
function spLineLeadTimes(){
  // per receipt: leadtime = receivingDate - orderDate(request)
  const arr=[];
  DB.acSpareReceipts.forEach(rc=>{
    const r=DB.acSpareRequests.find(x=>x.id===rc.reqId);
    if(!r||!r.orderDate||!rc.receivingDate) return;
    const days=Math.round((new Date(rc.receivingDate)-new Date(r.orderDate))/(1000*60*60*24));
    if(days>=0) arr.push({supplier:rc.supplier||r.selectedSupplier||"Unknown",days,onTime:(r.expectedDelivery?new Date(rc.receivingDate)<=new Date(r.expectedDelivery):null)});
  });
  return arr;
}

function quarterMonths(q){ const x=QUARTERS.find(z=>z.q===q); return x?x.months:""; }
function maintReportTitle(type,year,q){ const p=MAINT_PROGRAMS[type]; return `${p.reportName} from ${quarterMonths(q)} ${year}`; }
function maintPrice(type,eqId){
  // effective price = latest override in DB.maintPrices, else program default

function getQuarter(type,year,q){

    DB.maintQuarters.push(qd); saveDB();

function maintQty(qd,eqId,campus){ const v=qd.matrix?.[eqId]?.[campus]; return (v===""||v==null)?"":Number(v); }
function maintCellFee(type,qd,eqId,campus){ const q=maintQty(qd,eqId,campus); return q===""?"":q*maintPrice(type,eqId); }
/* ---- Previous-quarter comparison (spot what changed in a new quarter) ---- */
let _maintCompare=false;
function prevQuarterOf(year,q){ return q===1?{year:year-1,q:4}:{year,q:q-1}; }
function getPrevQuarterData(type,year,q){ const pv=prevQuarterOf(year,q); return getQuarter(type,pv.year,pv.q); }
// Returns {changed:bool, prev:value, delta:number|null, kind:'up'|'down'|'new'|'removed'|'same'}
function maintCellDiff(type,qd,eqId,campus){
  const prev=getPrevQuarterData(type,qd.year,qd.q);
  if(!prev) return {changed:false,kind:"none",prev:""};
  const cur=maintQty(qd,eqId,campus);
  const old=maintQty(prev,eqId,campus);
  if(cur===""&&old==="") return {changed:false,kind:"same",prev:""};
  if(old===""&&cur!=="") return {changed:true,kind:"new",prev:"",delta:cur};
  if(cur===""&&old!=="") return {changed:true,kind:"removed",prev:old,delta:-old};
  if(Number(cur)===Number(old)) return {changed:false,kind:"same",prev:old};
  return {changed:true,kind:Number(cur)>Number(old)?"up":"down",prev:old,delta:Number(cur)-Number(old)};
}
function maintDiffSummary(type,qd,equipment,campuses){
  const prev=getPrevQuarterData(type,qd.year,qd.q);
  if(!prev) return null;
  let changed=0,up=0,down=0,added=0,removed=0;
  equipment.forEach(eq=>campuses.forEach(cp=>{
    const d=maintCellDiff(type,qd,eq.id,cp);
    if(d.changed){ changed++; if(d.kind==="up")up++; else if(d.kind==="down")down++; else if(d.kind==="new")added++; else if(d.kind==="removed")removed++; }
  }));
  const pv=prevQuarterOf(qd.year,qd.q);
  return {changed,up,down,added,removed,prevLabel:quarterMonths(pv.q)+" "+pv.year};
}
function toggleMaintCompare(type){ _maintCompare=!_maintCompare; paintMaintProgram(type); }

  const c=document.getElementById("content");
  const counts={
    ict:DB.maintQuarters.filter(x=>x.type==="ict").length,
    security:DB.maintQuarters.filter(x=>x.type==="security").length,
    records:DB.maintenance.length
  };
  const tab=(k,label,badge)=>`<button class="con-tab ${_maintTab===k?'active':''}" onclick="_maintTab='${k}';renderMaintenance()">${label}${badge!=null?` <span class="badge" style="margin-left:4px">${badge}</span>`:""}</button>`;
  const isAC=_maintTab.startsWith("ac:");
  const isSP=_maintTab.startsWith("sp:");
  const acTabs=[["ac:dashboard","AC Dashboard"],["ac:split","Single Split AC"],["ac:vrf","VRF System"],["ac:schedule","Monthly Schedule"],["ac:pm","Preventive (PM)"],["ac:cm","Corrective (CM)"],["ac:em","Emergency (EM)"],["ac:reports","AC Reports"]];
  const spTabs=[["sp:requests","Spare Parts Requests"],["sp:purchasing","Purchasing Tracker"],["sp:delivery","Delivery & Installation"],["sp:history","Replacement History"],["sp:reports","Spare Parts Reports"]];
  c.innerHTML=`
    <div class="con-tabs" style="margin-bottom:16px">
      ${isSP?spTabs.map(t=>tab(t[0],t[1])).join(""):isAC?acTabs.map(t=>tab(t[0],t[1])).join(""):`
      ${tab("dashboard","Maintenance Dashboard")}
      ${tab("ict","ICT Maintenance",counts.ict)}
      ${tab("security","Security Maintenance",counts.security)}
      ${tab("records","All Maintenance Records",counts.records)}
      ${tab("reports","Quarterly Reports")}`}
    </div>
    <div id="maintBody"></div>`;
  if(_maintTab==="dashboard") paintMaintDashboard();
  else if(_maintTab==="ict") paintMaintProgram("ict");
  else if(_maintTab==="security") paintMaintProgram("security");
  else if(_maintTab==="records") paintMaintRecords();
  else if(_maintTab==="reports") paintMaintReports();
  else if(_maintTab.startsWith("sp:")) paintSpare(_maintTab.slice(3));
  else if(_maintTab.startsWith("ac:")) paintAC(_maintTab.slice(3));
}

function maintPeriodSelector(onchange){
  const years=[]; for(let y=2022;y<=(new Date().getFullYear()+1);y++)years.push(y);
  return `<select class="filter-sel" onchange="_maintYear=+this.value;${onchange}">${years.map(y=>`<option ${y===_maintYear?'selected':''}>${y}</option>`).join("")}</select>
    <select class="filter-sel" onchange="_maintQ=+this.value;${onchange}">${QUARTERS.map(q=>`<option value="${q.q}" ${q.q===_maintQ?'selected':''}>${q.label} (${q.months})</option>`).join("")}</select>`;
}

/* ---------------- Quarterly program (ICT / Security) ---------------- */
function paintMaintProgram(type){
  const host=document.getElementById("maintBody");
  const p=MAINT_PROGRAMS[type];
  const qd=ensureQuarter(type,_maintYear,_maintQ);
  const campuses=maintCampuses();
  const canEdit=maintCanEdit() && !qd.locked;
  const title=maintReportTitle(type,_maintYear,_maintQ);
  // build matrix table
  let grand=0;
  const eqRows=p.equipment.map((eq,i)=>{
    const price=maintPrice(type,eq.id);
    let eqTotal=0;
    const cells=campuses.map(cp=>{
      const qty=maintQty(qd,eq.id,cp);
      const fee=qty===""?"":qty*price; if(fee!=="")eqTotal+=fee;
      let cls="", tip="", mark="";
      if(_maintCompare){
        const d=maintCellDiff(type,qd,eq.id,cp);
        if(d.changed){
          if(d.kind==="up"){ cls=" diff-up"; mark=`<span class="diff-mark">▲${d.delta}</span>`; tip=`Was ${d.prev} last quarter`; }
          else if(d.kind==="down"){ cls=" diff-down"; mark=`<span class="diff-mark">▼${Math.abs(d.delta)}</span>`; tip=`Was ${d.prev} last quarter`; }
          else if(d.kind==="new"){ cls=" diff-new"; mark=`<span class="diff-mark">NEW</span>`; tip="Not set last quarter"; }
          else if(d.kind==="removed"){ cls=" diff-removed"; mark=`<span class="diff-mark">—</span>`; tip=`Was ${d.prev} last quarter`; }
        }
      }
      return `<td class="num maint-cell ${canEdit?'editable':''}${cls}" ${tip?`title="${esc(tip)}"`:""} ${canEdit?`contenteditable="true" onblur="setMaintCell('${type}','${eq.id}','${cp}',this.innerText)"`:""} data-eq="${eq.id}" data-cp="${cp}">${qty===""?"":qty}${mark}</td>`;
    }).join("");
    grand+=eqTotal;
    return `<tr>
      <td style="text-align:center">${i+1}</td>
      <td class="maint-item"><b>${esc(eq.name)}</b></td>
      ${cells}
      <td class="num">${canEdit?`<span class="maint-price-edit" onclick="editMaintPrice('${type}','${eq.id}')" title="Edit price">$${price}</span>`:`$${price}`}</td>
      <td class="num"><b>${eqTotal?usdc(eqTotal):""}</b></td>
    </tr>`;
  }).join("");
  // campus totals row
  const campusTotals=campuses.map(cp=>{
    let t=0; p.equipment.forEach(eq=>{ const f=maintCellFee(type,qd,eq.id,cp); if(f!=="")t+=f; });
    return `<td class="num"><b>${t?usdc(t):""}</b></td>`;
  }).join("");
  host.innerHTML=`
    <div class="toolbar" style="flex-wrap:wrap;gap:8px">
      <div><div style="font-size:16px;font-weight:800">${esc(title)}</div><div class="muted" style="font-size:12px">${qd.locked?'<span style="color:var(--ok,#059669)">● Approved & Locked</span>':'Editable draft'}</div></div>
      <div class="grow"></div>
      ${maintPeriodSelector("renderMaintenance()")}
    </div>
    <div class="toolbar" style="gap:8px">
      ${canEdit?`<button class="btn btn-ghost btn-sm" onclick="copySetupFromPrev('${type}')">Copy Setup from Previous Quarter</button>`:""}
      ${canEdit?`<label class="btn btn-ghost btn-sm" style="cursor:pointer">Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importMaintWorkbook(this,'${type}')"></label>`:""}
      <button class="btn btn-sm ${_maintCompare?'btn-primary':'btn-ghost'}" onclick="toggleMaintCompare('${type}')" title="Highlight quantities that changed from the previous quarter">${_maintCompare?"✓ Comparing":"Compare with Previous Quarter"}</button>
      <div class="grow"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportMaintExcel('${type}')">Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="printMaintReport('${type}')">Print</button>
      ${maintCanApprove()?(qd.locked?`<button class="btn btn-ghost btn-sm" onclick="reopenQuarter('${type}')">Reopen Quarter</button>`:`<button class="btn btn-primary btn-sm" onclick="openApproval('${type}')">Submit / Approve</button>`):""}
    </div>
    ${(()=>{ if(!_maintCompare) return "";
      const s=maintDiffSummary(type,qd,p.equipment,campuses);
      if(!s) return `<div class="maint-diff-banner" style="border-color:var(--border)"><b>No previous quarter</b> — nothing to compare against yet.</div>`;
      if(!s.changed) return `<div class="maint-diff-banner"><b>No changes</b> — all quantities match ${esc(s.prevLabel)}.</div>`;
      return `<div class="maint-diff-banner"><b>${s.changed} change${s.changed>1?"s":""}</b> vs ${esc(s.prevLabel)} —
        ${s.up?`<span class="diff-chip up">▲ ${s.up} increased</span>`:""}
        ${s.down?`<span class="diff-chip down">▼ ${s.down} decreased</span>`:""}
        ${s.added?`<span class="diff-chip new">＋ ${s.added} new</span>`:""}
        ${s.removed?`<span class="diff-chip removed">— ${s.removed} cleared</span>`:""}</div>`;
    })()}
    <div class="maint-matrix-wrap"><table class="data maint-matrix"><thead>
      <tr><th class="freeze-1">No.</th><th class="freeze-2">Equipment Item</th>${campuses.map(cp=>`<th class="num">${esc(cp)}</th>`).join("")}<th class="num">Unit Price</th><th class="num">Equipment Total</th></tr>
      <tr><th class="freeze-1"></th><th class="freeze-2 muted" style="font-weight:500;font-size:10.5px">${quarterMonths(_maintQ)}-${_maintYear}</th>${campuses.map(()=>`<th></th>`).join("")}<th></th><th></th></tr>
    </thead><tbody>${eqRows}</tbody>
    <tfoot><tr style="font-weight:800;background:var(--surface-2)"><td class="freeze-1"></td><td class="freeze-2">CAMPUS TOTAL</td>${campusTotals}<td class="num">GRAND</td><td class="num">${usdc(grand)}</td></tr></tfoot>
    </table></div>
    ${maintApprovalHTML(qd)}`;
}
function usdc(v){ return "$"+(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function setMaintCell(type,eqId,cp,val){
  const qd=ensureQuarter(type,_maintYear,_maintQ); if(qd.locked)return;
  val=String(val).trim().replace(/,/g,"");
  qd.matrix[eqId]=qd.matrix[eqId]||{};
  if(val===""||isNaN(val)){ delete qd.matrix[eqId][cp]; }
  else { const n=Math.max(0,Number(val)); qd.matrix[eqId][cp]=n; }
  qd.updated=Date.now();
  saveDB();
  // repaint totals without losing focus jump (simple repaint)
  paintMaintProgram(type);
}
function editMaintPrice(type,eqId){
  if(!maintCanEditPrice()){ toast("Permission denied","Only authorized users can edit prices","err"); return; }
  const eq=MAINT_PROGRAMS[type].equipment.find(e=>e.id===eqId);
  const cur=maintPrice(type,eqId);
  const hist=DB.maintPrices[type+":"+eqId]||[];
  openModal(`<div class="modal-head"><h3>Unit Price — ${esc(eq.name)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="field"><label class="req">New Unit Price (USD)</label><input type="number" step="0.01" min="0" id="mp_price" value="${cur}"></div>
    <div class="field"><label>Effective Date</label><input type="date" id="mp_date" value="${new Date().toISOString().slice(0,10)}"></div>
  </div>
  ${hist.length?`<div style="margin-top:12px"><div class="muted" style="font-size:12px;margin-bottom:6px">Price history</div>${hist.slice().reverse().map(h=>`<div style="font-size:12px;display:flex;justify-content:space-between;padding:3px 0"><span>${esc(h.date)}</span><b>$${h.price}</b></div>`).join("")}</div>`:""}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMaintPrice('${type}','${eqId}')">Save Price</button></div>`);
}
function saveMaintPrice(type,eqId){
  const price=document.getElementById("mp_price").value;
  if(price===""||isNaN(price)||Number(price)<0){ toast("Enter a valid price","","err"); return; }
  const key=type+":"+eqId; DB.maintPrices[key]=DB.maintPrices[key]||[];
  DB.maintPrices[key].push({price:Number(price),date:document.getElementById("mp_date").value||new Date().toISOString().slice(0,10),by:(SESSION&&SESSION.name)||"System"});
  saveDB(); closeModal(); paintMaintProgram(type); toast("Price updated","","ok");
}
function copySetupFromPrev(type){
  const prevQ=_maintQ===1?4:_maintQ-1; const prevY=_maintQ===1?_maintYear-1:_maintYear;
  const prev=getQuarter(type,prevY,prevQ);
  if(!prev){ toast("No previous quarter","Nothing to copy from "+quarterMonths(prevQ)+" "+prevY,"err"); return; }
  const qd=ensureQuarter(type,_maintYear,_maintQ);
  if(qd.locked){ toast("Quarter is locked","Reopen it before copying","err"); return; }
  const hasData=Object.keys(qd.matrix||{}).length>0;
  openModal(`<div class="modal-head"><h3>Copy from ${esc(quarterMonths(prevQ)+" "+prevY)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p style="font-size:13px;margin:0 0 12px">Start this quarter from last quarter's numbers, then edit only what changed. Turn on <b>Compare with Previous Quarter</b> afterwards to see your edits highlighted.</p>
    <label style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer">
      <input type="radio" name="copymode" value="qty" checked style="margin-top:3px">
      <span><b>Copy quantities</b><br><span class="muted" style="font-size:12px">Brings over every campus quantity from ${esc(quarterMonths(prevQ)+" "+prevY)}. Recommended.</span></span>
    </label>
    <label style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:8px;cursor:pointer">
      <input type="radio" name="copymode" value="structure" style="margin-top:3px">
      <span><b>Structure only</b><br><span class="muted" style="font-size:12px">Just initialise the quarter — leave all quantities blank.</span></span>
    </label>
    ${hasData?`<div class="maint-diff-banner" style="margin-top:12px;border-color:#d97706;background:rgba(217,119,6,.12)">This quarter already has data — copying quantities will overwrite it.</div>`:""}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doCopyFromPrev('${type}',${prevY},${prevQ})">Copy</button></div>`,{size:"wide"});
}
function doCopyFromPrev(type,prevY,prevQ){
  const prev=getQuarter(type,prevY,prevQ); const qd=ensureQuarter(type,_maintYear,_maintQ);
  const mode=(document.querySelector('input[name="copymode"]:checked')||{}).value||"qty";
  if(mode==="qty"){
    qd.matrix=JSON.parse(JSON.stringify(prev.matrix||{}));
    qd.history=qd.history||[]; qd.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Copied quantities from "+quarterMonths(prevQ)+" "+prevY});
    saveDB(); closeModal(); _maintCompare=true; paintMaintProgram(type);
    toast("Quantities copied","Now edit what changed — differences are highlighted","ok",5000);
  } else {
    saveDB(); closeModal(); paintMaintProgram(type);
    toast("Quarter initialized","Structure ready, quantities left blank","ok");
  }
}

function openApproval(type){

      <div class="field"><label>Status</label><select id="ap_${k}_status"><option value="">Pending</option><option ${x.status==='Reviewed'?'selected':''}>Reviewed</option><option ${x.status==='Approved'?'selected':''}>Approved</option></select></div>

  <div class="modal-body">${stage("prepared","Prepared by")}${stage("checked","Checked by")}${stage("verified","Verified by")}
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px"><input type="checkbox" id="ap_lock"> Lock this quarter after saving (prevents further edits)</label>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveApproval('${type}')">Save Approval</button></div>`,{size:"wide"});
}
function saveApproval(type){
  const qd=ensureQuarter(type,_maintYear,_maintQ);
  ["prepared","checked","verified"].forEach(k=>{
    qd.approval[k]={name:gv("ap_"+k+"_name"),position:gv("ap_"+k+"_position"),status:gv("ap_"+k+"_status"),date:gv("ap_"+k+"_date"),comments:gv("ap_"+k+"_comments")};
  });
  if(document.getElementById("ap_lock").checked){ qd.locked=true; qd.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Quarter approved & locked"}); }
  saveDB(); closeModal(); paintMaintProgram(type); toast("Approval saved","","ok");
}
function gv(id){ const el=document.getElementById(id); return el?el.value:""; }
function reopenQuarter(type){
  if(!maintCanApprove()){ toast("Permission denied","","err"); return; }
  const qd=ensureQuarter(type,_maintYear,_maintQ);
  confirmModal("Reopen locked quarter?","This unlocks the quarter for editing. The action is logged.",()=>{
    qd.locked=false; qd.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Quarter reopened"});
    saveDB(); paintMaintProgram(type); toast("Quarter reopened","","ok");
  },"Reopen",false);
}

/* ----- permissions (simplified role gates) ----- */
function maintCanEdit(){ return isSuper()||!(SESSION&&SESSION.role==="viewer"); }
function maintCanEditPrice(){ return isSuper()||!(SESSION&&SESSION.role==="viewer"); }
function maintCanApprove(){ return isSuper()||!(SESSION&&SESSION.role==="viewer"); }

/* ---------------- Maintenance Dashboard ---------------- */
function quarterFee(qd){ let t=0; const p=MAINT_PROGRAMS[qd.type]; p.equipment.forEach(eq=>{ const price=maintPrice(qd.type,eq.id); Object.values(qd.matrix?.[eq.id]||{}).forEach(q=>{ t+=(Number(q)||0)*price; }); }); return t; }
function paintMaintDashboard(){
  const host=document.getElementById("maintBody");
  const yq=DB.maintQuarters.filter(x=>x.year===_maintYear);
  const ictFee=yq.filter(x=>x.type==="ict"&&x.q===_maintQ).reduce((a,x)=>a+quarterFee(x),0);
  const secFee=yq.filter(x=>x.type==="security"&&x.q===_maintQ).reduce((a,x)=>a+quarterFee(x),0);
  const annualFee=DB.maintQuarters.filter(x=>x.year===_maintYear).reduce((a,x)=>a+quarterFee(x),0);
  const recs=DB.maintenance.filter(r=>r.year===_maintYear&&(!r.quarter||r.quarter===_maintQ));
  const sched=recs.length, done=recs.filter(r=>r.status==="Completed").length;
  const pending=recs.filter(r=>["Scheduled","In Progress","Not Scheduled","Partially Completed"].includes(r.status)).length;
  const overdue=recs.filter(r=>maintIsOverdue(r)).length;
  const comp=sched?Math.round(done/sched*100):0;
  const kpi=(v,l,col)=>`<div class="kpi"><div class="val" style="font-size:20px;color:${col||'var(--text)'}">${v}</div><div class="lbl">${l}</div></div>`;
  host.innerHTML=`
    <div class="toolbar"><div style="font-size:15px;font-weight:800">Maintenance Dashboard</div><div class="grow"></div>${maintPeriodSelector("renderMaintenance()")}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      ${kpi(usdc(ictFee+secFee),"Total Maintenance Fee","#2563eb")}
      ${kpi(usdc(ictFee),"ICT Fee","#7c3aed")}
      ${kpi(usdc(secFee),"Security Fee","#0d9488")}
      ${kpi(usdc(annualFee),"Annual Total ("+_maintYear+")","#059669")}
      ${kpi(sched,"Scheduled Services")}
      ${kpi(done,"Completed","#059669")}
      ${kpi(pending,"Pending",pending?"#d97706":"#059669")}
      ${kpi(overdue,"Overdue",overdue?"#dc2626":"#059669")}
      ${kpi(comp+"%","Completion","#2563eb")}
    </div>
    <div class="charts-grid" style="margin-top:18px">
      <div class="card"><div class="card-head"><h3>Cost by Campus (${quarterMonths(_maintQ)} ${_maintYear})</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="mDashCampus"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>Quarterly Cost Comparison (${_maintYear})</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="mDashQuarter"></canvas></div></div></div>
    </div>
    <div class="charts-grid">
      <div class="card"><div class="card-head"><h3>Cost by Equipment Type</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="mDashEquip"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>ICT vs Security (${quarterMonths(_maintQ)} ${_maintYear})</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="mDashType"></canvas></div></div></div>
    </div>`;
  setTimeout(drawMaintDashCharts,40);
}
function drawMaintDashCharts(){
  if(typeof Chart==="undefined")return;
  if(!window._mCharts)window._mCharts={}; Object.keys(window._mCharts).forEach(k=>{try{window._mCharts[k].destroy();}catch(e){}});
  const C=chartColors();
  const campuses=maintCampuses();
  const qds=DB.maintQuarters.filter(x=>x.year===_maintYear&&x.q===_maintQ);
  // cost by campus
  const byCampus=campuses.map(cp=>{ let t=0; qds.forEach(qd=>{ const p=MAINT_PROGRAMS[qd.type]; p.equipment.forEach(eq=>{ const price=maintPrice(qd.type,eq.id); const q=Number(qd.matrix?.[eq.id]?.[cp])||0; t+=q*price; }); }); return t; });
  const cc=document.getElementById("mDashCampus");
  if(cc) window._mCharts.campus=new Chart(cc,{type:"bar",data:{labels:campuses,datasets:[{data:byCampus,backgroundColor:C.palette,borderRadius:6,maxBarThickness:24}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  // quarterly comparison
  const qComp=QUARTERS.map(q=>DB.maintQuarters.filter(x=>x.year===_maintYear&&x.q===q.q).reduce((a,x)=>a+quarterFee(x),0));
  const qc=document.getElementById("mDashQuarter");

/* ---------------- Import historical workbook data ---------------- */
function importMaintWorkbook(input,type){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  const KEYWORDS={
    computer:["computer"],server:["server"],wifi:["wifi","wi-fi","switch","router"],
    fingerprint:["fingerprint"],printer:["printer"],
    cctv:["cctv"],projector:["projector"],accessdoor:["access"],firealarm:["fire"],pasystem:["pa system","p.a","public address","pa "],ups:["ups"]
  };
  const matchEq=(itemName)=>{
    const a=itemName.toLowerCase();
    return MAINT_PROGRAMS[type].equipment.find(e=>{
      const kws=KEYWORDS[e.id]||[e.name.toLowerCase()];
      return kws.some(k=>a.includes(k));
    });
  };
  reader.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    let imported=0, sheetsDone=0;
    wb.SheetNames.forEach(sn=>{
      const lower=sn.toLowerCase(); let q=0;
      if(lower.includes("jan")&&lower.includes("mar"))q=1;
      else if(lower.includes("apr")||lower.includes("april"))q=2;
      else if(lower.includes("jul"))q=3;
      else if(lower.includes("oct"))q=4;
      else if(lower.includes("jan-june")||lower.includes("jan-jun"))q=1;
      const ym=sn.match(/(\d{2,4})\s*$/); let year=ym?Number(ym[1]):0; if(year&&year<100)year=2000+year;
      if(!q||!year)return;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
      let hdrIdx=rows.findIndex(r=>r.some(c=>/Date\s*\/\s*Items\s*\/\s*Campus/i.test(String(c))));
      if(hdrIdx<0) hdrIdx=rows.findIndex(r=>r.some(c=>/^No\.?$/i.test(String(c).trim()))&&r.some(c=>MAINT_CAMPUSES_DEFAULT.includes(String(c).trim().toUpperCase())));
      if(hdrIdx<0)return;
      const hdr=rows[hdrIdx];
      const campusCols={}; hdr.forEach((c,ci)=>{ let name=String(c).trim().toUpperCase(); if(name==="CKD")name="CKD1"; if(MAINT_CAMPUSES_DEFAULT.includes(name))campusCols[ci]=name; });
      if(!Object.keys(campusCols).length)return;
      const qd=ensureQuarter(type,year,q); qd.matrix=qd.matrix||{};
      for(let ri=hdrIdx+1;ri<rows.length;ri++){
        const row=rows[ri]; const itemName=String(row[1]||"").replace(/\(qty\)/i,"").trim();
        if(!itemName||/prepared|checked|verified|date:|officer|manager|president/i.test(itemName))continue;
        const eq=matchEq(itemName); if(!eq)continue;
        qd.matrix[eq.id]=qd.matrix[eq.id]||{};
        Object.entries(campusCols).forEach(([ci,cp])=>{ const v=row[ci]; if(v!==""&&v!=null&&!isNaN(v)){ qd.matrix[eq.id][cp]=Number(v); imported++; } });
      }
      sheetsDone++;
    });
    saveDB(); renderMaintenance(); toast("Import complete",sheetsDone+" quarter(s), "+imported+" values imported","ok");
  }catch(err){ console.error(err); toast("Import failed","Could not read workbook","err"); } };
  reader.readAsArrayBuffer(f); input.value="";
}

function acStatusBadge(s){ const c=MAINT_STATUS_COLORS[s]||{"Rescheduled":"#8b5cf6"}[s]||"#697586"; return `<span class="campus-tag" style="background:${c}22;color:${c}">${esc(s)}</span>`; }
function acRecordCost(r){ return (Number(r.laborCost)||0)+(Number(r.materialCost)||0)+(Number(r.partsCost)||0)+(Number(r.otherCost)||0); }

function paintAC(view){
  const host=document.getElementById("maintBody");
  switch(view){
    case "dashboard": paintACDashboard(host); break;
    case "split": paintACRegister(host,"split"); break;
    case "vrf": paintACVrf(host); break;
    case "schedule": paintACSchedule(host); break;
    case "pm": paintACRecords(host,"Preventive (PM)"); break;
    case "cm": paintACCorrective(host); break;
    case "em": paintACRecords(host,"Emergency (EM)"); break;
    case "reports": paintACReports(host); break;
    default: host.innerHTML="<div class='empty'><h4>AC Maintenance</h4></div>";
  }
}

/* ---------------- AC Dashboard ---------------- */
function paintACDashboard(host){
  const units=DB.acUnits;
  const split=units.filter(u=>u.kind==="split");
  const vrfOut=units.filter(u=>u.kind==="vrf-out");
  const vrfIn=units.filter(u=>u.kind==="vrf-in");
  const monthRecs=DB.acRecords.filter(r=>r.year===_acYear&&r.month===_acMonth);
  const planned=monthRecs.length;
  const done=monthRecs.filter(r=>r.status==="Completed").length;
  const pending=monthRecs.filter(r=>["Scheduled","In Progress","Not Scheduled","Partially Completed","Rescheduled"].includes(r.status)).length;
  const overdue=DB.acRecords.filter(acIsOverdue).length;
  const repair=units.filter(u=>u.opStatus==="Under Repair").length;
  const nonop=units.filter(u=>u.opStatus==="Non-Operational").length;
  const monthCost=monthRecs.reduce((a,r)=>a+acRecordCost(r),0);
  const annualCost=DB.acRecords.filter(r=>r.year===_acYear).reduce((a,r)=>a+acRecordCost(r),0);
  const comp=planned?Math.round(done/planned*100):0;
  const kpi=(v,l,col)=>`<div class="kpi"><div class="val" style="font-size:20px;color:${col||'var(--text)'}">${v}</div><div class="lbl">${l}</div></div>`;
  // alerts
  const alerts=DB.acRecords.filter(r=>acIsOverdue(r)||(r.nextDate&&new Date(r.nextDate)<=new Date(Date.now()+1000*60*60*24*14)&&r.status!=="Completed")).slice(0,8);
  host.innerHTML=`
    <div class="toolbar"><div style="font-size:15px;font-weight:800">AC Maintenance Dashboard</div><div class="grow"></div>${acPeriodSelector()}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      ${kpi(units.length,"Total AC Units","#2563eb")}
      ${kpi(split.length,"Single Split AC","#7c3aed")}
      ${kpi(vrfOut.length,"VRF Outdoor Units","#0d9488")}
      ${kpi(vrfIn.length,"VRF Indoor Units","#0891b2")}
      ${kpi(planned,"Planned This Month")}
      ${kpi(done,"Completed","#059669")}
      ${kpi(pending,"Pending",pending?"#d97706":"#059669")}
      ${kpi(overdue,"Overdue",overdue?"#dc2626":"#059669")}
      ${kpi(repair,"Under Repair",repair?"#d97706":"#059669")}
      ${kpi(nonop,"Non-Operational",nonop?"#dc2626":"#059669")}
      ${kpi(usdc(monthCost),"Monthly Cost","#2563eb")}
      ${kpi(usdc(annualCost),"Annual Cost","#059669")}
      ${kpi(comp+"%","Completion","#2563eb")}
    </div>
    <div class="charts-grid" style="margin-top:18px">
      <div class="card"><div class="card-head"><h3>Monthly Completion (${_acYear})</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartMonthly"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>Status by Campus</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartCampus"></canvas></div></div></div>
    </div>
    <div class="charts-grid">
      <div class="card"><div class="card-head"><h3>Split vs VRF</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartType"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>PM vs CM vs EM</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartCat"></canvas></div></div></div>
    </div>
    <div class="charts-grid">
      <div class="card"><div class="card-head"><h3>Monthly Cost Trend (${_acYear})</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartCost"></canvas></div></div></div>
      <div class="card"><div class="card-head"><h3>Equipment Condition</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="acChartCond"></canvas></div></div></div>
    </div>
    <div class="card" style="margin-top:16px"><div class="card-head"><h3>Upcoming & Overdue Alerts</h3></div><div class="card-body">
      ${alerts.length?alerts.map(r=>{const ov=acIsOverdue(r);return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)"><span class="campus-tag" style="background:${ov?'#dc2626':'#d97706'}22;color:${ov?'#dc2626':'#d97706'}">${ov?'Overdue':'Upcoming'}</span><span style="flex:1">${esc(r.assetId||"")} — ${esc(r.campus||"")} ${esc(r.location||"")}</span><span class="muted" style="font-size:12px">${fmtDateUS(ov?r.plannedDate:r.nextDate)}</span></div>`;}).join(""):'<p class="muted">No alerts.</p>'}
    </div></div>
    ${spDashboardSection()}`;
  setTimeout(()=>{ drawACCharts(); drawSpareCharts(); },40);
}
function acPeriodSelector(){
  const years=[]; for(let y=2023;y<=(new Date().getFullYear()+1);y++)years.push(y);
  return `<select class="filter-sel" onchange="_acYear=+this.value;renderMaintenance()">${years.map(y=>`<option ${y===_acYear?'selected':''}>${y}</option>`).join("")}</select>
    <select class="filter-sel" onchange="_acMonth=+this.value;renderMaintenance()">${AC_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===_acMonth?'selected':''}>${m}</option>`).join("")}</select>`;
}
function drawACCharts(){
  if(typeof Chart==="undefined")return;
  if(!window._acCharts)window._acCharts={}; Object.keys(window._acCharts).forEach(k=>{try{window._acCharts[k].destroy();}catch(e){}});
  const C=chartColors();
  // monthly completion
  const monthly=AC_MONTHS.map((_,i)=>{ const recs=DB.acRecords.filter(r=>r.year===_acYear&&r.month===i+1); const d=recs.filter(r=>r.status==="Completed").length; return recs.length?Math.round(d/recs.length*100):0; });
  const e1=document.getElementById("acChartMonthly");
  if(e1)window._acCharts.m=new Chart(e1,{type:"line",data:{labels:AC_MONTHS.map(m=>m.slice(0,3)),datasets:[{label:"% Completed",data:monthly,borderColor:"#2563eb",backgroundColor:"#2563eb22",tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{max:100,grid:{color:C.grid}},x:{grid:{display:false}}}}});
  // status by campus
  const campuses=acCampuses();
  const e2=document.getElementById("acChartCampus");
  if(e2)window._acCharts.c=new Chart(e2,{type:"bar",data:{labels:campuses,datasets:[
    {label:"Completed",data:campuses.map(cp=>DB.acRecords.filter(r=>r.campus===cp&&r.year===_acYear&&r.status==="Completed").length),backgroundColor:"#059669"},
    {label:"Pending",data:campuses.map(cp=>DB.acRecords.filter(r=>r.campus===cp&&r.year===_acYear&&r.status!=="Completed").length),backgroundColor:"#d97706"}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:9}}},y:{stacked:true,grid:{color:C.grid}}}}});
  // split vs vrf
  const e3=document.getElementById("acChartType");
  if(e3)window._acCharts.t=new Chart(e3,{type:"doughnut",data:{labels:["Single Split","VRF Outdoor","VRF Indoor"],datasets:[{data:[DB.acUnits.filter(u=>u.kind==="split").length,DB.acUnits.filter(u=>u.kind==="vrf-out").length,DB.acUnits.filter(u=>u.kind==="vrf-in").length],backgroundColor:["#7c3aed","#0d9488","#0891b2"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:10,font:{size:10.5}}}}}});
  // category
  const e4=document.getElementById("acChartCat");
  if(e4)window._acCharts.cat=new Chart(e4,{type:"doughnut",data:{labels:["Preventive","Corrective","Emergency"],datasets:[{data:[DB.acRecords.filter(r=>r.category==="Preventive (PM)").length,DB.acRecords.filter(r=>r.category==="Corrective (CM)").length+DB.acCorrective.length,DB.acRecords.filter(r=>r.category==="Emergency (EM)").length],backgroundColor:["#059669","#d97706","#dc2626"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:10}}}}});
  // cost trend
  const e5=document.getElementById("acChartCost");
  if(e5)window._acCharts.cost=new Chart(e5,{type:"bar",data:{labels:AC_MONTHS.map(m=>m.slice(0,3)),datasets:[{data:AC_MONTHS.map((_,i)=>DB.acRecords.filter(r=>r.year===_acYear&&r.month===i+1).reduce((a,r)=>a+acRecordCost(r),0)),backgroundColor:"#2563eb",borderRadius:5,maxBarThickness:20}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},x:{grid:{display:false}}}}});
  // condition
  const e6=document.getElementById("acChartCond");
  if(e6)window._acCharts.cond=new Chart(e6,{type:"doughnut",data:{labels:AC_CONDITIONS,datasets:[{data:AC_CONDITIONS.map(cd=>DB.acUnits.filter(u=>u.condition===cd).length),backgroundColor:["#059669","#2563eb","#d97706","#f59e0b","#dc2626"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:8,font:{size:10}}}}}});
}

function acFilterUnits(units){
  return units.filter(u=>{
    if(_acFilter.campus&&u.campus!==_acFilter.campus)return false;
    if(_acFilter.q){const q=_acFilter.q.toLowerCase();if(!((u.assetId+" "+u.brand+" "+u.model+" "+u.serial+" "+u.building+" "+u.location).toLowerCase().includes(q)))return false;}
    return true;
  });
}

function acUnitFields(kind){
  // returns [ [label,name,type,options?], ... ]
  const common=[["Asset ID","assetId"],["Campus","campus","sel",acCampuses()],["Building","building"],["Brand","brand"],["Model","model"],["Serial Number","serial"]];
  if(kind==="split") return [...common,["Floor","floor"],["Room / Location","location"],["Department","department"],["Cooling Capacity (BTU/h or HP)","capacity"],["Indoor Unit No.","indoorNo"],["Outdoor Unit No.","outdoorNo"],
    ["Installation Date","installDate","date"],["Warranty Expiry","warranty","date"],["Maintenance Provider","provider"],["Assigned Technician","technician"],
    ["Maintenance Frequency","frequency","sel",AC_FREQ],["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],
    ["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
  if(kind==="vrf-out") return [["System ID","systemId"],...common,["Installation Location","location"],["Capacity (HP or kW)","capacity"],["Refrigerant Type","refrigerant"],
    ["Connected Indoor Units","indoorCount","number"],["Installation Date","installDate","date"],["Warranty Expiry","warranty","date"],["Maintenance Provider","provider"],["Assigned Technician","technician"],
    ["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
  // vrf-in
  return [["Indoor Unit ID","assetId"],["Campus","campus","sel",acCampuses()],["Building","building"],["Floor","floor"],["Room / Location","location"],
    ["Indoor Unit Type","indoorType"],["Brand","brand"],["Model","model"],["Serial Number","serial"],["Capacity (BTU/h or kW)","capacity"],["Controller Type","controller"],
    ["Installation Date","installDate","date"],["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
}
function openACUnitForm(kind,id,extra){
  extra=extra||{};
  const u=id?DB.acUnits.find(x=>x.id===id):null;
  const fields=acUnitFields(kind);
  const titleMap={"split":"Single Split AC","vrf-out":"VRF Outdoor System","vrf-in":"VRF Indoor Unit"};
  const fieldHTML=([lbl,name,type,opts])=>{
    const val=u?u[name]:"";
    if(type==="sel") return `<div class="field"><label>${lbl}</label><select id="acf_${name}">${(opts||[]).map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join("")}</select></div>`;
    if(type==="date") return `<div class="field"><label>${lbl}</label><input type="date" id="acf_${name}" value="${val||''}"></div>`;

function saveACUnit(kind,id,parentId){
  const fields=acUnitFields(kind);
  const g=n=>{const el=document.getElementById("acf_"+n);return el?el.value:"";};

  const obj=id?DB.acUnits.find(x=>x.id===id):{id:uid(),kind,created:Date.now(),history:[]};
  fields.forEach(([_,name,type])=>{ obj[name]=type==="number"?(g(name)===""?"":Number(g(name))):g(name); });
