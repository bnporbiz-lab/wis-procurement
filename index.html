function saveACRecord(id,checklistLen){
  const g=n=>{const el=document.getElementById("acr_"+n);return el?el.value:"";};
  const num=v=>v===""||v==null||isNaN(v)?"":Math.max(0,Number(v));
  const checklist={};
  for(let i=0;i<checklistLen;i++){ const res=document.getElementById("acc_"+i)?.value||"—"; const cm=document.getElementById("acc_c_"+i)?.value||""; if(res!=="—"||cm)checklist[i]={result:res,comment:cm}; }
  const obj=id?DB.acRecords.find(x=>x.id===id):{id:uid(),created:Date.now(),createdBy:(SESSION&&SESSION.name)||"System"};
  Object.assign(obj,{recId:g("recId"),acType:g("acType"),unitId:g("unitId"),month:Number(g("month"))||_acMonth,year:Number(g("year"))||_acYear,
    category:g("category"),campus:g("campus").trim(),location:g("location").trim(),assetId:g("assetId").trim(),
    plannedDate:g("plannedDate"),actualDate:g("actualDate"),provider:g("provider").trim(),technician:g("technician").trim(),
    qtyPlanned:num(g("qtyPlanned")),qtyServiced:num(g("qtyServiced")),laborCost:num(g("laborCost")),materialCost:num(g("materialCost")),
    partsCost:num(g("partsCost")),otherCost:num(g("otherCost")),status:g("status"),conditionAfter:g("conditionAfter"),followup:g("followup"),
    nextDate:g("nextDate"),techSign:g("techSign").trim(),supervisor:g("supervisor").trim(),findings:g("findings").trim(),action:g("action").trim(),
    parts:g("parts").trim(),remarks:g("remarks").trim(),checklist,updated:Date.now(),updatedBy:(SESSION&&SESSION.name)||"System"});
  // sync unit last/next maintenance
  if(obj.unitId){ const u=DB.acUnits.find(x=>x.id===obj.unitId); if(u){ if(obj.actualDate)u.lastMaint=obj.actualDate; if(obj.nextDate)u.nextMaint=obj.nextDate; if(obj.conditionAfter)u.condition=obj.conditionAfter; } }
  if(!id){ DB.acRecords.push(obj); toast("Record saved","","ok"); } else toast("Record updated","","ok");
  saveDB(); closeModal(); buildNav(); renderMaintenance();
}
function deleteACRecord(id){

function saveACCorrective(id){

  const obj=id?DB.acCorrective.find(x=>x.id===id):{id:uid(),created:Date.now(),createdBy:(SESSION&&SESSION.name)||"System"};
  Object.assign(obj,{cmId:g("cmId"),reportedDate:g("reportedDate"),reportedBy:g("reportedBy").trim(),assetId:g("assetId").trim(),
    priority:g("priority"),stage:g("stage"),downtime:num(g("downtime")),technician:g("technician").trim(),repairCost:num(g("repairCost")),
    completionDate:g("completionDate"),testing:g("testing").trim(),fault:g("fault").trim(),rootCause:g("rootCause").trim(),
    repairAction:g("repairAction").trim(),parts:g("parts").trim(),updated:Date.now()});

function deleteACCorrective(id){

function acReportMonthly(){
  const recs=DB.acRecords.filter(r=>r.year===_acYear&&r.month===_acMonth);
  const rows=recs.map(r=>`<tr><td>${esc(r.recId||"")}</td><td>${esc(r.assetId||"")}</td><td>${esc(r.campus||"")}</td><td>${esc(r.category||"")}</td><td>${fmtDateUS(r.plannedDate)}</td><td>${fmtDateUS(r.actualDate)}</td><td>${esc(r.status)}</td><td class="n">$${acRecordCost(r).toFixed(2)}</td></tr>`).join("");
  acReportWindow(`AC Monthly Maintenance — ${AC_MONTHS[_acMonth-1]} ${_acYear}`,`<table><thead><tr><th>Record</th><th>Asset</th><th>Campus</th><th>Category</th><th>Planned</th><th>Actual</th><th>Status</th><th>Cost</th></tr></thead><tbody>${rows||'<tr><td colspan="8">No records</td></tr>'}</tbody></table>`);
}
function acReportOverdue(){ const recs=DB.acRecords.filter(acIsOverdue); acReportWindow("AC Pending & Overdue",`<table><thead><tr><th>Record</th><th>Asset</th><th>Campus</th><th>Planned</th><th>Status</th></tr></thead><tbody>${recs.map(r=>`<tr><td>${esc(r.recId||"")}</td><td>${esc(r.assetId||"")}</td><td>${esc(r.campus||"")}</td><td>${fmtDateUS(r.plannedDate)}</td><td>${esc(r.status)}</td></tr>`).join("")||'<tr><td colspan="5">None</td></tr>'}</tbody></table>`); }
function acReportCampus(){ const rows=acCampuses().map(cp=>{const rs=DB.acRecords.filter(r=>r.campus===cp&&r.year===_acYear);const done=rs.filter(r=>r.status==="Completed").length;const cost=rs.reduce((a,r)=>a+acRecordCost(r),0);return `<tr><td>${cp}</td><td class="n">${rs.length}</td><td class="n">${done}</td><td class="n">${rs.length?Math.round(done/rs.length*100):0}%</td><td class="n">$${cost.toFixed(2)}</td></tr>`;}).join(""); acReportWindow(`AC Maintenance by Campus — ${_acYear}`,`<table><thead><tr><th>Campus</th><th>Total</th><th>Completed</th><th>%</th><th>Cost</th></tr></thead><tbody>${rows}</tbody></table>`); }
function acReportHistory(){ const rows=DB.acRecords.slice().sort((a,b)=>(b.actualDate||"").localeCompare(a.actualDate||"")).map(r=>`<tr><td>${esc(r.assetId||"")}</td><td>${esc(r.acType||"")}</td><td>${fmtDateUS(r.actualDate||r.plannedDate)}</td><td>${esc(r.category||"")}</td><td>${esc(r.technician||"")}</td><td>${esc(r.status)}</td></tr>`).join(""); acReportWindow("AC Equipment Service History",`<table><thead><tr><th>Asset</th><th>Type</th><th>Date</th><th>Category</th><th>Technician</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No history</td></tr>'}</tbody></table>`); }
function acReportCM(){ const rows=DB.acCorrective.map(c=>`<tr><td>${esc(c.cmId||"")}</td><td>${esc(c.assetId||"")}</td><td>${esc(c.fault||"")}</td><td>${esc(c.priority||"")}</td><td>${esc(c.stage||"")}</td><td class="n">${c.downtime||""}</td><td class="n">$${(Number(c.repairCost)||0).toFixed(2)}</td></tr>`).join(""); acReportWindow("AC Corrective / Repair Report",`<table><thead><tr><th>CM ID</th><th>Asset</th><th>Fault</th><th>Priority</th><th>Stage</th><th>Downtime(h)</th><th>Cost</th></tr></thead><tbody>${rows||'<tr><td colspan="7">None</td></tr>'}</tbody></table>`); }
function acReportAnnual(){ const rows=AC_MONTHS.map((m,i)=>{const rs=DB.acRecords.filter(r=>r.year===_acYear&&r.month===i+1);const cost=rs.reduce((a,r)=>a+acRecordCost(r),0);return `<tr><td>${m}</td><td class="n">${rs.length}</td><td class="n">${rs.filter(r=>r.status==="Completed").length}</td><td class="n">$${cost.toFixed(2)}</td></tr>`;}).join(""); acReportWindow(`AC Annual Maintenance — ${_acYear}`,`<table><thead><tr><th>Month</th><th>Services</th><th>Completed</th><th>Cost</th></tr></thead><tbody>${rows}</tbody></table>`); }

}
let _conCoverData="";
function handleConstructionCover(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{ _conCoverData=e.target.result; const pv=document.getElementById("cf_coverPreview"); if(pv){ pv.style.backgroundImage=`url('${_conCoverData}')`; pv.style.backgroundSize="cover"; pv.style.backgroundPosition="center"; pv.style.width="100%"; pv.style.height="120px"; pv.style.borderRadius="8px"; pv.innerHTML=""; } };
  reader.readAsDataURL(file);
}
function saveConstruction(id){
  const g=n=>{ const el=document.getElementById("cf_"+n); return el?el.value:""; };
  const name=g("name").trim(); if(!name){ toast("Project name is required","","err"); return; }
  const num=v=>Number(v)||0;
  if(id){
    const p=conProject(id);
    Object.assign(p,{name,code:g("code").trim(),location:g("location"),type:g("type"),pm:g("pm").trim(),
      contractor:g("contractor").trim(),consultant:g("consultant").trim(),contractAmount:num(g("contractAmount")),
      approvedBudget:num(g("approvedBudget")),startDate:g("startDate"),plannedEnd:g("plannedEnd"),actualEnd:g("actualEnd"),
      progress:num(g("progress")),plannedProgress:num(g("plannedProgress")),status:g("status"),stage:g("stage"),
      priority:g("priority"),latestUpdate:g("latestUpdate").trim(),description:g("description").trim(),
      cover:_conCoverData||p.cover,updatedBy:(SESSION&&SESSION.name)||"System",updated:Date.now()});
    p.history=p.history||[]; p.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Project details updated"});
    toast("Project updated","","ok");
  } else {
    const np=newConstructionProject({name,code:g("code").trim(),location:g("location"),type:g("type"),pm:g("pm").trim(),
      contractor:g("contractor").trim(),consultant:g("consultant").trim(),contractAmount:num(g("contractAmount")),
      approvedBudget:num(g("approvedBudget")),startDate:g("startDate"),plannedEnd:g("plannedEnd"),actualEnd:g("actualEnd"),
      progress:num(g("progress")),plannedProgress:num(g("plannedProgress")),status:g("status"),stage:g("stage"),
      priority:g("priority"),latestUpdate:g("latestUpdate").trim(),description:g("description").trim(),cover:_conCoverData});
    DB.construction.unshift(np); toast("Project created","","ok");
  }
  _conCoverData=""; saveDB(); closeModal();
  if(_conProjectId) openConstructionProject(_conProjectId); else renderConstruction();
}
function deleteConstruction(id){
  if(!isSuper()){ toast("Permission denied","Only Super Admin can delete projects","err"); return; }
  const p=conProject(id);
  confirmModal("Delete project?",`"${esc(p.name)}" and all its records will be permanently removed.`,()=>{ DB.construction=DB.construction.filter(x=>x.id!==id); saveDB(); renderConstruction(); toast("Project deleted","","ok"); },"Delete");
}

/* ----- Overview tab (PM dashboard) ----- */
function conFinancials(p){
  const approvedVO=(p.variations||[]).filter(v=>/approv/i.test(v.status||"")).reduce((a,v)=>a+(Number(v.amount)||0),0);
  const pendingVO=(p.variations||[]).filter(v=>/pend/i.test(v.status||"")).reduce((a,v)=>a+(Number(v.amount)||0),0);
  const revised=(Number(p.contractAmount)||0)+approvedVO;
  const certified=(p.payments||[]).reduce((a,c)=>a+(Number(c.net)||0),0);
  const remaining=revised-certified;
  const budgetUsed=p.approvedBudget?Math.round(certified/p.approvedBudget*100):0;
  return {approvedVO,pendingVO,revised,certified,remaining,budgetUsed};
}
function conOverviewHTML(p){
  const fin=conFinancials(p);
  const sv=Number(p.progress)-Number(p.plannedProgress||0);
  const openRFI=(p.rfi||[]).filter(r=>!/clos|answer|respond/i.test(r.status||"")).length;
  const pendSub=(p.submittals||[]).filter(s=>!/approv|clos/i.test(s.status||"")).length;
  const openDef=(p.qaqc||[]).filter(q=>/fail|defect|reject/i.test(q.result||"")).length;
  const hiIssues=(p.issues||[]).filter(i=>/high|critical/i.test(i.priority||"")).length;
  const incidents=(p.safety||[]).filter(s=>/incident|accident/i.test(s.type||"")).length;
  const kpi=(v,l,col)=>`<div class="kpi"><div class="val" style="font-size:20px;color:${col||'var(--text)'}">${v}</div><div class="lbl">${l}</div></div>`;
  return `
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
    ${kpi((Number(p.progress)||0)+"%","Actual Progress","#2563eb")}
    ${kpi((Number(p.plannedProgress)||0)+"%","Planned Progress","#697586")}
    ${kpi((sv>0?"+":"")+sv+"%","Schedule Variance",sv<0?"#dc2626":"#059669")}
    ${kpi(money(p.contractAmount).replace(/\.00$/,""),"Contract Amount")}
    ${kpi(money(fin.approvedVO).replace(/\.00$/,""),"Approved Variations","#0d9488")}
    ${kpi(money(fin.revised).replace(/\.00$/,""),"Revised Contract","#2563eb")}
    ${kpi(money(fin.certified).replace(/\.00$/,""),"Certified Payments","#059669")}
    ${kpi(money(fin.remaining).replace(/\.00$/,""),"Remaining Balance",fin.remaining<0?"#dc2626":"")}
    ${kpi(fin.budgetUsed+"%","Budget Used",fin.budgetUsed>100?"#dc2626":"#2563eb")}
    ${kpi(openRFI,"Open RFIs",openRFI?"#d97706":"#059669")}
    ${kpi(pendSub,"Pending Submittals",pendSub?"#d97706":"#059669")}
    ${kpi(openDef,"Open Defects",openDef?"#dc2626":"#059669")}
    ${kpi(hiIssues,"High-Priority Issues",hiIssues?"#dc2626":"#059669")}
    ${kpi(incidents,"Safety Incidents",incidents?"#dc2626":"#059669")}
  </div>
  <div class="charts-grid" style="margin-top:18px">
    <div class="card"><div class="card-head"><h3>Planned vs Actual Progress</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="conPvAChart"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>Budget vs Certified</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="conBudgetChart"></canvas></div></div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Project Details</h3></div><div class="card-body">
    <div class="form-grid" style="gap:10px">
      ${detailRow("Project Manager",p.pm)} ${detailRow("Main Contractor",p.contractor)} ${detailRow("Consultant",p.consultant)}
      ${detailRow("Start Date",fmtDateUS(p.startDate))} ${detailRow("Planned Completion",fmtDateUS(p.plannedEnd))} ${detailRow("Actual Completion",fmtDateUS(p.actualEnd))}
      ${detailRow("Current Stage",p.stage)} ${detailRow("Latest Update",p.latestUpdate)} ${detailRow("Created By",p.createdBy)}
    </div>
    ${p.description?`<div style="margin-top:12px"><div class="muted" style="font-size:12px;margin-bottom:3px">Description</div><div>${esc(p.description)}</div></div>`:""}
  </div></div>`;
}
function detailRow(l,v){ return `<div class="field"><label>${l}</label><div style="font-weight:600">${v&&v!=="&mdash;"?esc(v):'<span class="muted">—</span>'}</div></div>`; }

function drawConstructionCharts(p,progressTab){
  if(typeof Chart==="undefined")return;
  if(!window._conCharts)window._conCharts={};
  Object.keys(window._conCharts).forEach(k=>{ try{window._conCharts[k].destroy();}catch(e){} });
  const C=chartColors();
  const pva=document.getElementById("conPvAChart");
  if(pva) window._conCharts.pva=new Chart(pva,{type:"bar",data:{labels:["Planned","Actual"],datasets:[{data:[Number(p.plannedProgress)||0,Number(p.progress)||0],backgroundColor:["#697586","#2563eb"],borderRadius:7,maxBarThickness:60}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{max:100,grid:{color:C.grid}},x:{grid:{display:false}}}}});
  const bc=document.getElementById("conBudgetChart");
  const fin=conFinancials(p);
  if(bc) window._conCharts.bud=new Chart(bc,{type:"bar",data:{labels:["Approved Budget","Revised Contract","Certified"],datasets:[{data:[Number(p.approvedBudget)||0,fin.revised,fin.certified],backgroundColor:["#697586","#7c3aed","#059669"],borderRadius:7,maxBarThickness:46}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid}},x:{grid:{display:false}}}}});
  if(progressTab){
    const mc=document.getElementById("conMonthlyChart");
    if(mc){ const months=(p.progressHistory||[]); window._conCharts.month=new Chart(mc,{type:"line",data:{labels:months.map(m=>m.month),datasets:[{label:"Actual %",data:months.map(m=>m.actual),borderColor:"#2563eb",backgroundColor:"#2563eb22",tension:.3,fill:true},{label:"Planned %",data:months.map(m=>m.planned),borderColor:"#697586",borderDash:[5,5],tension:.3}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{max:100,grid:{color:C.grid}},x:{grid:{display:false}}}}}); }
  }
}

async function saveWBS(wid){
  const p=conProject(_conProjectId);
  const g=n=>{ const el=document.getElementById("wf_"+n); return el?el.value:""; };
  const name=g("name").trim(); if(!name){ toast("Activity name is required","","err"); return; }
  const num=v=>Number(v)||0;
  const fileRefs=await persistStagedFiles(_conStagedFiles);
  const obj={code:g("code").trim(),name,responsible:g("responsible").trim(),pStart:g("pStart"),pFinish:g("pFinish"),aStart:g("aStart"),aFinish:g("aFinish"),weight:num(g("weight")),planned:num(g("planned")),actual:num(g("actual")),status:g("status"),priority:g("priority"),dependency:g("dependency").trim(),remark:g("remark").trim(),files:fileRefs};
  if(wid){ Object.assign(p.wbs.find(x=>x.id===wid),obj); toast("Activity updated","","ok"); }
  else { obj.id=uid(); p.wbs.push(obj); toast("Activity added","","ok"); }
  _conStagedFiles=[];
  recomputeConstructionProgress(p);
  saveDB(); closeModal(); paintConstructionTabBody();
}
function deleteWBS(wid){
  const p=conProject(_conProjectId);
  confirmModal("Delete activity?","",()=>{ p.wbs=p.wbs.filter(x=>x.id!==wid); recomputeConstructionProgress(p); saveDB(); paintConstructionTabBody(); toast("Deleted","","ok"); },"Delete");
}
function recomputeConstructionProgress(p){
  const tw=p.wbs.reduce((a,w)=>a+(Number(w.weight)||0),0);
  if(tw>0){
    p.progress=Math.round(p.wbs.reduce((a,w)=>a+(Number(w.weight)||0)*(Number(w.actual)||0)/100,0)/tw*100);
    p.plannedProgress=Math.round(p.wbs.reduce((a,w)=>a+(Number(w.weight)||0)*(Number(w.planned)||0)/100,0)/tw*100);
  }
}

    reader.onload=e=>{ _conStagedFiles.push({name:f.name,size:f.size,type:f.type,data:e.target.result}); renderConStagedFiles(); };
    reader.readAsDataURL(f);
  });
  input.value="";
}

function getReportData(){
  const type=document.getElementById("rp_type").value;
  const campus=document.getElementById("rp_campus").value;
  const status=document.getElementById("rp_status").value;
  const start=document.getElementById("rp_start").value;
  const end=document.getElementById("rp_end").value;
  const by=document.getElementById("rp_by").value;
  let recs = type==="all"?allRecords():DB[type].map(r=>({...r,_set:type}));
  recs=recs.filter(r=>{
    if(campus&&r.campus!==campus)return false;
    const st=isOverdue(r)?"Overdue":r.status; if(status&&st!==status)return false;
    if(start&&r.due&&r.due<start)return false;
    if(end&&r.due&&r.due>end)return false;
    return true;
  });
  return {type,campus,status,start,end,by,recs};
}

// Collect every fileId referenced anywhere in the DB (so backups can include the actual files)
function collectFileIds(){
  const ids=new Set();
  const scan=v=>{
    if(!v||typeof v!=="object")return;
    if(Array.isArray(v)){ v.forEach(scan); return; }
    if(v.fileId) ids.add(v.fileId);
    for(const k in v){ if(k==="data")continue; scan(v[k]); }
  };
  scan(DB);
  return [...ids];
}
async function buildBackupObject(){
  const ids=collectFileIds(); const files={};
  for(const id of ids){ const d=await idbGet(id); if(d) files[id]=d; }
  return Object.assign({}, DB, {__files:files, __backupVersion:2});
}
async function exportJSON(){
  toast("Preparing backup","Gathering attachments…","ok");
  try{
    const obj=await buildBackupObject();
    const blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`pmpts-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    const n=Object.keys(obj.__files||{}).length;
    toast("Backup exported", n?("JSON + "+n+" attachment(s) included"):"JSON downloaded","ok");
  }catch(e){ console.error(e); toast("Backup failed","Could not build backup","err"); }
}
function importJSON(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=e=>{ try{
    const data=JSON.parse(e.target.result);
    if(!data||typeof data!=="object"||Array.isArray(data)){ toast("Invalid backup","File is not a valid backup","err"); return; }
    confirmModal("Restore backup?","Current data will be replaced with the imported file.",async ()=>{
      const embeddedFiles=data.__files||{};
      delete data.__files; delete data.__backupVersion;
      DB=data; const d=defaultDB(); for(const k in d){ if(DB[k]===undefined||DB[k]===null)DB[k]=d[k]; }
      ["procurement","projects","maintenance","suppliers","budget"].forEach(k=>{ if(!Array.isArray(DB[k]))DB[k]=[]; });
      if(!Array.isArray(DB.users)||!DB.users.length)DB.users=d.users;
      if(!DB.users.some(u=>u.role==="superadmin"))DB.users.unshift(d.users[0]);
      // restore attachment blobs into IndexedDB
      let restored=0;
      for(const id in embeddedFiles){ try{ await idbPut(id,embeddedFiles[id]); restored++; }catch(err){} }
      saveDB(); buildNav(); navigate("dashboard");
      toast("Backup restored", restored?("Data + "+restored+" attachment(s) imported"):"Data imported successfully","ok");
    },"Restore",false);
  }catch(err){ toast("Invalid file","Could not parse JSON","err"); } };
  reader.readAsText(f); input.value="";
}

async function sendToTelegram(blob,filename,caption){
  if(!TELEGRAM_BOT_TOKEN||TELEGRAM_BOT_TOKEN.startsWith("YOUR_")||!TELEGRAM_CHAT_ID||TELEGRAM_CHAT_ID.startsWith("YOUR_")){
    toast("Telegram not configured","Set bot token & chat ID in the source","warn"); return false;
  }
  toast("Sending to Telegram...","Uploading "+filename,"ok");
  try{
    const fd=new FormData();
    fd.append("chat_id",TELEGRAM_CHAT_ID);
    if(caption) fd.append("caption",caption);
    // Ensure we send a real File so Telegram accepts the document
    const file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    fd.append("document",file,filename);
    const url=`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`;
    const res=await fetch(url,{method:"POST",body:fd});
    let j=null; try{ j=await res.json(); }catch(_){}
    console.log("Telegram sendDocument response:",res.status,j);
    if(res.ok && j && j.ok){ toast("Sent to Telegram","File delivered to the channel","ok"); return true; }
    const reason=(j&&j.description)?j.description:("HTTP "+res.status);
    toast("Telegram rejected the file",reason,"err");
    console.error("Telegram error detail:",j);
    return false;
  }catch(e){
    console.error("Telegram fetch failed:",e);
    // Most common when opened via file:// or blocked by an extension/network
    toast("Could not reach Telegram",(e.message||"Network/CORS error")+" — see console","err");
    return false;
  }
}

  try{
    const me=await (await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe`)).json();

/* ============================================================
   VIEW-ONLY (APPROVER) ENFORCEMENT
   Wrap every create/edit/delete entry point so an "viewer"/Approver
   account cannot change data. Approve/Reject (poApproveRouted /
   poRejectRouted / poDoReject) and saveDB are deliberately excluded
   so approvals still work. This is the data-safety layer that backs
   up the hidden buttons.
============================================================ */
(function installViewerGuards(){
  var guarded=[
    // procurement / generic records
    "openRecordForm","saveRecord","deleteRecord","openRecordTabForm","saveRecordTab","deleteRecordTab",
    // purchase orders (create/edit/delete + submit/recall — but NOT approve/reject)
    "openPOForm","savePO","deletePO","createPOFromRecord","poSubmitForApproval","poDoSubmit","poRecall",
    // stock
    "openStockForm","saveStock","deleteStock",
    // suppliers
    "openSupplierForm","saveSupplier","deleteSupplier",
    // budget
    "openBudgetForm","saveBudget","deleteBudget","saveConBudget",
    // construction / projects
    "openConstructionForm","saveConstruction","deleteConstruction","openWBSForm","saveWBS","deleteWBS","saveProgressEntry",
    // maintenance
    "openMaintRecordForm","saveMaintRecord","deleteMaintRecord","saveMaintPrice","saveApproval",
    // AC units / records / corrective
    "openACUnitForm","saveACUnit","deleteACUnit","openACRecordForm","saveACRecord","deleteACRecord","openACCorrectiveForm","saveACCorrective","deleteACCorrective",
    // AC task tracker
    "openACTaskForm","saveACTask","deleteACTask","acTaskSetStatus","acTaskSeedSample",
    // uniform
    "openUniformForm","saveUniform","deleteUniform","importUniformExcel",
    // procurement lists / teams
    "openProcListForm","saveProcList","deleteProcList","restoreProcList","openTeamForm","saveTeam","deleteTeam",
    // users
    "openUserForm","saveUser","deleteUser",
    // settings & signatures
    "saveSettings","saveSyncSettings","saveTelegramSettings","saveSigSettings","saveSignPad","removeSign",
    // spare parts lifecycle
    "spOpenRequestForm","spSaveRequest","spDeleteRequest","spOpenReceiveForm","spSaveReceipt","spOpenInstallForm","spSaveInstall","spCreateProcurement","spDoCreatePO","spCreatePOFromRequest","spCloseRequest","spEditProcurement","spSavePRNumber","spRequestFromCM","spRequestFromPMEM","spRequestFromUnit","spRequestFromChecklist",
    // backup restore / imports (destructive)
    "importJSON","importExcel","importMaintWorkbook"
  ];
  guarded.forEach(function(name){
    var fn=window[name];
    if(typeof fn==="function"){
      window[name]=function(){
        if(typeof isViewer==="function" && isViewer()){
          if(typeof toast==="function") toast("View-only account","This account can view and approve purchase orders, but can't add, edit, or delete.","err",5000);
          return;
        }
        return fn.apply(this, arguments);
      };
    }
  });
})();

============================================================ */
(function init(){
  function boot(){
    _bootHK=true;
    applyTheme(localStorage.getItem(THEME_KEY)||"light");
    try{ var _av=document.getElementById("appVer"); if(_av) _av.textContent=APP_VERSION;
         var _vb=document.getElementById("verBadge"); if(_vb) _vb.textContent=APP_VERSION+" · scroll✓"; }catch(e){}
    loadDB();
    // Final safety net: DB must be a valid object with array collections
    if(!DB || typeof DB!=="object"){ DB=defaultDB(); saveDB(); }
    try{ migrateACTasksToProcurement(); }catch(e){}
    // One-time correction: data was entered for May 2026 but saved under June 2026.
    // Move June 2026 -> May 2026 for both uniform datasets, only if May is empty.
    try{
      if(!localStorage.getItem("uniformJun2026Fix")){
        let moved=0;
        ["uniform","gepUniform"].forEach(col=>{
          if(!Array.isArray(DB[col]))return;
          const hasMay=DB[col].some(r=>r.period==="2026-05");
          if(!hasMay){ DB[col].forEach(r=>{ if(r.period==="2026-06"){ r.period="2026-05"; moved++; } }); }
        });
        if(moved>0) saveDB();
        localStorage.setItem("uniformJun2026Fix","1");
      }
    }catch(e){ console.warn("uniform month fix skipped",e); }
    try{ seedProcLists(); }catch(e){ console.warn("proc list seed skipped",e); }
    // Move any legacy inline attachment blobs out of localStorage into IndexedDB (frees space, fixes large-file saves)
    try{ migrateInlineFilesToIDB().catch(()=>{}); }catch(e){ console.warn("file migration skipped",e); }
    // Back-fill PO numbers onto records whose PO already exists (match by PR or Quote number)
    try{ backfillProcPONumbers(false); }catch(e){ console.warn("PO backfill skipped",e); }
    _bootHK=false;   // housekeeping done — real user edits from here on stamp revisions normally
    setTimeout(()=>{ try{
      let cfg=fbCfg();
      if(!cfg && DB.settings && DB.settings.fbConfigShare){ cfg=DB.settings.fbConfigShare; localStorage.setItem(FB_CFG_KEY, JSON.stringify(cfg)); }
      if(cfg) fbConnect(cfg,false);
    }catch(e){} }, 150);
    const sess=localStorage.getItem(SESSION_KEY);
    if(sess){ try{ SESSION=JSON.parse(sess); if(SESSION && DB.users.some(u=>u.id===SESSION.id)) enterApp(); else localStorage.removeItem(SESSION_KEY); }catch(e){ localStorage.removeItem(SESSION_KEY); } }
    document.getElementById("loginPass").addEventListener("keydown",e=>{ if(e.key==="Enter")doLogin(); });
    document.getElementById("loginUser").addEventListener("keydown",e=>{ if(e.key==="Enter")document.getElementById("loginPass").focus(); });
  }
  try{ boot(); }
  catch(err){
    // Corrupt localStorage from a previous version — wipe app keys and retry once
    console.warn("Init failed, clearing stored data and retrying:",err);
    try{ localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY); }catch(e){}
    DB=defaultDB(); SESSION=null;
    try{ boot(); }catch(e2){ console.error("Boot failed after reset:",e2); }
  }
})();
