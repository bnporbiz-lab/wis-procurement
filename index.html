<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Management &amp; Project Tracking System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f7; --border:#e3e7ee;
  --text:#1f2733; --text-dim:#697586; --primary:#5b5fef; --primary-soft:#eceefe;
  --accent:#13b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  --sidebar:#ffffff; --sidebar-text:#414b5a; --shadow:0 1px 3px rgba(20,30,55,.08),0 1px 2px rgba(20,30,55,.04);
  --shadow-lg:0 12px 32px rgba(20,30,55,.14); --radius:12px; --radius-sm:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1420; --surface:#171d2b; --surface-2:#1f2737; --border:#2a3346;
  --text:#e6eaf2; --text-dim:#94a0b4; --primary:#7c80ff; --primary-soft:#252a52;
  --accent:#22c993; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
  --sidebar:#141a27; --sidebar-text:#b4bdce; --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5b5fef 0%,#7c3aed 55%,#13b981 140%);padding:20px;z-index:1000}
.login-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:410px;padding:42px 38px;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-card h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
.login-card p.sub{color:var(--text-dim);margin-bottom:26px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn{padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{box-shadow:0 6px 18px rgba(91,95,239,.4)}
.btn-block{width:100%}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-dim);text-align:center;background:var(--surface-2);padding:10px;border-radius:8px}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:16px}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:90;transition:transform .25s}
.sidebar-head{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sidebar-head .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-head .ttl{font-weight:700;font-size:14px;line-height:1.2}
.sidebar-head .ttl span{display:block;font-size:11px;color:var(--text-dim);font-weight:500}
.sidebar-head .ttl .app-ver{display:inline-block;margin-top:5px;font-size:10px;font-weight:800;color:var(--primary);background:color-mix(in srgb, var(--primary) 12%, transparent);padding:2px 8px;border-radius:20px;cursor:pointer;letter-spacing:.3px;transition:background .15s}
.sidebar-head .ttl .app-ver:hover{background:color-mix(in srgb, var(--primary) 22%, transparent)}
.user-chip .ur{display:none}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-dim);font-weight:700;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--sidebar-text);font-weight:500;font-size:13.5px;margin-bottom:2px;transition:background .13s,color .13s;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--surface-2);color:var(--text-dim);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.nav-item.active .badge{background:var(--primary);color:#fff}
.pcc-warn{background:#d9770618;border:1px solid #d9770655;color:#b45309;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:14px}
.intake-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.intake-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:13px}
.intake-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.intake-from{font-weight:700;font-size:13px}
.intake-conf{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.intake-conf.hi{background:#05966922;color:#047857}
.intake-conf.md{background:#d9770622;color:#b45309}
.intake-conf.lo{background:#69758622;color:#697586}
.intake-cap{font-size:12px;color:var(--text-dim);margin:8px 0 0;background:var(--surface-2);border-radius:8px;padding:7px 9px}
.intake-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.intake-fields label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--text-dim)}
.intake-fields label.wide{grid-column:1/-1}
.intake-fields input{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:12.5px;color:var(--text);font-family:inherit}
.intake-fields input:focus{outline:none;border-color:var(--primary)}
.intake-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px}

/* ===== Procurement Control Center ===== */
.pcc{max-width:100%}
.pcc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pcc-title{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
.pcc-sub{margin:3px 0 0;font-size:12.5px;color:var(--text-dim)}
.pcc-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcc-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.pcc-kpi{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pcc-kpi:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pcc-kpi.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb, var(--primary) 18%, transparent)}
.pcc-kpi-val{font-size:21px;font-weight:800;line-height:1.1}
.pcc-kpi-lbl{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-weight:600}
.pcc-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.pcc-tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.pcc-tab:hover{color:var(--text)}
.pcc-tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.pcc-tab-n{background:var(--surface-2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
.pcc-tab.on .pcc-tab-n{background:color-mix(in srgb, var(--primary) 15%, transparent);color:var(--primary)}
.pcc-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pcc-inp{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);min-width:130px;font-family:inherit}
.pcc-inp:focus{outline:none;border-color:var(--primary)}
.pcc-viewtoggle{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;margin-left:auto}
.pcc-viewtoggle button{border:none;background:none;padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-dim)}
.pcc-viewtoggle button.on{background:var(--primary);color:#fff}
.pcc-quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pcc-chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer}
.pcc-chip:hover{border-color:var(--primary);color:var(--primary)}
.pcc-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pcc-chip.saved{border-style:dashed}
.pcc-tablewrap{border:1px solid var(--border);border-radius:11px;overflow:auto;background:var(--surface);max-height:66vh}
.pcc-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:900px}
.pcc-table th{position:sticky;top:0;z-index:3;background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap}
.pcc-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.pcc-table tbody tr{cursor:pointer}
.pcc-table tbody tr:hover td{background:var(--surface-2)}
.pcc-table .num{text-align:right}
.pcc-table th.frz,.pcc-table td.frz{position:sticky;background:var(--surface);z-index:2}
.pcc-table th.frz{z-index:4;background:var(--surface-2)}
.pcc-table .frz1{left:0;min-width:130px}
.pcc-table .frz2{left:130px;min-width:200px;box-shadow:1px 0 0 var(--border)}
.pcc-table tbody tr:hover td.frz{background:var(--surface-2)}
.pcc-name{font-weight:600}
.pcc-soft{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.pcc-stage{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;white-space:nowrap}
.pcc-stage i{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.pcc-dot-od{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626}
.pcc-new{display:inline-block;font-size:9px;font-weight:800;color:#047857;background:#05966922;border-radius:5px;padding:1px 6px;vertical-align:middle;letter-spacing:.4px}
.pcc-ell{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.pcc-actcol{width:1%;white-space:nowrap}
.pcc-foot{padding:10px 4px;font-size:12px;color:var(--text-dim);font-weight:600}
.pcc-cards{display:none}
/* Board */
.pcc-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.pcc-col{flex:0 0 250px;background:var(--surface-2);border-radius:11px;padding:10px;min-height:120px}
.pcc-col.over{outline:2px dashed var(--primary)}
.pcc-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.pcc-col-n{font-size:11px;font-weight:700;color:var(--text-dim)}
.pcc-col-body{display:flex;flex-direction:column;gap:8px}
.pcc-col-empty{text-align:center;color:var(--text-dim);font-size:12px;padding:10px}
.pcc-bcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer}
.pcc-bcard:hover{border-color:var(--primary)}
.pcc-bcard-id{font-size:10.5px;font-weight:700;color:var(--text-dim);letter-spacing:.3px}
.pcc-bcard-name{font-size:12.5px;font-weight:600;margin:3px 0 6px}
.pcc-bcard-foot{display:flex;justify-content:space-between;font-size:11.5px}
/* Drawer */
.pcc-drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.13);z-index:200;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.pcc-drawer.open{transform:translateX(0)}
.pcc-drawer-bd{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:199;opacity:0;pointer-events:none;transition:opacity .2s}
.pcc-drawer-bd.open{opacity:1;pointer-events:auto}
.pcc-drawer-head{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.pcc-drawer-body{flex:1;overflow-y:auto;padding:16px 18px}
.pcc-drawer-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--border)}
.pcc-sec{margin-bottom:18px}
.pcc-sec h4{margin:0 0 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim)}
.pcc-dr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.pcc-dr>span{color:var(--text-dim)}
.pcc-dr>b{text-align:right}
.pcc-mini{width:100%;border-collapse:collapse;font-size:12px}
.pcc-mini th,.pcc-mini td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left}
.pcc-mini .num{text-align:right}
.pcc-file{font-size:12.5px;padding:6px 0;cursor:pointer;color:var(--primary)}
.pcc-hist{display:flex;flex-direction:column;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border)}
@media(max-width:1100px){ .pcc-kpis{grid-template-columns:repeat(3,1fr)} }
@media(max-width:820px){
  .pcc-kpis{grid-template-columns:repeat(2,1fr)}
  .pcc-tablewrap{display:none}
  .pcc-cards{display:grid;grid-template-columns:1fr;gap:9px}
  .pcc-card{border:1px solid var(--border);border-radius:11px;background:var(--surface);padding:12px;cursor:pointer}
  .pcc-card-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
  .pcc-card-name{font-weight:700;font-size:13.5px;margin:6px 0 4px}
  .pcc-card-meta{display:flex;gap:10px;font-size:11.5px;color:var(--text-dim)}
  .pcc-card-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px}
  .pcc-card-foot .od{color:#dc2626;font-weight:600}
  .pcc-viewtoggle{margin-left:0}
}
.nav-item .badge.badge-alert{background:#dc2626;color:#fff;margin-left:6px;animation:badgePulse 2s ease-in-out infinite}
.nav-item.active .badge.badge-alert{background:#fff;color:#dc2626}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 4px rgba(220,38,38,0)}}
/* Approver (view-only) role: hide every create / edit / delete affordance in the main content area.
   Modal actions (#modalRoot) are unaffected, so Approve / Reject stay available. */
body.role-viewer #content .btn-primary,
body.role-viewer #content .act-btn[title="Edit"],
body.role-viewer #content .act-btn[title="Delete"],
body.role-viewer #content .act-btn.del,
body.role-viewer #content .act-btn[title="PDF"],
body.role-viewer #content .act-btn[title="Excel"],
body.role-viewer #content .act-btn[title="Download"],
body.role-viewer #content .act-btn[title="Submit"]{ display:none !important; }
body.role-viewer #content .row-status-sel{ pointer-events:none; opacity:.6 }
body.role-viewer #content .fb-connect{ display:inline-flex !important }  /* connecting live sync is device setup, not a data change */
body.role-viewer .viewonly-hide{ display:none !important; }
.sidebar-foot{padding:12px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user-chip .un{font-weight:600;font-size:13px}
.user-chip .ur{font-size:11px;color:var(--text-dim)}

.main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:50}
.hamburger{display:none}
.topbar h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.topbar .crumb{color:var(--text-dim);font-size:12.5px;font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#dc2626;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.notif-panel{position:absolute;top:56px;right:16px;width:340px;max-width:calc(100vw - 24px);max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);z-index:120}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.notif-group{padding:9px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text-dim)}
.notif-item{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.notif-item:hover{background:var(--surface-2)}
.notif-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:8px 12px;width:230px}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;transition:background .14s}
.icon-btn:hover{background:var(--border)}
.content{padding:24px;flex:1;overflow-x:hidden;min-width:0}

/* ---------- DASHBOARD ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.6px}
.kpi .lbl{color:var(--text-dim);font-size:12.5px;font-weight:500;margin-top:2px}
.kpi .trend{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.t-up{background:rgba(19,185,129,.13);color:var(--accent)}
.t-flat{background:var(--surface-2);color:var(--text-dim)}
.ic-blue{background:rgba(59,130,246,.13);color:var(--info)}
.ic-green{background:rgba(19,185,129,.13);color:var(--accent)}
.ic-purple{background:rgba(124,58,237,.13);color:#7c3aed}

.ic-red{background:rgba(239,68,68,.13);color:var(--danger)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between;gap:10px}
.card-head h3{font-size:15px;font-weight:700;flex:1}
.card-body{padding:18px}
.chart-wrap{position:relative;height:260px}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-stat{padding:13px;border-radius:10px;background:var(--surface-2)}

/* ---------- TABLE ---------- */
.toolbar{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.filter-sel{padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);outline:none;font-weight:500}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto;overflow-y:hidden;width:100%;-webkit-overflow-scrolling:touch}
/* ===== Horizontal scroll wrapper for the wide procurement table =====
   The wrapper shrinks to the available width (min-width:0) so the inner
   fixed-min-width table overflows INSIDE this box, producing a horizontal
   scrollbar at the bottom of the table — never breaking the page layout. */
.cu-group-body{width:100%;max-width:100%;min-width:0}
#tableHost{width:100%;max-width:100%;min-width:0}
.hscroll{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:auto;
  overflow-y:auto;
  max-height:400px;            /* ~6 rows + header; keeps horizontal scrollbar reachable */
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  box-shadow:var(--shadow);
  scrollbar-width:thin;
  scrollbar-color:var(--primary) var(--surface-2);
}
/* Keep the header row visible while scrolling the 6-row body */
.hscroll table.data.proc-table thead th{position:sticky;top:0;z-index:5;background:var(--surface-2)}
.hscroll table.data.proc-table thead th:nth-child(16),.hscroll table.data.proc-table thead th:nth-child(17){z-index:7;background:var(--surface-2)}
/* Always-visible, theme-matched horizontal scrollbar */
.hscroll::-webkit-scrollbar{height:11px;-webkit-appearance:none}
.hscroll::-webkit-scrollbar-track{background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.hscroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px;border:2px solid var(--surface-2)}
.hscroll::-webkit-scrollbar-thumb:hover{filter:brightness(1.15)}
/* The procurement table keeps a comfortable minimum width so 16 columns
   never squeeze; it grows with content but never below this. */
table.data.proc-table{min-width:1700px;width:max-content;max-width:none;margin:0;table-layout:auto}
table.data.proc-table th,table.data.proc-table td{vertical-align:middle;white-space:nowrap}
/* Per-column sizing + ellipsis for long text so columns never overlap */
table.data.proc-table th:nth-child(1),table.data.proc-table td:nth-child(1){min-width:200px;max-width:240px}   /* Name */
table.data.proc-table td:nth-child(1) b{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.data.proc-table th:nth-child(14),table.data.proc-table td:nth-child(14){max-width:150px}                /* Attachment */
table.data.proc-table th:nth-child(15),table.data.proc-table td:nth-child(15){min-width:150px;max-width:200px}/* Remarks */
table.data.proc-table td:nth-child(15) span{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.data.proc-table th:nth-child(16),table.data.proc-table td:nth-child(16){min-width:140px;width:140px;position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -6px rgba(0,0,0,.25)}
table.data.proc-table tbody tr:hover td:nth-child(16){background:var(--surface-2)}
.hscroll .att-pill{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
/* Purchase Order table: cap to ~6 rows, both-axis scroll, sticky header + action column */
.po-scroll{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--primary) var(--surface-2)}
.po-scroll::-webkit-scrollbar{height:11px;width:11px}
.po-scroll::-webkit-scrollbar-track{background:var(--surface-2)}
.po-scroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px;border:2px solid var(--surface-2)}
.po-scroll table.po-table{min-width:1000px;margin:0}
.po-scroll table.po-table thead th{position:sticky;top:0;z-index:5;background:var(--surface-2)}
.po-scroll table.po-table th:last-child,.po-scroll table.po-table td:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -6px rgba(0,0,0,.25);min-width:150px}
.po-scroll table.po-table thead th:last-child{z-index:7;background:var(--surface-2)}
.po-scroll table.po-table tbody tr:hover td:last-child{background:var(--surface-2)}
table.data{width:100%;border-collapse:collapse;min-width:1080px}
table.data th{text-align:left;padding:13px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
table.data td{padding:13px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
td.ell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ell-sm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ell b{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;white-space:nowrap}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--surface-2)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-todo{background:rgba(105,116,134,.14);color:#697586}
.s-pending{background:rgba(245,158,11,.15);color:#d97706}
.s-inprogress{background:rgba(59,130,246,.15);color:#2563eb}
.s-ordered{background:rgba(124,58,237,.15);color:#7c3aed}
.s-delivered{background:rgba(20,184,166,.15);color:#0d9488}
.s-completed{background:rgba(19,185,129,.16);color:#059669}
.s-cancelled{background:rgba(239,68,68,.15);color:#dc2626}

/* Campus colored tags */
.camp-tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap}
.camp-wukpc{background:rgba(59,130,246,.15);color:#2563eb}
.camp-btb4{background:rgba(19,185,129,.15);color:#059669}
.camp-ckdii{background:rgba(245,158,11,.16);color:#d97706}
.camp-bchreno{background:rgba(168,85,247,.15);color:#9333ea}
.camp-general{background:rgba(105,116,134,.16);color:#5b6677}
.camp-other{background:rgba(20,184,166,.15);color:#0d9488}
/* Grouped list view */
.group-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);background:var(--surface-2)}
.group-head:hover{background:var(--border)}
.group-head .chev{transition:transform .18s;display:flex}

.row-actions{display:flex;gap:5px}

.chip-cat{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--text-dim)}
/* ClickUp-style grouped list view */
.cu-group{margin-bottom:18px;max-width:100%;min-width:0}
.cu-group-head{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;user-select:none}

.campus-tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:7px;white-space:nowrap;display:inline-block}
.cp0{background:rgba(59,130,246,.15);color:#2563eb}

.cp4{background:rgba(236,72,153,.15);color:#db2777}
.cp5{background:rgba(13,148,136,.15);color:#0d9488}
.cp6{background:rgba(168,85,247,.15);color:#9333ea}
.cp7{background:rgba(234,88,12,.15);color:#ea580c}
.cp8{background:rgba(8,145,178,.15);color:#0891b2}

/* Construction Project module */
.con-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

.con-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.18);border-color:var(--primary)}

.con-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);padding-bottom:0;scrollbar-width:thin}

.nav-sublists{display:flex;flex-direction:column;margin:2px 0 6px}

/* Maintenance quarterly matrix */
.maint-matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--primary) var(--surface-2);max-width:100%}

.maint-matrix-wrap::-webkit-scrollbar-track{background:var(--surface-2)}
.maint-matrix-wrap::-webkit-scrollbar-thumb{background:var(--primary);border-radius:6px}

.maint-cell.editable{cursor:text;background:var(--primary-soft)}

.file-row .fs{font-size:11px;color:var(--text-dim)}
/* Spare Parts & Replacement module */
.sp-sec-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sp-total-box{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px}
table.sp-table th{position:sticky;top:0;background:var(--surface);z-index:1}
.sp-line .form-grid{gap:8px}
.sp-rec-banner{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:11px 13px}
.sp-alert-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.sp-alert-row:last-child{border-bottom:none}
.sp-alert-row>span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dark .sp-rec-banner{background:#3a2f12;border-color:#78621f}

/* ---------- TOAST ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:11px;box-shadow:var(--shadow-lg);padding:13px 17px;display:flex;align-items:center;gap:11px;min-width:280px;animation:slideIn .3s ease}
.toast.ok{border-left-color:var(--accent)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast .tx{font-size:13px;font-weight:600}
.toast .tx span{display:block;font-weight:500;color:var(--text-dim);font-size:12px}

/* ---------- MISC ---------- */
.page-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px}
.page-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px}
.settings-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info h4{font-size:14px;font-weight:600}
.settings-row .info p{font-size:12.5px;color:var(--text-dim)}
.switch{width:46px;height:26px;border-radius:20px;background:var(--border);position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:23px}
.radio-group{display:flex;flex-direction:column;gap:9px}
.radio-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:.13s}
.radio-opt:hover{border-color:var(--primary)}
.radio-opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.pdf-preview{background:#fff;color:#222;border-radius:8px;padding:30px;font-size:12px;box-shadow:var(--shadow);max-height:520px;overflow-y:auto}
.pdf-preview h1{font-size:18px;color:#5b5fef}
.pdf-preview table{width:100%;border-collapse:collapse;margin-top:12px}
.pdf-preview th,.pdf-preview td{border:1px solid #ddd;padding:6px 8px;text-align:left;font-size:10.5px}
.pdf-preview th{background:#f1f3f7}
.tag-list{display:flex;gap:7px;flex-wrap:wrap}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
  .sidebar-overlay.show{display:block}
}
@media(max-width:640px){
  .content{padding:15px}
  .topbar{padding:0 14px}
  .search-box{display:none}
  .topbar h2{font-size:16px}
  .form-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:11px}
  .kpi .val{font-size:20px}
  .modal-body{max-height:70vh}
  .toolbar .filter-sel{flex:1}
  #toasts{left:14px;right:14px;bottom:14px}
  .toast{min-width:auto}
}
</style>
</head>

   reference { name, size, type, fileId }; the heavy `data` lives
   in IndexedDB under that fileId.

const IDB_NAME="pmpts_files", IDB_STORE="files";
let _idb=null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(_idb) return resolve(_idb);
    if(!("indexedDB" in window)){ resolve(null); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>{ _idb=req.result; resolve(_idb); };
    req.onerror=()=>{ console.warn("IndexedDB open failed",req.error); resolve(null); };
  });
}
async function idbPut(id,dataUrl){
  const db=await idbOpen(); if(!db) throw new Error("IndexedDB unavailable");
  return new Promise((resolve,reject)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(dataUrl,id); tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error); });
}
async function idbGet(id){
  const db=await idbOpen(); if(!db) return null;
  return new Promise((resolve)=>{ const tx=db.transaction(IDB_STORE,"readonly"); const r=tx.objectStore(IDB_STORE).get(id); r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>resolve(null); });
}
async function idbDelete(id){
  const db=await idbOpen(); if(!db) return;
  return new Promise((resolve)=>{ const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).delete(id); tx.oncomplete=()=>resolve(true); tx.onerror=()=>resolve(false); });
}
function newFileId(){ return "f_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9); }

async function resolveFileData(f){ if(!f) return ""; if(f.data) return f.data; if(f.fileId){ const d=await idbGet(f.fileId); return d||""; } return ""; }
// Persist a staged file's base64 into IndexedDB, returning a light reference for storage in the record
async function persistStagedFile(f){
  if(f.fileId && !f.data) return f; // already persisted
  const data=f.data; if(!data) return {name:f.name,size:f.size,type:f.type,fileId:f.fileId||newFileId()};
  const fileId=f.fileId||newFileId();
  try{ await idbPut(fileId,data); return {name:f.name,size:f.size,type:f.type,fileId}; }
  catch(e){ console.warn("idb put failed, keeping inline",e); return f; } // fallback: keep inline so nothing is lost
}
// Convert an array of staged files (mix of inline data / refs) into stored refs (IndexedDB-backed)
async function persistStagedFiles(arr){ const out=[]; for(const f of (arr||[])){ out.push(await persistStagedFile(f)); } return out; }

// into IndexedDB, replacing them with light references. This frees up localStorage space.
// Comprehensive: deep-walks the ENTIRE DB so no dataset (AC tasks, uniforms, maintenance, etc.) is missed.
async function migrateInlineFilesToIDB(){
  if(!("indexedDB" in window)) return 0; // nothing we can do without IndexedDB
  let moved=0;
  const seen=new Set();
  async function processFilesArray(arr){
    for(let i=0;i<arr.length;i++){
      const f=arr[i];
      if(f && typeof f==="object" && f.data && !f.fileId){
        const fileId=newFileId();
        try{ await idbPut(fileId,f.data); arr[i]={name:f.name,size:f.size,type:f.type,fileId}; moved++; }
        catch(e){ /* leave inline if IndexedDB write fails */ }
      }
    }
  }
  async function walk(node){
    if(!node || typeof node!=="object" || seen.has(node)) return;
    seen.add(node);
    if(Array.isArray(node)){ for(const item of node) await walk(item); return; }
    for(const key of Object.keys(node)){
      const val=node[key];
      if(key==="files" && Array.isArray(val)){ await processFilesArray(val); }
      else if(val && typeof val==="object"){ await walk(val); }
    }
  }
  for(const key of Object.keys(DB)){
    if(key==="settings" || key==="__files") continue; // signatures stay inline (they must sync); no blobs in __files
    await walk(DB[key]);
  }
  if(moved>0){ saveDB({noRev:true,noPush:true}); console.log("Migrated "+moved+" attachment(s) from localStorage to IndexedDB"); }
  return moved;
}

  try{
    if(typeof _collectAllIds==="function"){
      const cur=_collectAllIds(DB);
      if(_lastIdSet && !opts.noTomb && !_bootHK){
        let added=false;
        _lastIdSet.forEach(id=>{ if(!cur.has(id)){ DB._deleted=DB._deleted||[]; DB._deleted.push({id:id, at:Date.now()}); added=true; } });
        if(added && DB._deleted.length>800) DB._deleted=DB._deleted.slice(-800);
      }
      _lastIdSet=cur;
    }
  }catch(_te){}
  if(!opts.noRev) DB._rev = Date.now();   // revision stamp — lets sync avoid overwriting newer local data with an older copy
  let stored=false, healed=false;
  const tryStore=()=>{ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true; }catch(e){ return e; } };
  let res=tryStore();
  if(res===true){ stored=true; }
  else {
    const e=res;
    const quota = e && (e.name==="QuotaExceededError" || e.code===22 || /quota/i.test(String(e.message||e)));
    if(quota){
      // SELF-HEAL 1: drop duplicated PO signature images (in place, no nested save) and retry.
      try{
        const prep=(DB.settings&&DB.settings.prepSig)||"", appr=(DB.settings&&DB.settings.apprSig)||"";
        (DB.po||[]).forEach(p=>{ if(!p.signatures) return; ["prepared","approved"].forEach(role=>{ const s=p.signatures[role]; if(s&&s.dataUrl){ const isA=(role==="approved"); if((isA&&s.dataUrl===appr)||(!isA&&s.dataUrl===prep)){ delete s.dataUrl; s.sigRef=isA?"appr":"prep"; healed=true; } } }); });
      }catch(_e){}
      if(tryStore()===true){ stored=true; }
      else if(typeof migrateInlineFilesToIDB==="function"){
        // SELF-HEAL 2: move inline attachment files to IndexedDB (async), then retry the write.
        try{ migrateInlineFilesToIDB().then(()=>{ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(__e){} if(typeof CURRENT!=="undefined"&&CURRENT==="backup"&&typeof renderBackup==="function") renderBackup(); }); }catch(_e){}
      }
      if(typeof toast==="function"){
        if(stored) toast("Storage compacted & saved","Your browser cache was full — I freed space and saved your change.","ok",6000);
        else toast("Saved to the cloud","This browser's cache is full, so your change went to the Google Sheet (safe) but couldn't be stored locally. Open Backup & Restore → Compact records cache.","warn",12000);
      }
      console.error("saveDB quota exceeded (healing "+(stored?"succeeded":"pending; pushed to cloud")+")");
    } else {
      if(typeof toast==="function") toast("Local save issue","Sending your change to the Google Sheet as a backup.","warn",7000);
      console.error("saveDB error:",e);
    }
  }
  // ALWAYS push to the shared Sheet — it's the durable copy and the safety net.
  // If the local write failed, push immediately (not debounced) so the record reaches the cloud right away.
  if(!opts.noPush){
    try{
      if(typeof fbActive==="function" && fbActive()){ fbQueueSync(); }   // Firebase live sync: per-record, instant
      else if(stored) schedulePush();
      else if(typeof syncPush==="function") syncPush(true);
    }catch(_e){}
  }
  return stored;
}
// Approx size (in bytes) the DB will occupy when serialized
function dbStorageBytes(){ try{ return JSON.stringify(DB).length; }catch(e){ return 0; } }
// Show the REAL browser storage picture (IndexedDB attachments + total quota), which is usually huge.
async function updateStorageMeter(){
  const host=document.getElementById("idbMeter"); if(!host) return;
  const fmt=b=> b>=1073741824 ? (b/1073741824).toFixed(2)+" GB" : (b/1048576).toFixed(1)+" MB";
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est=await navigator.storage.estimate();
      const usage=est.usage||0, quota=est.quota||0;
      const ls=dbStorageBytes();
      const other=Math.max(0, usage - ls); // mostly IndexedDB attachments
      const opct=quota?Math.min(100,Math.round(usage/quota*100)):0;
      host.innerHTML=`<div style="display:flex;justify-content:space-between"><span>Attachments &amp; files (IndexedDB): <b>${fmt(other)}</b></span><span class="muted">${fmt(usage)} of ${fmt(quota)} used</span></div>
        <div style="height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:6px"><div style="height:100%;width:${opct}%;background:#2563eb"></div></div>
        <div class="muted" style="font-size:11.5px;margin-top:5px">Your browser gives this app about <b>${fmt(quota)}</b> in total, and you're only using <b>${opct}%</b> of it — there's plenty of room for attachments.</div>`;
    } else {
      host.textContent="Attachments are stored in IndexedDB, which has a large capacity. (Your browser doesn't expose a storage estimate.)";
    }
  }catch(e){ host.textContent="Attachments are stored separately in IndexedDB (large capacity)."; }
}
async function compactStorage(){
  try{
    const before=dbStorageBytes();
    let moved=0;
    if(typeof migrateInlineFilesToIDB==="function") moved=await migrateInlineFilesToIDB()||0;
    const dd=(typeof dedupePOSignatures==="function")?dedupePOSignatures():{changed:0};
    const after=dbStorageBytes();
    const freed=Math.max(0,before-after);
    const bits=[];
    if(moved>0) bits.push("moved "+moved+" file"+(moved!==1?"s":""));
    if(dd.changed>0) bits.push("de-duplicated "+dd.changed+" signature"+(dd.changed!==1?"s":""));
    if(bits.length) toast("Records cache compacted", bits.join(" · ")+" · freed "+(freed/1048576).toFixed(2)+" MB","ok",8000);
    else toast("Nothing left to compact","The remaining space is genuine record data — safely backed up in your Google Sheet.","ok",8000);
    if(typeof renderBackup==="function") renderBackup();
  }catch(e){ toast("Compact failed","Please try again","err"); }
}
// Show which datasets are using the records cache, so it's clear where the space goes.
function storageBreakdown(){
  const rows=[];
  Object.keys(DB).forEach(k=>{
    if(k==="_rev") return;
    let bytes=0; try{ bytes=JSON.stringify(DB[k]||"").length; }catch(e){ bytes=0; }
    const count=Array.isArray(DB[k])?DB[k].length:null;
    if(bytes>1024) rows.push({key:k,bytes,count});
  });
  return rows.sort((a,b)=>b.bytes-a.bytes).slice(0,8);
}
let _pushTimer=null;
function schedulePush(){
  if(typeof syncConfigured!=="function"||!syncConfigured())return;
  if(_pushTimer)clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ syncPush(true); }, 1500); // debounce rapid saves
}

/* ============================================================
   Google Apps Script + Sheets sync (shared data store)
   - Pushes the whole DB (minus attachment blobs) to a Google Sheet
     via an Apps Script Web App URL.
   - Pulls the shared DB on an interval + on demand.
   - Attachments stay local in IndexedDB (never sent).
============================================================ */
let _syncState={status:"off", last:0, busy:false, timer:null, pulledOnce:false};
function syncCfg(){ DB.settings=DB.settings||{}; return {url:(DB.settings.gsUrl||"").trim(), key:(DB.settings.gsKey||"").trim(), auto:DB.settings.gsAuto!==false, interval:Number(DB.settings.gsInterval)||30}; }
function syncConfigured(){ return !!syncCfg().url; }
// Strip attachment blobs before sending (files stay local); keep light refs only
function dbForSync(){
  const clone=JSON.parse(JSON.stringify(DB));
  const strip=arr=>{ (arr||[]).forEach(r=>{ if(Array.isArray(r.files)) r.files=r.files.map(f=>({name:f.name,size:f.size,type:f.type,fileId:f.fileId||undefined})); }); };
  ["procurement","suppliers","po","stock"].forEach(s=>strip(clone[s]));
  (clone.construction||[]).forEach(p=>{ if(Array.isArray(p.files))p.files=p.files.map(f=>({name:f.name,size:f.size,type:f.type,fileId:f.fileId})); Object.keys(p).forEach(k=>{ if(Array.isArray(p[k]))p[k].forEach(rec=>{ if(rec&&Array.isArray(rec.files))rec.files=rec.files.map(f=>({name:f.name,size:f.size,type:f.type,fileId:f.fileId})); }); }); });
  // don't sync secrets
  if(clone.settings){ delete clone.settings.tgToken; delete clone.settings.gsUrl; delete clone.settings.gsKey; }
  return clone;
}
/* ============================================================
   RECORD-LEVEL MERGE ENGINE
   The old sync chose one whole side and discarded the other —
   so an edit on a slightly-behind browser could legitimately
   wipe newer records everywhere. Now the two copies are MERGED:
   every record on either side survives; where both have the same
   record, the newer edit wins. Deletions travel as tombstones so
   a record deleted on one device stays deleted (and can't come
   back from another device's old copy).
============================================================ */
const MERGE_LISTS=["procurement","projects","maintenance","suppliers","budget","po","stock","uniform","gepUniform","construction","procurementLists","maintQuarters","maintCampuses","acUnits","acRecords","acCorrective","acSpareRequests","acSpareReceipts","acReplacementRecords","acSpareAuditLogs","acTasks","prIntake","users"];
function _recStamp(r){ return Number(r&&(r.updated||r.receivedAt||r.created))||0; }
function dbFingerprint(db){
  return MERGE_LISTS.map(k=>{ const a=Array.isArray(db&&db[k])?db[k]:[]; let m=0; a.forEach(r=>{ const s=_recStamp(r); if(s>m)m=s; }); return a.length+":"+m; }).join("|")
       + "~d" + ((db&&db._deleted)||[]).length;
}
function mergeDBs(localDB, remoteDB){
  const lRev=Number(localDB&&localDB._rev)||0, rRev=Number(remoteDB&&remoteDB._rev)||0;
  const newer = rRev>=lRev ? remoteDB : localDB;
  const older = newer===remoteDB ? localDB : remoteDB;
  const out=JSON.parse(JSON.stringify(newer));   // baseline: settings/scalars from the newer side
  // shallow-merge keyed objects so neither side's entries are lost
  out.maintPrices=Object.assign({}, (older&&older.maintPrices)||{}, (newer&&newer.maintPrices)||{});
  out.poItemCatalog=Object.assign({}, (older&&older.poItemCatalog)||{}, (newer&&newer.poItemCatalog)||{});
  // tombstones from both sides (newest deletion time per id)
  const tombs={};
  [localDB,remoteDB].forEach(db=> (((db&&db._deleted)||[])).forEach(d=>{ if(d&&d.id!=null){ const at=Number(d.at)||0; if(!tombs[d.id]||tombs[d.id]<at) tombs[d.id]=at; } }));
  MERGE_LISTS.forEach(k=>{
    const oldArr=Array.isArray(older&&older[k])?older[k]:[];
    const newArr=Array.isArray(newer&&newer[k])?newer[k]:[];
    const map=new Map();
    oldArr.forEach(r=>{ if(r&&r.id!=null&&!map.has(r.id)) map.set(r.id,r); else if(r&&r.uid!=null&&!map.has("u:"+r.uid)) map.set("u:"+r.uid,r); });
    newArr.forEach(r=>{ if(!r) return; const key=(r.id!=null)?r.id:((r.uid!=null)?("u:"+r.uid):null); if(key==null) return;
      const ex=map.get(key); if(!ex || _recStamp(r)>=_recStamp(ex)) map.set(key,r); });
    // rows without any id can't be matched — keep the newer side's copies as-is
    const noId=newArr.filter(r=>r && r.id==null && r.uid==null);
    out[k]=[...map.values()].filter(r=>{ const key=(r.id!=null)?r.id:r.uid; const tAt=tombs[key]; return !(tAt && tAt>=_recStamp(r)); }).concat(noId);
  });
  // keep tombstones for 90 days so late-syncing devices still honour them
  const cut=Date.now()-90*86400000;
  out._deleted=Object.keys(tombs).map(id=>({id:id, at:tombs[id]})).filter(d=>d.at>cut);
  out._rev=Math.max(lRev,rRev);
  return out;
}
/* ---- automatic deletion tombstones: any record removed by any delete flow gets one on the next save ---- */
let _lastIdSet=null;
function _collectAllIds(db){ const s=new Set(); MERGE_LISTS.forEach(k=>{ (Array.isArray(db&&db[k])?db[k]:[]).forEach(r=>{ if(r&&r.id!=null) s.add(String(r.id)); else if(r&&r.uid!=null) s.add(String(r.uid)); }); }); return s; }
function _resetIdBaseline(){ try{ _lastIdSet=_collectAllIds(DB); }catch(e){ _lastIdSet=null; } }

/* ============================================================
   FIREBASE LIVE SYNC  (optional upgrade over the Sheet sync)
   - Per-record documents in Firestore; changes stream to every
     device within about a second (no polling, no whole-DB pushes).
   - Works offline: Firestore queues writes and reconciles.
   - When connected, the Google Sheet sync is paused for records;
     the Sheet/Apps Script continues to serve PR Intake + backups.
============================================================ */
const FB_CFG_KEY="pmpts_fb_cfg";
let _fb={app:null, db:null, ready:false, listeners:[], applying:false, writeTimer:null, shadow:null, status:"off", statusMsg:""};
let _fbRenderTimer=null;

function fbCfg(){ try{ return JSON.parse(localStorage.getItem(FB_CFG_KEY)||"null"); }catch(e){ return null; } }
function fbActive(){ return !!_fb.ready; }
function fbStatusHTML(){
  const m={off:'<span class="muted">Not connected.</span>',
    connecting:'<span style="color:#d97706;font-weight:600">Connecting…</span>',
    live:'<span style="color:#059669;font-weight:700">● Live</span> <span class="muted">— changes appear on every device within a second.</span>',
    error:'<span style="color:#dc2626;font-weight:600">Error:</span> <span class="muted">'+esc(_fb.statusMsg)+'</span>'};
  return m[_fb.status]||m.off;
}
function fbSetStatus(s,msg){
  _fb.status=s; _fb.statusMsg=msg||"";
  try{
    if(s==="live") setSyncBadge("live","Live · Firebase ⚡");
    else if(s==="error") setSyncBadge("error", msg||"Firebase error");
    else if(s==="connecting") setSyncBadge("syncing","Connecting Firebase…");
  }catch(e){}
  const el=document.getElementById("fbStatusLine"); if(el) el.innerHTML=fbStatusHTML();
}

function fbLoadSDK(){
  if(typeof firebase!=="undefined" && firebase.firestore) return Promise.resolve(true);
  const V="10.14.1";
  const urls=["https://www.gstatic.com/firebasejs/"+V+"/firebase-app-compat.js",
              "https://www.gstatic.com/firebasejs/"+V+"/firebase-auth-compat.js",
              "https://www.gstatic.com/firebasejs/"+V+"/firebase-firestore-compat.js"];
  return urls.reduce((p,u)=>p.then(()=>new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=u; sc.onload=()=>res(); sc.onerror=()=>rej(new Error("Could not load "+u)); document.head.appendChild(sc); })), Promise.resolve()).then(()=>true);
}

async function fbConnect(cfg, interactive){
  try{
    fbSetStatus("connecting");
    await fbLoadSDK();
    // Always initialize a FRESH named app instance — reusing a previous (possibly misconfigured)
    // initialization is what made retries fail with the old config's error even after a correct paste.
    _fb.app=firebase.initializeApp(cfg, "wis_"+Date.now());
    try{ await _fb.app.auth().signInAnonymously(); }
    catch(e){
      const code=String((e&&e.code)||(e&&e.message)||"unknown");
      const why=
        /admin-restricted/.test(code) ? "Anonymous sign-in is NOT enabled in THIS project — check you enabled it in the same project as this config (projectId: "+esc(cfg&&cfg.projectId||"?")+")." :
        /configuration-not-found/.test(code) ? "Authentication was never started in this project — open Authentication in the console and click Get started, then enable Anonymous." :
        /network-request-failed/.test(code) ? "The internet connection or a firewall blocked Firebase — check the connection and try again." :
        /api-key/.test(code) ? "The pasted config's apiKey looks wrong — re-copy the whole firebaseConfig from Project settings → Your apps." :
        "Check that Anonymous sign-in is enabled in the SAME project as this config.";
      fbSetStatus("error","Sign-in failed ("+code+")");
      if(interactive) toast("Firebase sign-in failed: "+code, why,"err",14000);
      return false;
    }
    _fb.db=_fb.app.firestore();
    try{ await _fb.db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* multiple tabs or unsupported — still fine online */ }
    fbBuildShadow();
    fbStartListeners();
    _fb.ready=true;
    fbSetStatus("live");
    if(interactive) toast("Firebase connected","Live sync is ON — changes now flow to every device instantly.","ok",7000);
    return true;
  }catch(e){
    fbSetStatus("error", String((e&&e.message)||e));
    if(interactive) toast("Firebase connect failed", String((e&&e.message)||e),"err",9000);
    return false;
  }
}

/* strip inline file data (attachments stay in each device's IndexedDB; only light refs travel) */
function fbStripFiles(r){
  const c=JSON.parse(JSON.stringify(r));
  (function walk(n){ if(!n||typeof n!=="object")return;
    if(Array.isArray(n)){ n.forEach(walk); return; }
    Object.keys(n).forEach(k=>{ if(k==="files"&&Array.isArray(n[k])) n[k]=n[k].map(f=>({name:(f&&f.name)||null,size:(f&&f.size)||0,type:(f&&f.type)||null,fileId:(f&&f.fileId)||null})); else walk(n[k]); });
  })(c);
  return c;
}
function fbMetaSettings(){ const s=Object.assign({},DB.settings||{}); delete s.tgToken; delete s.gsUrl; delete s.gsKey; return s; }

function fbBuildShadow(){
  const s={__meta:{}};
  MERGE_LISTS.forEach(k=>{ s[k]={}; (Array.isArray(DB[k])?DB[k]:[]).forEach(r=>{ const id=r&&(r.id!=null?r.id:r.uid); if(id!=null) s[k][String(id)]=JSON.stringify(fbStripFiles(r)); }); });
  s.__meta.settings=JSON.stringify(fbMetaSettings());
  s.__meta.maintPrices=JSON.stringify(DB.maintPrices||{});
  s.__meta.poItemCatalog=JSON.stringify(DB.poItemCatalog||{});
  _fb.shadow=s;
}

/* diff local DB vs shadow, write only what changed */
function fbQueueSync(){ if(!_fb.ready) return; clearTimeout(_fb.writeTimer); _fb.writeTimer=setTimeout(()=>{ fbFlush(); }, 400); }
async function fbFlush(){
  if(!_fb.ready || _fb.applying || !_fb.shadow) return 0;
  const ops=[];
  MERGE_LISTS.forEach(k=>{
    const cur={}; (Array.isArray(DB[k])?DB[k]:[]).forEach(r=>{ const id=r&&(r.id!=null?r.id:r.uid); if(id!=null) cur[String(id)]=r; });
    const sh=_fb.shadow[k]=_fb.shadow[k]||{};
    Object.keys(cur).forEach(id=>{ const j=JSON.stringify(fbStripFiles(cur[id])); if(sh[id]!==j){ ops.push({t:"set",c:k,id:id,d:JSON.parse(j)}); sh[id]=j; } });
    Object.keys(sh).forEach(id=>{ if(!(id in cur)){ ops.push({t:"del",c:k,id:id}); delete sh[id]; } });
  });
  [["settings",fbMetaSettings()],["maintPrices",DB.maintPrices||{}],["poItemCatalog",DB.poItemCatalog||{}]].forEach(pair=>{
    const j=JSON.stringify(pair[1]);
    if(_fb.shadow.__meta[pair[0]]!==j){ ops.push({t:"set",c:"meta",id:pair[0],d:JSON.parse(j)}); _fb.shadow.__meta[pair[0]]=j; }
  });
  if(!ops.length) return 0;
  try{
    for(let i=0;i<ops.length;i+=400){
      const b=_fb.db.batch();
      ops.slice(i,i+400).forEach(o=>{ const ref=_fb.db.collection(o.c).doc(o.id); if(o.t==="set") b.set(ref,o.d); else b.delete(ref); });
      await b.commit();
    }
    fbSetStatus("live");
    return ops.length;
  }catch(e){ fbSetStatus("error","Write failed: "+String((e&&e.message)||e)); return -1; }
}

/* live listeners: remote changes land in DB and the screen refreshes */
function fbStopListeners(){ _fb.listeners.forEach(u=>{ try{u();}catch(e){} }); _fb.listeners=[]; }
function fbStartListeners(){
  fbStopListeners();
  const keyOf=r=>String(r&&(r.id!=null?r.id:r.uid));
  MERGE_LISTS.forEach(k=>{
    const un=_fb.db.collection(k).onSnapshot(snap=>{
      if(!snap) return;
      let changed=false;
      _fb.applying=true;
      try{
        const arr=DB[k]=Array.isArray(DB[k])?DB[k]:[];
        snap.docChanges().forEach(ch=>{
          const id=String(ch.doc.id);
          const idx=arr.findIndex(r=>keyOf(r)===id);
          if(ch.type==="removed"){
            if(idx>=0){ arr.splice(idx,1); changed=true; }
            if(_fb.shadow&&_fb.shadow[k]) delete _fb.shadow[k][id];
          } else {
            const data=ch.doc.data()||{};
            const j=JSON.stringify(data);
            if(idx>=0){
              if(JSON.stringify(fbStripFiles(arr[idx]))!==j){
                const localFiles=arr[idx]&&arr[idx].files;
                const nd=JSON.parse(j);
                // keep this device's inline copies when the file list itself didn't change
                if(Array.isArray(localFiles)&&JSON.stringify((nd.files||[]).map(f=>f&&f.fileId))===JSON.stringify(localFiles.map(f=>f&&f.fileId))) nd.files=localFiles;
                arr[idx]=nd; changed=true;
              }
            } else { arr.push(JSON.parse(j)); changed=true; }
            if(_fb.shadow){ _fb.shadow[k]=_fb.shadow[k]||{}; _fb.shadow[k][id]=j; }
          }
        });
      } finally { _fb.applying=false; }
      if(changed) fbAfterRemote();
    }, err=>{ fbSetStatus("error","Listen failed: "+String((err&&err.message)||err)); });
    _fb.listeners.push(un);
  });
  const un2=_fb.db.collection("meta").onSnapshot(snap=>{
    if(!snap) return;
    let changed=false;
    _fb.applying=true;
    try{
      snap.docChanges().forEach(ch=>{
        if(ch.type==="removed") return;
        const id=ch.doc.id, d=ch.doc.data()||{}, j=JSON.stringify(d);
        if(id==="settings"){ if(_fb.shadow.__meta.settings!==j){ const keep=DB.settings||{}; DB.settings=Object.assign({}, d, {tgToken:keep.tgToken, gsUrl:keep.gsUrl, gsKey:keep.gsKey}); _fb.shadow.__meta.settings=JSON.stringify(fbMetaSettings()); changed=true; } }
        else if(id==="maintPrices"){ if(_fb.shadow.__meta.maintPrices!==j){ DB.maintPrices=d; _fb.shadow.__meta.maintPrices=j; changed=true; } }
        else if(id==="poItemCatalog"){ if(_fb.shadow.__meta.poItemCatalog!==j){ DB.poItemCatalog=d; _fb.shadow.__meta.poItemCatalog=j; changed=true; } }
      });
    } finally { _fb.applying=false; }
    if(changed) fbAfterRemote();
  }, err=>{});
  _fb.listeners.push(un2);
}
function fbAfterRemote(){
  try{ saveDB({noRev:true,noPush:true,noTomb:true}); }catch(e){}
  try{ if(typeof _resetIdBaseline==="function") _resetIdBaseline(); }catch(e){}
  clearTimeout(_fbRenderTimer);
  _fbRenderTimer=setTimeout(()=>{
    try{
      const modalOpen=!!((document.getElementById("modalRoot")||{}).innerHTML||"").trim();
      buildNav();
      if(!modalOpen && CURRENT) navigate(CURRENT);   // don't yank a form out from under the user
    }catch(e){}
  },500);
}

/* ---- Settings actions ---- */
function fbSaveConnect(){
  const ta=document.getElementById("fbCfgTa"); if(!ta) return;
  let cfg=null;
  let raw=ta.value.trim();
  // accept either pure JSON or the copied "const firebaseConfig = {...};" snippet
  const m=raw.match(/\{[\s\S]*\}/); if(m) raw=m[0];
  try{ cfg=JSON.parse(raw.replace(/([,{]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g,'$1"$2":').replace(/,\s*}/g,"}")); }catch(e){ toast("Config not understood","Paste the firebaseConfig from your Firebase project settings","err",7000); return; }
  if(!cfg || !cfg.apiKey || !cfg.projectId){ toast("Config incomplete","It must include apiKey and projectId","err"); return; }

function fbDisconnect(){
  fbStopListeners(); _fb.ready=false;

  try{ setSyncBadge(syncConfigured()?"live":"off"); }catch(e){}

}
async function fbMigrateAll(){
  if(!_fb.ready){ toast("Connect Firebase first","","err"); return; }
  toast("Uploading everything…","This runs once and may take a minute.","ok",5000);
  fbBuildShadow();
  _fb.shadow={__meta:{}};

  if(n>=0) toast("Upload complete", (n||0)+" item(s) are now in Firebase — every device connecting will receive them live.","ok",8000);

// JSONP helper — bypasses CORS entirely by loading the response via a <script> tag
function jsonpRequest(baseUrl, params, timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb="__gsync_cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    let done=false;
    const cleanup=()=>{ try{delete window[cb];}catch(_){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); };
    const timer=setTimeout(()=>{ if(done)return; done=true; cleanup(); reject(new Error("timeout")); }, timeoutMs||20000);
    window[cb]=(data)=>{ if(done)return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    const qs=Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    s.src=baseUrl+(baseUrl.indexOf("?")<0?"?":"&")+qs+"&callback="+cb+"&t="+Date.now();
    s.onerror=()=>{ if(done)return; done=true; clearTimeout(timer); cleanup(); reject(new Error("network")); };
    document.body.appendChild(s);
  });
}
// Push via a hidden iframe form POST — no CORS, handles large payloads. Confirms with a follow-up pull.
function iframePost(url, fields){
  return new Promise((resolve)=>{
    const name="gsync_if_"+Date.now();
    const ifr=document.createElement("iframe"); ifr.name=name; ifr.style.display="none";
    document.body.appendChild(ifr);
    const form=document.createElement("form");
    form.method="POST"; form.action=url; form.target=name; form.style.display="none";
    form.acceptCharset="utf-8";
    Object.keys(fields).forEach(k=>{ const ta=document.createElement("textarea"); ta.name=k; ta.value=fields[k]; form.appendChild(ta); });
    document.body.appendChild(form);
    let settled=false;
    const cleanup=()=>{ setTimeout(()=>{ if(form.parentNode)form.remove(); if(ifr.parentNode)ifr.remove(); },1500); };
    const finish=(loaded)=>{ if(settled)return; settled=true;
      if(loaded){ cleanup(); }
      else { setTimeout(cleanup, 120000); }   // slow link: KEEP the upload alive in the background — never abort it
      resolve(!!loaded);
    };
    ifr.onload=()=>finish(true);
    form.submit();
    setTimeout(()=>finish(false), 30000);     // report back after 30s, but the transfer continues regardless
  });
}

async function syncPush(silent){
  const cfg=syncCfg(); if(!cfg.url){ if(!silent)toast("Sync not set up","Add your Apps Script URL in Settings","err"); return false; }
  if(_syncState.busy) return false;
  // FIRST-PUSH GUARD: before this browser's first upload of the session, fetch the Sheet once.
  // A browser opened after days away must reconcile with the shared copy before it may overwrite it.
  if(!_syncState.pulledOnce){
    try{ await syncPull(true); }catch(e){}
    if(_syncState.busy) return false;   // pull still in flight — the debounced push will retry
  }
  // SAFETY GUARD: never let an empty local DB overwrite a populated Sheet.
  // If this browser has 0 records, first check what's on the Sheet; if the Sheet has data, block the push.
  if(localRecordCount()===0){
    try{
      const chk=await jsonpRequest(cfg.url,{action:"load", key:cfg.key},15000);
      const remoteHas = chk && chk.ok && chk.data && (
        (Array.isArray(chk.data.procurement)&&chk.data.procurement.length) ||
        (Array.isArray(chk.data.po)&&chk.data.po.length) ||
        (Array.isArray(chk.data.suppliers)&&chk.data.suppliers.length) ||
        (Array.isArray(chk.data.stock)&&chk.data.stock.length) ||
        (Array.isArray(chk.data.construction)&&chk.data.construction.length)
      );
      if(remoteHas){
        setSyncBadge(_syncState.last?"live":"off");
        if(!silent) toast("Push blocked — Sheet has data","This browser is empty (0 records) but the Sheet is not. Click ⬇ Pull latest now to load it. (Pushing would erase everyone's data.)","err",10000);
        return false;
      }
    }catch(_){ /* if the check itself fails, fall through — the deploy/URL is likely wrong and the push will surface that */ }
  }
  _syncState.busy=true; setSyncBadge("syncing","Saving to Sheet…");
  try{
    const pushedRev=Number(DB._rev)||0;
    const dataStr=JSON.stringify(dbForSync());
    await iframePost(cfg.url, {action:"save", key:cfg.key, ts:String(Date.now()), data:dataStr});
    _syncState.busy=false;
    // VERIFY DELIVERY (patiently): large uploads on slow connections can take a while, so we
    // check several times over ~10s, re-send once if truly stale, and only then declare failure.
    let delivered=false, sawServer=false, reposted=false;
    for(let attempt=0; attempt<4 && !delivered; attempt++){
      if(attempt>0) await new Promise(r=>setTimeout(r,2500));
      try{
        const chk=await jsonpRequest(cfg.url,{action:"load", key:cfg.key},15000);
        if(chk && chk.ok===false){
          setSyncBadge("error","Key rejected"); if(!silent) toast("Check secret key","The script rejected the key — data was NOT saved.","err",9000);
          return false;
        }
        if(!(chk && chk.ok)) continue;
        sawServer=true;
        const rr=Number(chk.data && chk.data._rev)||0;
        if(!pushedRev || rr>=pushedRev){ delivered=true; break; }
        if(!reposted && attempt>=1){ await iframePost(cfg.url,{action:"save", key:cfg.key, ts:String(Date.now()), data:dataStr}); reposted=true; }
      }catch(e){ /* network hiccup on this attempt — loop tries again */ }
    }
    if(!sawServer) delivered=true;   // could not verify at all (offline blip) ≠ failed — next cycle re-checks
    if(delivered){
      _syncState.last=Date.now(); setSyncBadge("live");
      if(!silent) toast("Synced to Google Sheet","Delivery confirmed","ok");
      return true;
    }
    setSyncBadge("error","Push not confirmed");
    toast("Push may not have reached the Sheet","Your changes are safe on this device. Open Backup & Restore → Sync Status to retry.","warn",10000);
    return false;
  }catch(e){ _syncState.busy=false; setSyncBadge("error"); if(!silent)toast("Sync failed","Could not reach Google. Check the URL ends in /exec and access is ‘Anyone’.","err",8000); console.warn("syncPush error",e); return false; }
}
async function syncPull(silent){
  if(typeof fbActive==="function" && fbActive()){
    if(typeof fetchPRIntake==="function") fetchPRIntake(true);   // intake still rides the Apps Script
    if(!silent) toast("Firebase live sync is active","Records no longer use the Google Sheet.","ok");
    return true;
  }
  const cfg=syncCfg(); if(!cfg.url){ if(!silent)toast("Sync not set up","","err"); return false; }
  if(_syncState.busy) return false; _syncState.busy=true; setSyncBadge("syncing","Loading from Sheet…");
  try{
    const j=await jsonpRequest(cfg.url,{action:"load", key:cfg.key},25000);
    _syncState.busy=false;
    if(j&&j.ok&&j.data){
      const incoming=j.data;
      const localRev = Number(DB && DB._rev) || 0;
      const remoteRev = Number(incoming && incoming._rev) || 0;
      // Same revision on both sides = same data version: nothing to reconcile.
      if(remoteRev===localRev && !(localRev===0&&remoteRev===0)){
        _syncState.busy=false; _syncState.last=Date.now(); _syncState.pulledOnce=true; setSyncBadge("live");
        if(!silent) toast("Already up to date","","ok");
        if(typeof fetchPRIntake==="function") fetchPRIntake(true);
        return true;
      }
      // MERGE: combine both copies record-by-record. Every record on either side survives;
      // where both have the same record, the newer edit wins; deletions are honoured via tombstones.
      const merged=mergeDBs(DB, incoming);
      const keepSettings=DB.settings||{};
      DB=merged;
      DB.settings=Object.assign({}, merged.settings||{}, {tgToken:keepSettings.tgToken, gsUrl:keepSettings.gsUrl, gsKey:keepSettings.gsKey, gsAuto:keepSettings.gsAuto, gsInterval:keepSettings.gsInterval, prepSig:keepSettings.prepSig||(merged.settings||{}).prepSig, apprSig:keepSettings.apprSig||(merged.settings||{}).apprSig});
      loadDBGuards(); if(typeof _resetIdBaseline==="function") _resetIdBaseline();
      const localContributed = dbFingerprint(merged)!==dbFingerprint(incoming);
      if(localContributed){
        // this browser had records/edits the Sheet lacked — stamp fresh & upload the combined copy
        saveDB({noTomb:true});
        if(!silent) toast("Merged with the Sheet","Combined both copies — nothing was lost.","ok",6000);
      } else {
        saveDB({noRev:true, noPush:true, noTomb:true});
        if(!silent) toast("Loaded latest from Google Sheet","","ok");
      }
      _syncState.last=Date.now(); _syncState.pulledOnce=true; setSyncBadge("live");
      if(!silent){ buildNav(); navigate(CURRENT||"dashboard"); }
      else if(typeof buildNav==="function"){ buildNav(); if(CURRENT) navigate(CURRENT); }
      if(typeof fetchPRIntake==="function") fetchPRIntake(true);
      return true;
    }
    if(j&&j.ok&&!j.data){ _syncState.pulledOnce=true; setSyncBadge("live","Live · empty Sheet"); if(!silent)toast("Sheet is empty","Push your data first with Push to Sheet","warn"); return true; }
    if(j&&!j.ok){ setSyncBadge("error","Key rejected"); if(!silent)toast("Load failed",(j.error||"Secret key doesn't match"),"err",8000); return false; }
    setSyncBadge("error"); if(!silent)toast("Load failed","Unexpected response from script","err",8000); return false;
  }catch(e){ _syncState.busy=false; if(silent){ /* transient auto-pull failure: restore prior state, retry next tick */ setSyncBadge(_syncState.last?"live":"off"); } else { setSyncBadge("error"); toast("Load failed","Could not reach Google, or the deployed script is the OLD code. Re-paste the new code, Deploy → New version, and set access to ‘Anyone’.","err",9000); } console.warn("syncPull error",e); return false; }
}

function doLogin(){

  const p=document.getElementById("loginPass").value;
  const err=document.getElementById("loginErr");
  if(!DB || !Array.isArray(DB.users) || !DB.users.length) loadDB();
  const found=DB.users.find(x=>x.id.toLowerCase()===u.toLowerCase() && x.password===p);
  if(!found){ err.textContent="Invalid user ID or password. Please try again."; return; }
  err.textContent="";
  SESSION={id:found.id, name:found.name, role:found.role};
  localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
  enterApp();
}

function money(n){ n=Number(n)||0; return (DB.settings.currency||"USD")+" "+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function shortMoney(n){ n=Number(n)||0; if(n>=1e6)return (n/1e6).toFixed(1)+"M"; if(n>=1e3)return (n/1e3).toFixed(1)+"K"; return n.toFixed(0); }
function statusClass(s){ return "s-"+s.toLowerCase().replace(/[^a-z]/g,""); }
function campusTagClass(c){ if(!c)return "ct-other"; let h=0; const s=String(c); for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return "cp"+(h%12); }
function fmtDateUS(d){ if(!d)return "&mdash;"; const x=new Date(d); if(isNaN(x))return "&mdash;"; const mm=String(x.getMonth()+1).padStart(2,"0"),dd=String(x.getDate()).padStart(2,"0"),yy=String(x.getFullYear()%100).padStart(2,"0"); return `${mm}/${dd}/${yy}`; }
function fmtDate(d){ if(!d)return "&mdash;"; const x=new Date(d); return isNaN(x)?"&mdash;":x.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Escape text, then turn any web link inside it into a clickable link (opens in a new tab)
function linkifyEsc(s){ return esc(s).replace(/(https?:\/\/[^\s&<>"']+[^\s&<>"'.,)])/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--primary);word-break:break-all">$1</a>'); }
function isOverdue(r){ if(!r.due||["Completed","Cancelled","Delivered"].includes(r.status))return false; return new Date(r.due) < new Date(new Date().toDateString()); }
function allRecords(){ return [...DB.procurement.map(r=>({...r,_set:"procurement"})),...DB.projects.map(r=>({...r,_set:"projects"})),...DB.maintenance.map(r=>({...r,_set:"maintenance"}))]; }
function fileIcon(name){

function computeStats(){
  const recs=allRecords();
  const sum=arr=>arr.reduce((a,r)=>a+(Number(r.budget)||0),0);
  const byStatus={}; STATUSES.forEach(s=>byStatus[s]=0);
  recs.forEach(r=>{ const st=isOverdue(r)?"Overdue":r.status; byStatus[st]=(byStatus[st]||0)+1; });
  const completedAmt=sum(recs.filter(r=>r.status==="Completed"));
  const pendingAmt=sum(recs.filter(r=>["To Do","Pending"].includes(r.status)));
  const inProgAmt=sum(recs.filter(r=>["In Progress","Ordered"].includes(r.status)));
  const now=new Date(), monthVal=sum(recs.filter(r=>{ const d=new Date(r.created||r.due); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); }));
  return {
    recs, totalBudget:sum(recs), completedAmt, pendingAmt, inProgAmt, monthVal,
    nProc:DB.procurement.length, nProj:DB.projects.length, nMaint:DB.maintenance.length, nSupp:DB.suppliers.length,
    completed:recs.filter(r=>r.status==="Completed").length,
    pending:recs.filter(r=>["To Do","Pending"].includes(r.status)).length,
    overdue:recs.filter(r=>isOverdue(r)).length,
    delivered:recs.filter(r=>r.status==="Delivered").length,
    ordered:recs.filter(r=>r.status==="Ordered").length,
    byStatus
  };
}

/* ---- Workflow stages (canonical) + legacy status mapping ----
   Stored r.status is NEVER rewritten. Legacy values are mapped only for
   grouping/colouring so old records slot into the new workflow cleanly. */
const PROC_STAGE_DEFS = [
  {id:"Requesting Quotation", tab:"rfq",        color:"#2563eb"},
  {id:"Quotation Received",   tab:"rfq",        color:"#2563eb"},
  {id:"Under Evaluation",     tab:"evaluation", color:"#2563eb"},
  {id:"Pending Approval",     tab:"approval",   color:"#d97706"},
  {id:"Approved",             tab:"approval",   color:"#7c3aed"},
  {id:"PO Issued",            tab:"po",         color:"#7c3aed"},
  {id:"In Production",        tab:"po",         color:"#ea580c"},
  {id:"In Transit",           tab:"delivery",   color:"#ea580c"},
  {id:"Partially Received",   tab:"delivery",   color:"#ea580c"},
  {id:"Fully Received",       tab:"delivery",   color:"#059669"},
  {id:"Completed",            tab:"completed",  color:"#059669"},
  {id:"Cancelled",            tab:"completed",  color:"#dc2626"}
];
const PROC_LEGACY_STAGE = {"To Do":"Requesting Quotation","In Progress":"In Production","Ordered":"PO Issued","Partially Delivered":"Partially Received","Delivered":"Fully Received","On Hold":"Pending Approval"};
const PROC_TABS = [
  {id:"all",        label:"All Records"},
  {id:"rfq",        label:"RFQ"},
  {id:"evaluation", label:"Evaluation"},
  {id:"approval",   label:"Approval"},
  {id:"po",         label:"Purchase Order"},
  {id:"delivery",   label:"Delivery"},
  {id:"completed",  label:"Completed"}
];
function procStage(r){ const s=r.status||""; return PROC_LEGACY_STAGE[s] || (PROC_STAGE_DEFS.some(d=>d.id===s)?s:"Requesting Quotation"); }
function procStageDef(stage){ return PROC_STAGE_DEFS.find(d=>d.id===stage) || PROC_STAGE_DEFS[0]; }
function procStageColor(r){ return isOverdue(r) ? "#dc2626" : procStageDef(procStage(r)).color; }
function procTabOf(r){ return procStageDef(procStage(r)).tab; }
function procDisplayId(r){ return r.pr || r.po || ("REC-"+String(r.id||"").slice(-6).toUpperCase()); }

/* ---- AC unit / serial tracking (carried over from the AC Task Tracker) ---- */
function procUnitOf(r){ if(r&&r.unit) return String(r.unit).trim(); const m=/AC Unit:\s*([^\n]+)/i.exec((r&&r.remarks)||""); return m?m[1].trim():""; }
function procKnownUnits(){ const s=new Set(); (DB.procurement||[]).forEach(r=>{ const u=procUnitOf(r); if(u) s.add(u); }); return [...s].sort((a,b)=>a.localeCompare(b)); }
function procUnitHistory(unit,excludeId){ const q=String(unit||"").trim().toLowerCase(); if(!q) return []; return (DB.procurement||[]).filter(r=>r.id!==excludeId && procUnitOf(r).toLowerCase()===q).sort((a,b)=>(Number(b.created)||0)-(Number(a.created)||0)); }
function procUnitHistoryHTML(unit,excludeId,closer){
  closer=closer||"closeModal();";
  const list=procUnitHistory(unit,excludeId);
  if(!String(unit||"").trim()) return "";
  if(!list.length) return `<div class="muted" style="font-size:11.5px;margin-top:6px">No previous service recorded for this unit — this will start its history.</div>`;
  const usd=v=>"$"+(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

    </div>`).join("")}

}

function procQuickMatch(r,q){
  const me=((SESSION&&SESSION.name)||"").toLowerCase();
  switch(q){
    case "mine": return me && String(r.responsible||"").toLowerCase().includes(me);
    case "approval": return procStage(r)==="Pending Approval";
    case "overdue": return isOverdue(r);
    case "payment": { const paid=(Number(r.deposit)||0)+(Number(r.finalPay)||0); return paid < (Number(r.budget)||0) && !["Completed","Cancelled"].includes(procStage(r)); }
    case "delivery": { if(!r.due) return false; const d=new Date(r.due), n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
    case "docs": return !(r.files&&r.files.length) || !r.quote || !r.pr;
    default: return true;
  }
}

/* ---- Row filtering (uses the same base data + sort as before) ---- */
function procRows(opts){
  opts=opts||{};
  let base=DB.procurement.slice();
  if(_procF.cat) base=base.filter(r=>r.listId===_procF.cat);
  if(_procF.supplier) base=base.filter(r=>r.supplier===_procF.supplier);
  if(_procF.responsible) base=base.filter(r=>r.responsible===_procF.responsible);
  if(_procF.campus) base=base.filter(r=>r.campus===_procF.campus);
  if(_procF.stage) base=base.filter(r=>procStage(r)===_procF.stage);
  if(_procF.due) base=base.filter(r=>r.due===_procF.due);
  if(_procQuick) base=base.filter(r=>procQuickMatch(r,_procQuick));
  if(_procF.q){ const q=_procF.q.toLowerCase();
    base=base.filter(r=>[r.name,r.pr,r.quote,r.po,r.supplier,r.remarks,r.category,r.depositInv,r.finalInv,r.responsible,procUnitOf(r),procDisplayId(r)].join(" ").toLowerCase().includes(q)); }
  if(!opts.ignoreTab && _procTab!=="all") base=base.filter(r=>procTabOf(r)===_procTab);
  const sortMode=_procF.sort||"new";
  if(sortMode==="new") base.sort((a,b)=>(Number(b.created)||0)-(Number(a.created)||0));
  else if(sortMode==="old") base.sort((a,b)=>(Number(a.created)||0)-(Number(b.created)||0));
  else if(sortMode==="due") base.sort((a,b)=>(a.due?new Date(a.due).getTime():9e15)-(b.due?new Date(b.due).getTime():9e15));
  else if(sortMode==="budget") base.sort((a,b)=>(Number(b.budget)||0)-(Number(a.budget)||0));
  else base.sort((a,b)=>poSortKey(a.po)-poSortKey(b.po) || String(a.po||"").localeCompare(String(b.po||"")));
  return base;
}

/* ---- KPIs ---- */
function procKPIs(){
  const all=procRows({ignoreTab:true});
  const active=all.filter(r=>!["Completed","Cancelled"].includes(procStage(r)));
  return {
    active: active.length,
    pending: all.filter(r=>procStage(r)==="Pending Approval").length,
    poIssued: all.filter(r=>["PO Issued","In Production","In Transit","Partially Received","Fully Received"].includes(procStage(r))).length,
    overdue: all.filter(r=>isOverdue(r)).length,
    committed: active.reduce((s,r)=>s+(Number(r.budget)||0),0)
  };
}

function procDropStage(ev,stage){
