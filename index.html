async function testTelegram(){
  const token=(DB.settings.tgToken||"").trim(), chat=(DB.settings.tgChat||"").trim();
  if(!token||!chat){ toast("Missing setup","Enter both Bot Token and Chat ID first","err"); return; }
  try{
    const res=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text:"✅ Test from "+(DB.settings.orgName||"Procurement System")+". Telegram delivery is working."})});
    const j=await res.json();
    if(j.ok) toast("Test sent","Check the approver's Telegram","ok");
    else toast("Telegram error",j.description||"Check token & chat ID","err",7000);
  }catch(e){ toast("Network error","Could not reach Telegram","err",6000); }
}
// Send a PDF Blob to Telegram via the bot
async function telegramSendPDF(blob,filename,caption){
  const token=(DB.settings.tgToken||"").trim(), chat=(DB.settings.tgChat||"").trim();
  if(!token||!chat) return {ok:false,reason:"not_configured"};
  try{
    const fd=new FormData();
    fd.append("chat_id",chat);
    fd.append("caption",caption||DB.settings.tgCaption||"Purchase Order");
    fd.append("document",blob,filename);
    const res=await fetch(`https://api.telegram.org/bot${token}/sendDocument`,{method:"POST",body:fd});
    const j=await res.json();
    return j.ok?{ok:true}:{ok:false,reason:j.description||"telegram_error"};
  }catch(e){ return {ok:false,reason:"network"}; }
}

function doReset(){
  const pass=document.getElementById("reset_pass").value;
  const me=DB.users.find(u=>u.id===SESSION.id);
  if(!me||me.password!==pass){ toast("Incorrect password","Reset cancelled","err"); return; }
  const alsoUsers=document.getElementById("reset_users").checked;
  const keepSettings=DB.settings;
  const fresh=defaultDB(); fresh.settings=keepSettings;
  if(!alsoUsers) fresh.users=DB.users;
  DB=fresh; saveDB();
  if(alsoUsers){ closeModal(); toast("All data reset","Users restored to default","ok"); doLogout(); return; }
  closeModal(); buildNav(); navigate("dashboard"); toast("All data reset","Records cleared to zero","ok");
}

// Generate next PO# as mmyy-## (e.g. 0626-01). Sequence resets each month.
function nextPONumber(){
  const d=new Date(); const mm=String(d.getMonth()+1).padStart(2,"0"); const yy=String(d.getFullYear()%100).padStart(2,"0");
  const prefix=mm+yy+"-";
  let max=0;
  DB.po.forEach(p=>{ if(p.poNo&&p.poNo.indexOf(prefix)===0){ const n=parseInt(p.poNo.slice(prefix.length),10); if(!isNaN(n)&&n>max)max=n; } });
  return prefix+String(max+1).padStart(2,"0");
}

// Check PO number / PR number / Quote number against all other POs (case-insensitive, blanks ignored)
function findPODuplicates(id,vals){
  const checks=[["poNo","PO Number"],["pr","PR Number"],["quote","Quote Number"]];
  const norm=s=>String(s||"").trim().toLowerCase();
  const out=[];
  checks.forEach(([key,label])=>{
    const v=vals[key]; if(!v) return;
    const hit=DB.po.find(r=>r.id!==id && norm(r[key])===norm(v));
    if(hit) out.push({field:key,label,value:v,poNo:hit.poNo||"(no number)",supplier:hit.supplier||""});
  });
  return out;
}
let _poFromRecord=null;
// Back-fill: for procurement records missing a PO number, find a PO that shares the same
// PR Number or Quote Number and copy its PO number onto the record. Returns count filled.
function backfillProcPONumbers(force){
  const norm=s=>String(s||"").trim().toLowerCase();
  let filled=0;
  (DB.procurement||[]).forEach(rec=>{
    if(!force && rec.po && rec.po.trim()) return; // already has a PO number
    const recPr=norm(rec.pr), recQ=norm(rec.quote);
    if(!recPr && !recQ) return;
    // find a PO matching by PR or Quote (that actually has a PO number)
    const hit=(DB.po||[]).find(po=>{
      if(!po.poNo||!String(po.poNo).trim()) return false;
      const poPr=norm(po.pr), poQ=norm(po.quote);
      return (recPr && poPr && recPr===poPr) || (recQ && poQ && recQ===poQ);
    });
    if(hit && (rec.po||"")!==hit.poNo){
      rec.po=hit.poNo; rec.updated=Date.now();
      if(Array.isArray(rec.history)) rec.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"PO number auto-filled ("+hit.poNo+") from matching PO"});
      // also link them for future edits
      if(!hit.fromRecord) hit.fromRecord=rec.id;
      filled++;
    }
  });
  if(filled>0) saveDB();
  return filled;
}

function initSignPad(existing){

// Format a timestamp like "09:54 AM 30-Jun-2026" (matches the PR document style)
function fmtStamp(ts){
  if(!ts) return "";
  const d=new Date(ts);
  const mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  let h=d.getHours(); const ap=h>=12?"PM":"AM"; h=h%12||12;
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${String(h).padStart(2,"0")}:${mm} ${ap} ${String(d.getDate()).padStart(2,"0")}-${mon}-${d.getFullYear()}`;
}

// Issue & Send: ensure signatures, build the signed PDF, deliver to Telegram (or fallback)
async function issueAndSendPO(id){
  const p=DB.po.find(x=>x.id===id);
  // auto-apply saved signatures if not already signed
  if(!poSig(p,"prepared") && DB.settings.prepSig) applySavedSig_quiet(id,"prepared");
  if(!poSig(p,"approved") && DB.settings.apprSig) applySavedSig_quiet(id,"approved");
  const blob=downloadPOPdf(id,"blob");
  const filename=`PO ${p.poNo}.pdf`;
  const caption=`${DB.settings.tgCaption||"Purchase Order for your approval"}\nPO#: ${p.poNo}\nSupplier: ${p.supplier||"-"}\nAmount: ${money(p.amount)}`;
  if(DB.settings.tgToken && DB.settings.tgChat){
    toast("Sending to Telegram…","","ok");
    const r=await telegramSendPDF(blob,filename,caption);
    if(r.ok){ p.status=p.status==="Draft"?"Ordered":p.status; p.issuedAt=Date.now(); saveDB(); closeModal(); paintPO(); toast("PO sent to Telegram","Delivered to the approver","ok"); return; }
    toast("Telegram send failed",(r.reason||"")+" — downloading PDF instead","err",6000);
  }
  // Fallback: download the PDF and open Telegram with a prefilled message to attach it
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  const msg=encodeURIComponent(caption+"\n(PDF downloaded — please attach it here)");
  window.open("https://t.me/share/url?url=&text="+msg,"_blank");
  toast("PDF downloaded","Telegram opened — attach the downloaded PDF","warn",7000);
}

function downloadPOExcel(id){
  const p=DB.po.find(x=>x.id===id);
  const wb=XLSX.utils.book_new();
  const d=p.orderDate?new Date(p.orderDate):new Date();
  const dstr=d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}).replace(/ /g,"-");
  // Build a 2D array matching the template layout (A..F = cols 0..5)
  const rows=[];
  for(let i=0;i<33;i++) rows.push(["","","","","",""]);
  rows[1][5]="PURCHASE ORDER";                         // F2
  rows[2][4]="DATE:"; rows[2][5]=dstr;                 // E3/F3
  rows[3][0]=PO_COMPANY.addr[0]; rows[3][4]="PO#:"; rows[3][5]=p.poNo;  // A4/E4/F4
  rows[4][0]=PO_COMPANY.addr[1];                       // A5
  rows[5][0]=PO_COMPANY.addr[2];                       // A6
  rows[6][0]=PO_COMPANY.addr[3];                       // A7
  rows[8][0]="SUPPLIER";                               // A9
  // Full supplier block: selected supplier's contact details, else default company block
  const supObj=p.supplier?DB.suppliers.find(s=>s.name===p.supplier):null;
  const supBlock=supObj?[supObj.name,supObj.contact,supObj.phone?("Office: "+supObj.phone):"",supObj.email].filter(Boolean):(p.supplier?[p.supplier]:PO_SUPPLIER_DEFAULT.slice());
  supBlock.slice(0,4).forEach((line,i)=>{ rows[9+i][0]=line; });  // A10..A13
  // header row 15 (index 14)
  rows[14]=["ITEM#","DESCRIPTION","","QTY","UNIT PRICE","TOTAL"];
  // 10 item rows (index 15..24); only actual items get values, blanks stay empty
  (p.items||[]).slice(0,10).forEach((it,i)=>{
    const r=15+i; const qty=Number(it.qty)||0, price=Number(it.price)||0;
    rows[r]=[i+1,it.desc||"","",qty,price,qty*price];
  });
  // campus/quote + total row (index 25, right after the 10 item rows)
  const FOOT=25;
  rows[FOOT][0]="Campus: "+(p.campus||"")+"\nQUOTE#: "+(p.quote||"")+(p.quoteDesc?", "+p.quoteDesc:"");
  rows[FOOT][4]="Total:"; rows[FOOT][5]=Number(p.amount)||0;
  rows[FOOT+2][0]="Prepared by:"; rows[FOOT+2][4]="Approved by:";
  rows[FOOT+6][0]=PO_COMPANY.preparedBy; rows[FOOT+6][4]=PO_COMPANY.approvedBy;
  rows[FOOT+7][0]=PO_COMPANY.preparedTitle; rows[FOOT+7][4]=PO_COMPANY.approvedTitle;
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // column widths
  ws["!cols"]=[{wch:10},{wch:18},{wch:24},{wch:10},{wch:14},{wch:13}];
  // merges to match template
  ws["!merges"]=[
    {s:{r:1,c:5},e:{r:1,c:5}},
    {s:{r:FOOT,c:0},e:{r:FOOT,c:3}},
    {s:{r:FOOT+2,c:0},e:{r:FOOT+2,c:1}}
  ];
  for(let i=15;i<FOOT;i++) ws["!merges"].push({s:{r:i,c:1},e:{r:i,c:2}});
  ws["!merges"].push({s:{r:14,c:1},e:{r:14,c:2}});
  XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  XLSX.writeFile(wb,`PO ${p.poNo} - ${(p.supplier||"PO").slice(0,20)}.xlsx`);
  toast("PO Excel downloaded","Template format","ok");
}
function downloadPOPdf(id,mode){
  const p=DB.po.find(x=>x.id===id); const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"pt",format:"a4"});
  const BLUE=[91,155,213]; // template accent (theme accent1 5B9BD5)
  const L=40, R=555; // page margins (A4 width 595)
  const usd=v=>"$ "+(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const num=v=>(Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  // Header: logo + school name (left) + PURCHASE ORDER bar (right)
  try{ doc.addImage(WIS_LOGO,"PNG",L,28,52,52); }catch(e){}
  doc.setFontSize(19); doc.setTextColor(31,56,100); doc.setFont(undefined,"bold"); doc.text("WESTERN",L+60,52);
  doc.setFontSize(9); doc.setTextColor(64); doc.setFont(undefined,"normal"); doc.text("INTERNATIONAL SCHOOL",L+61,66);
  doc.setFillColor(...BLUE); doc.rect(330,28,R-330,30,"F");
  doc.setFontSize(20); doc.setTextColor(30); doc.setFont(undefined,"normal"); doc.text("PURCHASE ORDER",R-8,49,{align:"right"});
  doc.setFontSize(10); doc.setTextColor(50);
  doc.text("DATE:",430,72,{align:"right"}); doc.text("PO#:",430,88,{align:"right"});
  const d=p.orderDate?new Date(p.orderDate):new Date();
  const dstr=d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}).replace(/ /g,"-");
  doc.text(dstr,470,72); doc.text(p.poNo||"",470,88);
  // company address (below logo)
  doc.setFontSize(10); doc.setTextColor(40);
  PO_COMPANY.addr.forEach((line,i)=>doc.text(line,L,96+i*14));
  // SUPPLIER bar
  let y=176; doc.setFillColor(...BLUE); doc.rect(L,y-14,210,24,"F");
  doc.setFontSize(15); doc.setTextColor(30); doc.text("SUPPLIER",L+6,y+3);
  y+=24; doc.setFontSize(10); doc.setTextColor(40);
  // Full supplier details: use selected supplier's contact block if available
  let supLines;
  const supObj = p.supplier ? DB.suppliers.find(s=>s.name===p.supplier) : null;
  if(supObj){ supLines=[supObj.name, supObj.contact, supObj.phone?("Office: "+supObj.phone):"", supObj.email].filter(Boolean); }
  else if(p.supplier){ supLines=[p.supplier]; }
  else { supLines=PO_SUPPLIER_DEFAULT.slice(); }
  supLines.forEach((line,i)=>doc.text(String(line),L,y+i*14));
  // Items table — fixed 10 data rows like the official template, with the
  // campus/quote + total as a foot row so all borders align with the columns.
  const startY=y+supLines.length*14+16;
  const ROWS=10;
  const items=(p.items||[]).slice(0,ROWS);
  const body=[];
  for(let i=0;i<ROWS;i++){
    if(i<items.length){
      const it=items[i]; const q=Number(it.qty)||0, pr=Number(it.price)||0;
      body.push([i+1, it.desc||"", q, usd(pr), num(q*pr)]);
    } else {
      body.push(["","","","",""]); // empty row: all cells blank, borders preserved
    }
  }
  const quote=("QUOTE#: "+(p.quote||"")+(p.quoteDesc?(p.quote?", ":"")+p.quoteDesc:"")).trim();
  const campusCell="Campus: "+(p.campus||"—")+"\n"+(quote.length>70?quote.slice(0,70)+"…":quote);
  doc.autoTable({startY,
    head:[["ITEM#","DESCRIPTION","QTY","UNIT PRICE","TOTAL"]],
    body,
    foot:[[
      {content:campusCell, colSpan:3, styles:{halign:"left",fontStyle:"bold",valign:"middle",fontSize:9}},
      {content:"Total:", styles:{halign:"center",fontStyle:"normal",valign:"middle"}},
      {content:usd(p.amount), styles:{halign:"right",fontStyle:"bold",valign:"middle"}}
    ]],
    theme:"grid",
    styles:{fontSize:10,cellPadding:4,lineColor:[90,90,90],lineWidth:0.5,textColor:[30,30,30],minCellHeight:18},
    headStyles:{fillColor:BLUE,textColor:[20,20,20],fontStyle:"bold",halign:"center",lineColor:[90,90,90],lineWidth:0.5},
    footStyles:{fillColor:[255,255,255],textColor:[30,30,30],lineColor:[90,90,90],lineWidth:0.5,minCellHeight:40},
    columnStyles:{0:{halign:"center",cellWidth:50},1:{halign:"left",cellWidth:265},2:{halign:"center",cellWidth:50},3:{halign:"right",cellWidth:75},4:{halign:"right",cellWidth:75}},
    margin:{left:L,right:40}});
  let ty=doc.lastAutoTable.finalY;
  // Approval workflow (Requested by / Approved by) with name + date/time
  const w=p.workflow||{};
  let sy=ty+44; doc.setFont(undefined,"normal"); doc.setFontSize(10); doc.setTextColor(40);
  doc.text("Requested by:",L,sy); doc.text("Approved by:",L+300,sy);
  const sigP=(p.signatures&&p.signatures.prepared)||null;
  const sigA=(p.signatures&&p.signatures.approved)||null;
  // draw signature images above the line if present
  try{ if(sigP&&sigP.dataUrl) doc.addImage(sigP.dataUrl,"PNG",L,sy+6,150,34); }catch(e){}
  try{ if(sigA&&sigA.dataUrl) doc.addImage(sigA.dataUrl,"PNG",L+300,sy+6,150,34); }catch(e){}
  doc.setDrawColor(90); doc.setLineWidth(0.5); doc.line(L,sy+44,L+200,sy+44); doc.line(L+300,sy+44,L+500,sy+44);
  doc.setFont(undefined,"bold"); doc.text((w.requested&&w.requested.name)||(sigP&&sigP.name)||PO_COMPANY.preparedBy,L,sy+58); doc.text((w.approved&&w.approved.name)||(sigA&&sigA.name)||PO_COMPANY.approvedBy,L+300,sy+58);
  doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.setTextColor(80);
  doc.text((w.requested&&w.requested.title)||(sigP&&sigP.title)||PO_COMPANY.preparedTitle,L,sy+72); doc.text((w.approved&&w.approved.title)||(sigA&&sigA.title)||PO_COMPANY.approvedTitle,L+300,sy+72);
  if(w.requested&&w.requested.at) doc.text(fmtStamp(w.requested.at),L,sy+85);
  if(w.approved&&w.approved.at) doc.text(fmtStamp(w.approved.at),L+300,sy+85);
  if(mode==="blob"){ return doc.output("blob"); }
  doc.save(`${p.poNo}.pdf`); toast("PO PDF downloaded","Official template format","ok");
}

// Uniform module supports two independent datasets: regular "uniform" and "gep".
let _uniformKind="uniform";
let _uniformState={ uniform:{period:null,view:"summary",filter:{outlet:"",q:""}}, gep:{period:null,view:"summary",filter:{outlet:"",q:""}} };
function uniformDB(){ return _uniformKind==="gep"?DB.gepUniform:DB.uniform; }
function uniLabel(){ return _uniformKind==="gep"?"GEP Uniform":"Uniform Stock"; }
// Back-compat accessors that proxy to the active kind's state
Object.defineProperty(window,"_uniformPeriod",{get(){return _uniformState[_uniformKind].period;},set(v){_uniformState[_uniformKind].period=v;},configurable:true});
Object.defineProperty(window,"_uniformView",{get(){return _uniformState[_uniformKind].view;},set(v){_uniformState[_uniformKind].view=v;},configurable:true});
Object.defineProperty(window,"_uniformFilter",{get(){return _uniformState[_uniformKind].filter;},set(v){_uniformState[_uniformKind].filter=v;},configurable:true});

function uniformPeriods(){
  // distinct periods present in data, plus the baseline month, the cutoff-based
  // current month, and next month.
  const set=new Set(uniformDB().map(r=>r.period).filter(Boolean));
  set.add(UNIFORM_BASE_PERIOD);
  set.add(currentPeriod());
  set.add(nextPeriodOf(currentPeriod()));
  if(_uniformPeriod) set.add(_uniformPeriod);
  // fill any gap months between the earliest and latest so none are skipped
  const arr=Array.from(set).sort();
  if(arr.length>1){
    let cur=arr[0]; const last=arr[arr.length-1]; const full=new Set(arr);
    let guard=0;
    while(cur!==last && guard++<240){ cur=nextPeriodOf(cur); full.add(cur); }
    return Array.from(full).sort().reverse();
  }
  return arr.reverse();
}
function uniformRowsFor(period){
  return uniformDB().filter(r=>r.period===period);
}
function uniformRowFor(period,outlet){
  return uniformDB().find(r=>r.period===period && r.outlet===outlet);
}

function uniKpi(cls,val,lbl){
  return `<div class="kpi"><div class="ic ${cls}" style="width:34px;height:34px;margin-bottom:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg></div><div class="val" style="font-size:21px">${(Number(val)||0).toLocaleString()}</div><div class="lbl">${lbl}</div></div>`;

function uniformDisplayRows(){
  let rows=uniformRowsFor(_uniformPeriod);
  if(_uniformFilter.outlet) rows=rows.filter(r=>r.outlet===_uniformFilter.outlet);
  if(_uniformFilter.q){ const q=_uniformFilter.q.toLowerCase(); rows=rows.filter(r=>(r.outlet+" "+(r.remark||"")).toLowerCase().includes(q)); }
  // order by the official outlet list
  return rows.slice().sort((a,b)=>UNIFORM_OUTLETS.indexOf(a.outlet)-UNIFORM_OUTLETS.indexOf(b.outlet));
}

function paintUniformSummary(){

  const host=document.getElementById("uniBody");
  const blank=v=>v===""||v==null?"":(Number(v)||0).toLocaleString();

    t.eb+=eb;

    const cell=k=>{ const s=uniformSum(r,k); const cnt=uniformArr(r,k).length; return s?`${s.toLocaleString()}${cnt>1?` <span class="muted" style="font-size:10px">(${cnt})</span>`:""}`:""; };

        ${isSuper()?`<button class="act-btn del" title="Delete" onclick="deleteUniform('${r.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>`:""}

  const empty=`<tr><td colspan="13"><div class="empty"><h4>No data for ${monthLabel(_uniformPeriod)}</h4><p>Add outlet balances to build this month's report.</p></div></td></tr>`;

let _uniformTx={};
function openUniformForm(id){
  const r=id?uniformDB().find(x=>x.id===id):null;
  const usedOutlets=uniformRowsFor(_uniformPeriod).map(x=>x.outlet);
  const availOutlets=UNIFORM_OUTLETS.filter(o=>!usedOutlets.includes(o)||(r&&r.outlet===o));
  // staging arrays for each movement type (migrates legacy single numbers)
  _uniformTx={};
  UNIFORM_MOVE_FIELDS.forEach(f=>{ _uniformTx[f.k]=r?uniformArr(r,f.k).slice():[]; });
  const blockFor=f=>`
    <div class="field full" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <label style="margin:0;flex:1">${f.label} <span class="muted" style="font-weight:500">(${f.dir==='+'?'adds to':'subtracts from'} stock)</span></label>

  openModal(`<div class="modal-head"><h3>${id?"Edit":"Add"} Uniform Stock — ${monthLabel(_uniformPeriod)}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="field"><label class="req">Stock Outlet / Campus</label><select id="u_outlet" ${id?'disabled':''} onchange="uniformSuggestBB()">${availOutlets.map(o=>`<option ${r?.outlet===o?'selected':''}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Beginning Balance (BB)</label><input type="number" min="0" id="u_bb" value="${r&&r.bb!==''&&r.bb!=null?r.bb:''}" placeholder="0"></div>
    ${blockFor(UNIFORM_MOVE_FIELDS[0])}
    ${blockFor(UNIFORM_MOVE_FIELDS[1])}
    ${blockFor(UNIFORM_MOVE_FIELDS[2])}
    ${blockFor(UNIFORM_MOVE_FIELDS[3])}
    ${blockFor(UNIFORM_MOVE_FIELDS[4])}
    ${blockFor(UNIFORM_MOVE_FIELDS[5])}
    ${blockFor(UNIFORM_MOVE_FIELDS[6])}
    <div class="field full"><label>Status / Remark</label><input id="u_remark" value="${esc(r?.remark||'')}"></div>
    <div class="field full"><div style="background:var(--surface-2);border-radius:9px;padding:11px 13px;font-size:13px">Ending Balance (auto): <b id="u_ebPreview" style="font-size:15px">—</b><div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">EB = BB + Move In + Adjust In − Move Out − Sold Out − Free − Broken − Adjust Out</div></div></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUniform(${id?`'${id}'`:'null'})">Save</button></div>`,{size:"wide"});
  UNIFORM_MOVE_FIELDS.forEach(f=>renderUniformTx(f.k));
  const bb=document.getElementById("u_bb"); if(bb) bb.addEventListener("input",updateUniformEBPreview);
  if(!id) uniformSuggestBB(); else updateUniformEBPreview();
}
function uniformAddTx(k){ _uniformTx[k]=_uniformTx[k]||[]; _uniformTx[k].push(""); renderUniformTx(k); // focus the new input
  setTimeout(()=>{ const inputs=document.querySelectorAll(`#u_list_${k} input`); if(inputs.length)inputs[inputs.length-1].focus(); },30); }
function renderUniformTx(k){
  const host=document.getElementById("u_list_"+k); if(!host)return;
  const arr=_uniformTx[k]||[];
  if(!arr.length){ host.innerHTML=`<div class="muted" style="font-size:12px;padding:2px 0">No entries. Click “+ Add” to record a transaction.</div>`; }
  else host.innerHTML=arr.map((v,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span class="muted" style="font-size:11px;width:18px">#${i+1}</span>
    <input type="number" min="0" value="${v===''||v==null?'':v}" placeholder="Qty" style="flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" oninput="_uniformTx['${k}'][${i}]=this.value;uniformRecalcSum('${k}');updateUniformEBPreview()">
    <button type="button" class="act-btn" onclick="_uniformTx['${k}'].splice(${i},1);renderUniformTx('${k}');uniformRecalcSum('${k}');updateUniformEBPreview()" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>`).join("");
  uniformRecalcSum(k);
}
function uniformRecalcSum(k){
  const arr=_uniformTx[k]||[]; const s=arr.reduce((a,x)=>a+(Number(x)||0),0);
  const el=document.getElementById("u_sum_"+k); if(el) el.textContent=s.toLocaleString();
}
function txSum(k){ return (_uniformTx[k]||[]).reduce((a,x)=>a+(Number(x)||0),0); }
function uniformSuggestBB(){
  const sel=document.getElementById("u_outlet"); if(!sel)return;
  const bbEl=document.getElementById("u_bb");
  if(bbEl && bbEl.value==="" ){
    const prev=uniformRowFor(prevPeriod(_uniformPeriod), sel.value);
    if(prev){ bbEl.value=uniformEB(prev); }
  }
  updateUniformEBPreview();
}
function updateUniformEBPreview(){
  const bb=Number(document.getElementById("u_bb")?.value)||0;
  const eb=bb+txSum("moveIn")+txSum("adjustIn")-txSum("moveOut")-txSum("soldOut")-txSum("free")-txSum("broken")-txSum("adjustOut");
  const el=document.getElementById("u_ebPreview"); if(el){ el.textContent=eb.toLocaleString(); el.style.color=eb<0?"var(--danger)":""; }
}
function saveUniform(id){
  const outlet=document.getElementById("u_outlet")?.value; if(!outlet){ toast("Outlet is required","","err"); return; }
  const bb=Number(document.getElementById("u_bb")?.value)||0;
  const ins=bb+txSum("moveIn")+txSum("adjustIn");
  const outs=txSum("moveOut")+txSum("soldOut")+txSum("free")+txSum("broken")+txSum("adjustOut");
  if(outs>ins){
    confirmModal("Negative ending balance","Total out ("+outs.toLocaleString()+") exceeds available stock ("+ins.toLocaleString()+"). Ending balance will be negative. Save anyway?",()=>doSaveUniform(id),"Save anyway",false);
    return;
  }
  doSaveUniform(id);
}
function doSaveUniform(id){
  const bbEl=document.getElementById("u_bb");
  const clean=k=>(_uniformTx[k]||[]).map(x=>Number(x)||0).filter(x=>x!==0); // drop empty/zero entries
  const obj={
    id:id||uid(), period:_uniformPeriod, outlet:document.getElementById("u_outlet").value,
    bb:bbEl.value===""?"":Number(bbEl.value),
    moveIn:clean("moveIn"), adjustIn:clean("adjustIn"), moveOut:clean("moveOut"),
    soldOut:clean("soldOut"), free:clean("free"), broken:clean("broken"), adjustOut:clean("adjustOut"),
    remark:document.getElementById("u_remark").value.trim(), updated:Date.now()
  };
  const COL=uniformDB();
  if(id){ const i=COL.findIndex(x=>x.id===id); obj.created=COL[i].created; COL[i]=obj; toast("Outlet updated","","ok"); }
  else { obj.created=Date.now(); COL.push(obj); toast("Outlet added","","ok"); }
  saveDB(); closeModal(); renderUniform();
}
function deleteUniform(id){
  if(!isSuper()){ toast("Permission denied","Only Super Admin can delete","err"); return; }
  const r=uniformDB().find(x=>x.id===id);
  confirmModal("Delete outlet record?",`"${esc(r.outlet)}" for ${monthLabel(r.period)} will be removed.`,()=>{ const COL=uniformDB(); const i=COL.findIndex(x=>x.id===id); if(i>-1)COL.splice(i,1); saveDB(); renderUniform(); toast("Deleted","","ok"); },"Delete");
}
function carryForwardUniform(){
  const rows=uniformRowsFor(_uniformPeriod);
  if(!rows.length){ toast("Nothing to carry","Add outlet balances first","err"); return; }
  const next=nextPeriodOf(_uniformPeriod);
  const existing=uniformRowsFor(next);
  const proceed=()=>{
    const COL=uniformDB();
    // remove existing next-month rows that we will replace
    for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===next) COL.splice(i,1); }
    rows.forEach(r=>{
      COL.push({id:uid(),period:next,outlet:r.outlet,bb:uniformEB(r),
        moveIn:[],adjustIn:[],moveOut:[],soldOut:[],free:[],broken:[],adjustOut:[],
        remark:"",created:Date.now()});
    });
    saveDB(); _uniformPeriod=next; renderUniform();
    toast("Carried forward",monthLabel(next)+" created from ending balances","ok");
  };
  if(existing.length) confirmModal("Overwrite "+monthLabel(next)+"?",monthLabel(next)+" already has "+existing.length+" outlet record(s). Carrying forward will replace them with ending balances from "+monthLabel(_uniformPeriod)+".",proceed,"Overwrite");
  else proceed();
}
function nextPeriodOf(period){ let [y,m]=period.split("-").map(Number); m++; if(m>12){m=1;y++;} return y+"-"+String(m).padStart(2,"0"); }

// Move every record in the currently-viewed month to a different month.
function reassignUniformMonth(){
  const from=_uniformPeriod;
  const rows=uniformRowsFor(from);
  if(!rows.length){ toast("No data to move","This month has no records","err"); return; }
  // build a list of candidate target months (12 around the current data range)
  const opts=[]; let base=prevPeriod(prevPeriod(prevPeriod(from)));
  for(let i=0;i<12;i++){ opts.push(base); base=nextPeriodOf(base); }
  const uniqueOpts=Array.from(new Set(opts));
  openModal(`<div class="modal-head"><h3>Change Month</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p style="margin:0 0 14px;font-size:13.5px">Move all <b>${rows.length}</b> outlet record(s) from <b>${monthLabel(from)}</b> to:</p>
    <div class="field"><label class="req">Target Month</label>
      <select id="reassign_to">${uniqueOpts.filter(p=>p!==from).map(p=>`<option value="${p}">${monthLabel(p)}</option>`).join("")}</select>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">If the target month already has records for the same outlet, they will be replaced by the moved records.</div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doReassignUniformMonth('${from}')">Move Records</button></div>`);
}
function doReassignUniformMonth(from){
  const to=document.getElementById("reassign_to").value;
  if(!to||to===from){ toast("Pick a different month","","err"); return; }
  const moving=uniformRowsFor(from);
  const movingOutlets=moving.map(r=>r.outlet);
  // remove target-month rows for the same outlets (avoid duplicates), then re-stamp the period
  const COL=uniformDB();
  // remove target-month rows for the same outlets (avoid duplicates), then re-stamp the period
  for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===to && movingOutlets.includes(COL[i].outlet)) COL.splice(i,1); }
  COL.forEach(r=>{ if(r.period===from) r.period=to; });
  saveDB(); _uniformPeriod=to; closeModal(); renderUniform();
  toast("Records moved",moving.length+" record(s) → "+monthLabel(to),"ok");
}

/* ---- Uniform Excel import ---- */
function importUniformExcel(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    // Prefer a sheet named like UniformStock; else first sheet
    let sheetName=wb.SheetNames.find(n=>/uniform/i.test(n))||wb.SheetNames[0];
    const json=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:""});
    if(!json.length){ toast("No rows found","Check the sheet format","err"); return; }
    const norm=s=>String(s||"").trim().toUpperCase();
    const matchOutlet=v=>{ const u=norm(v); return UNIFORM_OUTLETS.find(o=>norm(o)===u)||UNIFORM_OUTLETS.find(o=>norm(o).startsWith(u)||u.startsWith(norm(o)))||v; };
    const numB=v=>v===""||v==null||isNaN(v)?0:Number(v);
    // Parse a movement value: prefer an "Entries" column (comma/plus separated) else the single total
    const toArr=(entries,total)=>{
      if(entries!=null && String(entries).trim()!==""){
        return String(entries).split(/[,+]/).map(x=>Number(String(x).trim())||0).filter(x=>x!==0);
      }
      const n=numB(total); return n?[n]:[];
    };
    const period=_uniformPeriod;
    const imported=[];
    json.forEach(row=>{
      const outlet=matchOutlet(row.Outlet||row.outlet||row["Stock Outlet"]||row["Stock Outlet / Campus"]);
      if(!outlet) return;
      imported.push({id:uid(),period:row.Period||period,outlet,
        bb:numB(row.BB),
        moveIn:toArr(row.MoveIn_Entries,row.MoveIn||row["Move In"]),
        adjustIn:toArr(row.AdjustIn_Entries,row.AdjustIn||row["Adjust In"]),
        moveOut:toArr(row.MoveOut_Entries,row.MoveOut||row["Move Out"]),
        soldOut:toArr(row.SoldOut_Entries,row.SoldOut||row["Sold Out"]),
        free:toArr(row.Free_Entries,row.Free),
        broken:toArr(row.Broken_Entries,row.Broken),
        adjustOut:toArr(row.AdjustOut_Entries,row.AdjustOut||row["Adjust Out"]),
        remark:row.Remark||row.Status||"", created:Date.now()});
    });
    if(!imported.length){ toast("No matching outlets","Could not map rows to outlets","err"); return; }
    confirmModal("Import "+imported.length+" outlet rows?","Rows will be added for "+monthLabel(imported[0].period||period)+". Existing rows for the same outlet & month will be replaced.",()=>{
      const COL=uniformDB();
      imported.forEach(im=>{ for(let i=COL.length-1;i>=0;i--){ if(COL[i].period===im.period&&COL[i].outlet===im.outlet) COL.splice(i,1); } COL.push(im); });
      saveDB(); renderUniform(); toast("Imported",imported.length+" rows added","ok");
    },"Import",false);
  }catch(err){ console.error(err); toast("Import failed","Could not read the file","err"); } };
  reader.readAsArrayBuffer(f); input.value="";
}

function maintCampuses(){ if(!DB.maintCampuses||!DB.maintCampuses.length){ DB.maintCampuses=MAINT_CAMPUSES_DEFAULT.map((c,i)=>({name:c,active:true,order:i})); saveDB(); } return DB.maintCampuses.filter(c=>c.active).sort((a,b)=>(a.order||0)-(b.order||0)).map(c=>c.name); }
function quarterMonths(q){ const x=QUARTERS.find(z=>z.q===q); return x?x.months:""; }
function maintReportTitle(type,year,q){ const p=MAINT_PROGRAMS[type]; return `${p.reportName} from ${quarterMonths(q)} ${year}`; }
function maintPrice(type,eqId){

}

function quarterKey(type,year,q){ return `${type}-${year}-Q${q}`; }
function getQuarter(type,year,q){
  let qd=DB.maintQuarters.find(x=>x.key===quarterKey(type,year,q));
  return qd;
}
function ensureQuarter(type,year,q){
  let qd=getQuarter(type,year,q);
  if(!qd){
    qd={key:quarterKey(type,year,q),type,year,q,matrix:{},locked:false,
      approval:{prepared:{name:"",position:"Admin Officer",date:"",status:""},checked:{name:"",position:"Procurement Manager",date:"",status:""},verified:{name:"",position:"Vice-President of Operations",date:"",status:""}},
      created:Date.now(),createdBy:(SESSION&&SESSION.name)||"System",history:[{by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Quarter created"}]};
    DB.maintQuarters.push(qd); saveDB();
  }
  return qd;
}
function maintQty(qd,eqId,campus){ const v=qd.matrix?.[eqId]?.[campus]; return (v===""||v==null)?"":Number(v); }
function maintCellFee(type,qd,eqId,campus){ const q=maintQty(qd,eqId,campus); return q===""?"":q*maintPrice(type,eqId); }
/* ---- Previous-quarter comparison (spot what changed in a new quarter) ---- */
let _maintCompare=false;
function prevQuarterOf(year,q){ return q===1?{year:year-1,q:4}:{year,q:q-1}; }
function getPrevQuarterData(type,year,q){ const pv=prevQuarterOf(year,q); return getQuarter(type,pv.year,pv.q); }
// Returns {changed:bool, prev:value, delta:number|null, kind:'up'|'down'|'new'|'removed'|'same'}
function maintCellDiff(type,qd,eqId,campus){
  const prev=getPrevQuarterData(type,qd.year,qd.q);
  if(!prev) return {changed:false,kind:"none",prev:""};
  const cur=maintQty(qd,eqId,campus);
  const old=maintQty(prev,eqId,campus);
  if(cur===""&&old==="") return {changed:false,kind:"same",prev:""};
  if(old===""&&cur!=="") return {changed:true,kind:"new",prev:"",delta:cur};
  if(cur===""&&old!=="") return {changed:true,kind:"removed",prev:old,delta:-old};
  if(Number(cur)===Number(old)) return {changed:false,kind:"same",prev:old};
  return {changed:true,kind:Number(cur)>Number(old)?"up":"down",prev:old,delta:Number(cur)-Number(old)};
}
function maintDiffSummary(type,qd,equipment,campuses){
  const prev=getPrevQuarterData(type,qd.year,qd.q);
  if(!prev) return null;
  let changed=0,up=0,down=0,added=0,removed=0;
  equipment.forEach(eq=>campuses.forEach(cp=>{
    const d=maintCellDiff(type,qd,eq.id,cp);
    if(d.changed){ changed++; if(d.kind==="up")up++; else if(d.kind==="down")down++; else if(d.kind==="new")added++; else if(d.kind==="removed")removed++; }
  }));
  const pv=prevQuarterOf(qd.year,qd.q);
  return {changed,up,down,added,removed,prevLabel:quarterMonths(pv.q)+" "+pv.year};
}

function quarterFee(qd){ let t=0; const p=MAINT_PROGRAMS[qd.type]; p.equipment.forEach(eq=>{ const price=maintPrice(qd.type,eq.id); Object.values(qd.matrix?.[eq.id]||{}).forEach(q=>{ t+=(Number(q)||0)*price; }); }); return t; }

function drawMaintDashCharts(){
  if(typeof Chart==="undefined")return;
  if(!window._mCharts)window._mCharts={}; Object.keys(window._mCharts).forEach(k=>{try{window._mCharts[k].destroy();}catch(e){}});
  const C=chartColors();
  const campuses=maintCampuses();
  const qds=DB.maintQuarters.filter(x=>x.year===_maintYear&&x.q===_maintQ);
  // cost by campus
  const byCampus=campuses.map(cp=>{ let t=0; qds.forEach(qd=>{ const p=MAINT_PROGRAMS[qd.type]; p.equipment.forEach(eq=>{ const price=maintPrice(qd.type,eq.id); const q=Number(qd.matrix?.[eq.id]?.[cp])||0; t+=q*price; }); }); return t; });
  const cc=document.getElementById("mDashCampus");
  if(cc) window._mCharts.campus=new Chart(cc,{type:"bar",data:{labels:campuses,datasets:[{data:byCampus,backgroundColor:C.palette,borderRadius:6,maxBarThickness:24}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  // quarterly comparison
  const qComp=QUARTERS.map(q=>DB.maintQuarters.filter(x=>x.year===_maintYear&&x.q===q.q).reduce((a,x)=>a+quarterFee(x),0));
  const qc=document.getElementById("mDashQuarter");
  if(qc) window._mCharts.quarter=new Chart(qc,{type:"bar",data:{labels:QUARTERS.map(q=>q.label),datasets:[{data:qComp,backgroundColor:["#6366f1","#2563eb","#7c3aed","#0d9488"],borderRadius:7,maxBarThickness:50}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid},ticks:{callback:v=>shortMoney(v)}},x:{grid:{display:false}}}}});
  // by equipment (combined)
  const eqMap={}; qds.forEach(qd=>{ const p=MAINT_PROGRAMS[qd.type]; p.equipment.forEach(eq=>{ const price=maintPrice(qd.type,eq.id); let t=0; Object.values(qd.matrix?.[eq.id]||{}).forEach(q=>t+=(Number(q)||0)*price); if(t>0)eqMap[eq.name]=(eqMap[eq.name]||0)+t; }); });
  const ec=document.getElementById("mDashEquip");
  if(ec) window._mCharts.equip=new Chart(ec,{type:"doughnut",data:{labels:Object.keys(eqMap).length?Object.keys(eqMap):["No data"],datasets:[{data:Object.keys(eqMap).length?Object.values(eqMap):[1],backgroundColor:C.palette,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:10,font:{size:10.5}}}}}});
  // ICT vs Security
  const ictF=qds.filter(x=>x.type==="ict").reduce((a,x)=>a+quarterFee(x),0);
  const secF=qds.filter(x=>x.type==="security").reduce((a,x)=>a+quarterFee(x),0);
  const tc=document.getElementById("mDashType");
  if(tc) window._mCharts.type=new Chart(tc,{type:"doughnut",data:{labels:["ICT","Security"],datasets:[{data:[ictF,secF],backgroundColor:["#7c3aed","#0d9488"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{usePointStyle:true,padding:12}}}}});
}

}

function exportMaintExcel(type){
  const p=MAINT_PROGRAMS[type]; const qd=getQuarter(type,_maintYear,_maintQ); const campuses=maintCampuses();
  if(!qd){ toast("No data","Nothing to export for this quarter","err"); return; }
  const header=["No.","Equipment",...campuses,"Unit Price","Equipment Total"];

  p.equipment.forEach((eq,i)=>{ const price=maintPrice(type,eq.id); let et=0;
    const row=[i+1,eq.name,...campuses.map(cp=>{ const q=maintQty(qd,eq.id,cp); const fee=q===""?"":q*price; if(fee!=="")et+=fee; return q===""?"":q; }),price,et||""];

  const ws=XLSX.utils.aoa_to_sheet(aoa);

/* ---------------- Import historical workbook data ---------------- */
function importMaintWorkbook(input,type){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  const KEYWORDS={
    computer:["computer"],server:["server"],wifi:["wifi","wi-fi","switch","router"],
    fingerprint:["fingerprint"],printer:["printer"],
    cctv:["cctv"],projector:["projector"],accessdoor:["access"],firealarm:["fire"],pasystem:["pa system","p.a","public address","pa "],ups:["ups"]
  };
  const matchEq=(itemName)=>{
    const a=itemName.toLowerCase();
    return MAINT_PROGRAMS[type].equipment.find(e=>{
      const kws=KEYWORDS[e.id]||[e.name.toLowerCase()];
      return kws.some(k=>a.includes(k));
    });
  };
  reader.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    let imported=0, sheetsDone=0;
    wb.SheetNames.forEach(sn=>{
      const lower=sn.toLowerCase(); let q=0;
      if(lower.includes("jan")&&lower.includes("mar"))q=1;
      else if(lower.includes("apr")||lower.includes("april"))q=2;
      else if(lower.includes("jul"))q=3;
      else if(lower.includes("oct"))q=4;
      else if(lower.includes("jan-june")||lower.includes("jan-jun"))q=1;
      const ym=sn.match(/(\d{2,4})\s*$/); let year=ym?Number(ym[1]):0; if(year&&year<100)year=2000+year;
      if(!q||!year)return;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
      let hdrIdx=rows.findIndex(r=>r.some(c=>/Date\s*\/\s*Items\s*\/\s*Campus/i.test(String(c))));
      if(hdrIdx<0) hdrIdx=rows.findIndex(r=>r.some(c=>/^No\.?$/i.test(String(c).trim()))&&r.some(c=>MAINT_CAMPUSES_DEFAULT.includes(String(c).trim().toUpperCase())));
      if(hdrIdx<0)return;
      const hdr=rows[hdrIdx];
      const campusCols={}; hdr.forEach((c,ci)=>{ let name=String(c).trim().toUpperCase(); if(name==="CKD")name="CKD1"; if(MAINT_CAMPUSES_DEFAULT.includes(name))campusCols[ci]=name; });
      if(!Object.keys(campusCols).length)return;
      const qd=ensureQuarter(type,year,q); qd.matrix=qd.matrix||{};
      for(let ri=hdrIdx+1;ri<rows.length;ri++){
        const row=rows[ri]; const itemName=String(row[1]||"").replace(/\(qty\)/i,"").trim();
        if(!itemName||/prepared|checked|verified|date:|officer|manager|president/i.test(itemName))continue;
        const eq=matchEq(itemName); if(!eq)continue;
        qd.matrix[eq.id]=qd.matrix[eq.id]||{};
        Object.entries(campusCols).forEach(([ci,cp])=>{ const v=row[ci]; if(v!==""&&v!=null&&!isNaN(v)){ qd.matrix[eq.id][cp]=Number(v); imported++; } });
      }
      sheetsDone++;
    });
    saveDB(); renderMaintenance(); toast("Import complete",sheetsDone+" quarter(s), "+imported+" values imported","ok");
  }catch(err){ console.error(err); toast("Import failed","Could not read workbook","err"); } };
  reader.readAsArrayBuffer(f); input.value="";
}

function acUnitFields(kind){
  // returns [ [label,name,type,options?], ... ]
  const common=[["Asset ID","assetId"],["Campus","campus","sel",acCampuses()],["Building","building"],["Brand","brand"],["Model","model"],["Serial Number","serial"]];
  if(kind==="split") return [...common,["Floor","floor"],["Room / Location","location"],["Department","department"],["Cooling Capacity (BTU/h or HP)","capacity"],["Indoor Unit No.","indoorNo"],["Outdoor Unit No.","outdoorNo"],
    ["Installation Date","installDate","date"],["Warranty Expiry","warranty","date"],["Maintenance Provider","provider"],["Assigned Technician","technician"],
    ["Maintenance Frequency","frequency","sel",AC_FREQ],["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],
    ["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
  if(kind==="vrf-out") return [["System ID","systemId"],...common,["Installation Location","location"],["Capacity (HP or kW)","capacity"],["Refrigerant Type","refrigerant"],
    ["Connected Indoor Units","indoorCount","number"],["Installation Date","installDate","date"],["Warranty Expiry","warranty","date"],["Maintenance Provider","provider"],["Assigned Technician","technician"],
    ["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
  // vrf-in
  return [["Indoor Unit ID","assetId"],["Campus","campus","sel",acCampuses()],["Building","building"],["Floor","floor"],["Room / Location","location"],
    ["Indoor Unit Type","indoorType"],["Brand","brand"],["Model","model"],["Serial Number","serial"],["Capacity (BTU/h or kW)","capacity"],["Controller Type","controller"],
    ["Installation Date","installDate","date"],["Last Maintenance","lastMaint","date"],["Next Maintenance","nextMaint","date"],["Condition","condition","sel",AC_CONDITIONS],["Operational Status","opStatus","sel",AC_OP_STATUS]];
}
function openACUnitForm(kind,id,extra){
  extra=extra||{};
  const u=id?DB.acUnits.find(x=>x.id===id):null;
  const fields=acUnitFields(kind);
  const titleMap={"split":"Single Split AC","vrf-out":"VRF Outdoor System","vrf-in":"VRF Indoor Unit"};
  const fieldHTML=([lbl,name,type,opts])=>{
    const val=u?u[name]:"";
    if(type==="sel") return `<div class="field"><label>${lbl}</label><select id="acf_${name}">${(opts||[]).map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join("")}</select></div>`;
    if(type==="date") return `<div class="field"><label>${lbl}</label><input type="date" id="acf_${name}" value="${val||''}"></div>`;
    if(type==="number") return `<div class="field"><label>${lbl}</label><input type="number" id="acf_${name}" value="${val!=null&&val!==''?val:''}"></div>`;
    return `<div class="field"><label>${lbl}</label><input id="acf_${name}" value="${val!=null?esc(val):''}"></div>`;
  };
  openModal(`<div class="modal-head"><h3>${id?"Edit":"Add"} ${titleMap[kind]}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><div class="form-grid">${fields.map(fieldHTML).join("")}
    <div class="field full"><label>Remarks</label><textarea id="acf_remarks" rows="2">${esc(u?.remarks||'')}</textarea></div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveACUnit('${kind}',${id?`'${id}'`:'null'},'${extra.parentId||''}')">Save</button></div>`,{size:"wide"});
}
function saveACUnit(kind,id,parentId){
  const fields=acUnitFields(kind);
  const g=n=>{const el=document.getElementById("acf_"+n);return el?el.value:"";};
  const first=fields[0][1];
  if(!g(first).trim()){ toast(fields[0][0]+" is required","","err"); return; }
  const obj=id?DB.acUnits.find(x=>x.id===id):{id:uid(),kind,created:Date.now(),history:[]};
  fields.forEach(([_,name,type])=>{ obj[name]=type==="number"?(g(name)===""?"":Number(g(name))):g(name); });
  obj.remarks=g("remarks").trim();
  obj.kind=kind;
  if(parentId) obj.parentId=parentId;
  obj.updated=Date.now();
  if(!id){ DB.acUnits.push(obj); toast("Unit registered","","ok"); }
  else toast("Unit updated","","ok");
  saveDB(); closeModal(); buildNav();
  paintAC(kind==="vrf-out"||kind==="vrf-in"?"vrf":"split");
}
function deleteACUnit(id){
  const u=DB.acUnits.find(x=>x.id===id);
  const kids=DB.acUnits.filter(x=>x.parentId===id);
  const msg=kids.length?`This VRF system has ${kids.length} indoor unit(s) which will also be removed.`:"This unit and its maintenance history will be removed.";
  confirmModal("Delete AC unit?",msg,()=>{
    DB.acUnits=DB.acUnits.filter(x=>x.id!==id&&x.parentId!==id);
    saveDB(); buildNav(); paintAC(u.kind==="split"?"split":"vrf"); toast("Deleted","","ok");
  },"Delete");
}
function viewACHistory(unitId){
  const u=DB.acUnits.find(x=>x.id===unitId);
  const recs=DB.acRecords.filter(r=>r.unitId===unitId).sort((a,b)=>(b.plannedDate||"").localeCompare(a.plannedDate||""));
  openModal(`<div class="modal-head"><h3>Maintenance History — ${esc(u.assetId||u.systemId||"Unit")}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">${recs.length?`<div class="table-card"><table class="data" style="width:100%"><thead><tr><th>Date</th><th>Category</th><th>Technician</th><th class="num">Cost</th><th>Status</th></tr></thead>
    <tbody>${recs.map(r=>`<tr><td>${fmtDateUS(r.actualDate||r.plannedDate)}</td><td>${esc(r.category||"")}</td><td>${esc(r.technician||"—")}</td><td class="num">${usdc(acRecordCost(r))}</td><td>${acStatusBadge(r.status)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty"><p>No maintenance records for this unit yet.</p></div>'}</div>
  <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal();openACRecordForm(null,'${unitId}')">+ Add Record</button><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`,{size:"wide"});

      const byUnit={};

      if(!keys.length)return `<tr><td colspan="13"><div class="empty"><h4>No scheduled maintenance for ${_acYear}</h4><p>Click “Schedule / Add Record”.</p></div></td></tr>`;

function saveACRecord(id,checklistLen){
  const g=n=>{const el=document.getElementById("acr_"+n);return el?el.value:"";};
  const num=v=>v===""||v==null||isNaN(v)?"":Math.max(0,Number(v));
  const checklist={};
  for(let i=0;i<checklistLen;i++){ const res=document.getElementById("acc_"+i)?.value||"—"; const cm=document.getElementById("acc_c_"+i)?.value||""; if(res!=="—"||cm)checklist[i]={result:res,comment:cm}; }
  const obj=id?DB.acRecords.find(x=>x.id===id):{id:uid(),created:Date.now(),createdBy:(SESSION&&SESSION.name)||"System"};
  Object.assign(obj,{recId:g("recId"),acType:g("acType"),unitId:g("unitId"),month:Number(g("month"))||_acMonth,year:Number(g("year"))||_acYear,
    category:g("category"),campus:g("campus").trim(),location:g("location").trim(),assetId:g("assetId").trim(),
    plannedDate:g("plannedDate"),actualDate:g("actualDate"),provider:g("provider").trim(),technician:g("technician").trim(),
    qtyPlanned:num(g("qtyPlanned")),qtyServiced:num(g("qtyServiced")),laborCost:num(g("laborCost")),materialCost:num(g("materialCost")),
    partsCost:num(g("partsCost")),otherCost:num(g("otherCost")),status:g("status"),conditionAfter:g("conditionAfter"),followup:g("followup"),
    nextDate:g("nextDate"),techSign:g("techSign").trim(),supervisor:g("supervisor").trim(),findings:g("findings").trim(),action:g("action").trim(),
    parts:g("parts").trim(),remarks:g("remarks").trim(),checklist,updated:Date.now(),updatedBy:(SESSION&&SESSION.name)||"System"});
  // sync unit last/next maintenance
  if(obj.unitId){ const u=DB.acUnits.find(x=>x.id===obj.unitId); if(u){ if(obj.actualDate)u.lastMaint=obj.actualDate; if(obj.nextDate)u.nextMaint=obj.nextDate; if(obj.conditionAfter)u.condition=obj.conditionAfter; } }
  if(!id){ DB.acRecords.push(obj); toast("Record saved","","ok"); } else toast("Record updated","","ok");
  saveDB(); closeModal(); buildNav(); renderMaintenance();
}

}

function acReportMonthly(){

function acReportOverdue(){ const recs=DB.acRecords.filter(acIsOverdue); acReportWindow("AC Pending & Overdue",`<table><thead><tr><th>Record</th><th>Asset</th><th>Campus</th><th>Planned</th><th>Status</th></tr></thead><tbody>${recs.map(r=>`<tr><td>${esc(r.recId||"")}</td><td>${esc(r.assetId||"")}</td><td>${esc(r.campus||"")}</td><td>${fmtDateUS(r.plannedDate)}</td><td>${esc(r.status)}</td></tr>`).join("")||'<tr><td colspan="5">None</td></tr>'}</tbody></table>`); }
function acReportCampus(){ const rows=acCampuses().map(cp=>{const rs=DB.acRecords.filter(r=>r.campus===cp&&r.year===_acYear);const done=rs.filter(r=>r.status==="Completed").length;const cost=rs.reduce((a,r)=>a+acRecordCost(r),0);return `<tr><td>${cp}</td><td class="n">${rs.length}</td><td class="n">${done}</td><td class="n">${rs.length?Math.round(done/rs.length*100):0}%</td><td class="n">$${cost.toFixed(2)}</td></tr>`;}).join(""); acReportWindow(`AC Maintenance by Campus — ${_acYear}`,`<table><thead><tr><th>Campus</th><th>Total</th><th>Completed</th><th>%</th><th>Cost</th></tr></thead><tbody>${rows}</tbody></table>`); }
function acReportHistory(){ const rows=DB.acRecords.slice().sort((a,b)=>(b.actualDate||"").localeCompare(a.actualDate||"")).map(r=>`<tr><td>${esc(r.assetId||"")}</td><td>${esc(r.acType||"")}</td><td>${fmtDateUS(r.actualDate||r.plannedDate)}</td><td>${esc(r.category||"")}</td><td>${esc(r.technician||"")}</td><td>${esc(r.status)}</td></tr>`).join(""); acReportWindow("AC Equipment Service History",`<table><thead><tr><th>Asset</th><th>Type</th><th>Date</th><th>Category</th><th>Technician</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No history</td></tr>'}</tbody></table>`); }
function acReportCM(){ const rows=DB.acCorrective.map(c=>`<tr><td>${esc(c.cmId||"")}</td><td>${esc(c.assetId||"")}</td><td>${esc(c.fault||"")}</td><td>${esc(c.priority||"")}</td><td>${esc(c.stage||"")}</td><td class="n">${c.downtime||""}</td><td class="n">$${(Number(c.repairCost)||0).toFixed(2)}</td></tr>`).join(""); acReportWindow("AC Corrective / Repair Report",`<table><thead><tr><th>CM ID</th><th>Asset</th><th>Fault</th><th>Priority</th><th>Stage</th><th>Downtime(h)</th><th>Cost</th></tr></thead><tbody>${rows||'<tr><td colspan="7">None</td></tr>'}</tbody></table>`); }
function acReportAnnual(){ const rows=AC_MONTHS.map((m,i)=>{const rs=DB.acRecords.filter(r=>r.year===_acYear&&r.month===i+1);const cost=rs.reduce((a,r)=>a+acRecordCost(r),0);return `<tr><td>${m}</td><td class="n">${rs.length}</td><td class="n">${rs.filter(r=>r.status==="Completed").length}</td><td class="n">$${cost.toFixed(2)}</td></tr>`;}).join(""); acReportWindow(`AC Annual Maintenance — ${_acYear}`,`<table><thead><tr><th>Month</th><th>Services</th><th>Completed</th><th>Cost</th></tr></thead><tbody>${rows}</tbody></table>`); }

let _conCoverData="";
function handleConstructionCover(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{ _conCoverData=e.target.result; const pv=document.getElementById("cf_coverPreview"); if(pv){ pv.style.backgroundImage=`url('${_conCoverData}')`; pv.style.backgroundSize="cover"; pv.style.backgroundPosition="center"; pv.style.width="100%"; pv.style.height="120px"; pv.style.borderRadius="8px"; pv.innerHTML=""; } };
  reader.readAsDataURL(file);
}
function saveConstruction(id){
  const g=n=>{ const el=document.getElementById("cf_"+n); return el?el.value:""; };
  const name=g("name").trim(); if(!name){ toast("Project name is required","","err"); return; }
  const num=v=>Number(v)||0;
  if(id){
    const p=conProject(id);
    Object.assign(p,{name,code:g("code").trim(),location:g("location"),type:g("type"),pm:g("pm").trim(),
      contractor:g("contractor").trim(),consultant:g("consultant").trim(),contractAmount:num(g("contractAmount")),
      approvedBudget:num(g("approvedBudget")),startDate:g("startDate"),plannedEnd:g("plannedEnd"),actualEnd:g("actualEnd"),
      progress:num(g("progress")),plannedProgress:num(g("plannedProgress")),status:g("status"),stage:g("stage"),
      priority:g("priority"),latestUpdate:g("latestUpdate").trim(),description:g("description").trim(),
      cover:_conCoverData||p.cover,updatedBy:(SESSION&&SESSION.name)||"System",updated:Date.now()});
    p.history=p.history||[]; p.history.push({by:(SESSION&&SESSION.name)||"System",at:Date.now(),action:"Project details updated"});
    toast("Project updated","","ok");
  } else {
    const np=newConstructionProject({name,code:g("code").trim(),location:g("location"),type:g("type"),pm:g("pm").trim(),
      contractor:g("contractor").trim(),consultant:g("consultant").trim(),contractAmount:num(g("contractAmount")),
      approvedBudget:num(g("approvedBudget")),startDate:g("startDate"),plannedEnd:g("plannedEnd"),actualEnd:g("actualEnd"),
      progress:num(g("progress")),plannedProgress:num(g("plannedProgress")),status:g("status"),stage:g("stage"),
      priority:g("priority"),latestUpdate:g("latestUpdate").trim(),description:g("description").trim(),cover:_conCoverData});
    DB.construction.unshift(np); toast("Project created","","ok");
  }
  _conCoverData=""; saveDB(); closeModal();
  if(_conProjectId) openConstructionProject(_conProjectId); else renderConstruction();
}
function deleteConstruction(id){
  if(!isSuper()){ toast("Permission denied","Only Super Admin can delete projects","err"); return; }
  const p=conProject(id);
  confirmModal("Delete project?",`"${esc(p.name)}" and all its records will be permanently removed.`,()=>{ DB.construction=DB.construction.filter(x=>x.id!==id); saveDB(); renderConstruction(); toast("Project deleted","","ok"); },"Delete");
}

/* ----- Overview tab (PM dashboard) ----- */
function conFinancials(p){
  const approvedVO=(p.variations||[]).filter(v=>/approv/i.test(v.status||"")).reduce((a,v)=>a+(Number(v.amount)||0),0);
  const pendingVO=(p.variations||[]).filter(v=>/pend/i.test(v.status||"")).reduce((a,v)=>a+(Number(v.amount)||0),0);
  const revised=(Number(p.contractAmount)||0)+approvedVO;
  const certified=(p.payments||[]).reduce((a,c)=>a+(Number(c.net)||0),0);
  const remaining=revised-certified;
  const budgetUsed=p.approvedBudget?Math.round(certified/p.approvedBudget*100):0;
  return {approvedVO,pendingVO,revised,certified,remaining,budgetUsed};
}

    ${kpi((sv>0?"+":"")+sv+"%","Schedule Variance",sv<0?"#dc2626":"#059669")}
    ${kpi(money(p.contractAmount).replace(/\.00$/,""),"Contract Amount")}
    ${kpi(money(fin.approvedVO).replace(/\.00$/,""),"Approved Variations","#0d9488")}
    ${kpi(money(fin.revised).replace(/\.00$/,""),"Revised Contract","#2563eb")}
    ${kpi(money(fin.certified).replace(/\.00$/,""),"Certified Payments","#059669")}
    ${kpi(money(fin.remaining).replace(/\.00$/,""),"Remaining Balance",fin.remaining<0?"#dc2626":"")}
    ${kpi(fin.budgetUsed+"%","Budget Used",fin.budgetUsed>100?"#dc2626":"#2563eb")}
    ${kpi(openRFI,"Open RFIs",openRFI?"#d97706":"#059669")}
    ${kpi(pendSub,"Pending Submittals",pendSub?"#d97706":"#059669")}
    ${kpi(openDef,"Open Defects",openDef?"#dc2626":"#059669")}
    ${kpi(hiIssues,"High-Priority Issues",hiIssues?"#dc2626":"#059669")}
    ${kpi(incidents,"Safety Incidents",incidents?"#dc2626":"#059669")}
  </div>
  <div class="charts-grid" style="margin-top:18px">
    <div class="card"><div class="card-head"><h3>Planned vs Actual Progress</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="conPvAChart"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h3>Budget vs Certified</h3></div><div class="card-body"><div class="chart-wrap"><canvas id="conBudgetChart"></canvas></div></div></div>
  </div>

    <div class="form-grid" style="gap:10px">

async function saveWBS(wid){
  const p=conProject(_conProjectId);
  const g=n=>{ const el=document.getElementById("wf_"+n); return el?el.value:""; };
  const name=g("name").trim(); if(!name){ toast("Activity name is required","","err"); return; }
  const num=v=>Number(v)||0;
  const fileRefs=await persistStagedFiles(_conStagedFiles);
  const obj={code:g("code").trim(),name,responsible:g("responsible").trim(),pStart:g("pStart"),pFinish:g("pFinish"),aStart:g("aStart"),aFinish:g("aFinish"),weight:num(g("weight")),planned:num(g("planned")),actual:num(g("actual")),status:g("status"),priority:g("priority"),dependency:g("dependency").trim(),remark:g("remark").trim(),files:fileRefs};
  if(wid){ Object.assign(p.wbs.find(x=>x.id===wid),obj); toast("Activity updated","","ok"); }
  else { obj.id=uid(); p.wbs.push(obj); toast("Activity added","","ok"); }
  _conStagedFiles=[];
  recomputeConstructionProgress(p);
  saveDB(); closeModal(); paintConstructionTabBody();
}
function deleteWBS(wid){
  const p=conProject(_conProjectId);
  confirmModal("Delete activity?","",()=>{ p.wbs=p.wbs.filter(x=>x.id!==wid); recomputeConstructionProgress(p); saveDB(); paintConstructionTabBody(); toast("Deleted","","ok"); },"Delete");
}
function recomputeConstructionProgress(p){
  const tw=p.wbs.reduce((a,w)=>a+(Number(w.weight)||0),0);
  if(tw>0){
    p.progress=Math.round(p.wbs.reduce((a,w)=>a+(Number(w.weight)||0)*(Number(w.actual)||0)/100,0)/tw*100);
    p.plannedProgress=Math.round(p.wbs.reduce((a,w)=>a+(Number(w.weight)||0)*(Number(w.planned)||0)/100,0)/tw*100);
  }
}

let _recSearch="";
function openRecordTabForm(tab,rid){
  const p=conProject(_conProjectId); const cfg=PROJECT_RECORD_TABS[tab];
  const r=rid?p[tab].find(x=>x.id===rid):null;
  _conStagedFiles=r&&r.files?JSON.parse(JSON.stringify(r.files)):[];
  const field=fdef=>{ const [k,lbl,type]=fdef; const val=r?r[k]:""; 
    if(type===2) return `<div class="field"><label>${lbl}</label><input type="date" id="rf_${k}" value="${val||''}"></div>`;
    if(type===1) return `<div class="field"><label>${lbl} (USD)</label><input type="number" step="0.01" id="rf_${k}" value="${val!=null&&val!==''?val:''}"></div>`;
    return `<div class="field"><label>${lbl}</label><input id="rf_${k}" value="${val!=null?esc(val):''}"></div>`; };
  openModal(`<div class="modal-head"><h3>${rid?"Edit":"Add"} ${cfg.title}</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

      <label class="file-drop" style="cursor:pointer"><input type="file" multiple style="display:none" onchange="conStageFiles(this)">
        <div style="font-weight:600;font-size:13px">Click to upload files</div><div class="muted" style="font-size:11.5px">You can attach multiple documents</div></label>
      <div class="file-list" id="conFileList" style="margin-top:8px"></div>
    </div>
  </div></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveRecordTab('${tab}',${rid?`'${rid}'`:'null'})">Save</button></div>`,{size:"wide"});
  renderConStagedFiles();
}
let _conStagedFiles=[];
function conStageFiles(input){
  Array.from(input.files).forEach(f=>{
    if(f.size>FILE_WARN_BYTES){ toast("Large file",`"${f.name}" is ${fileSizeLabel(f.size)}. It will still upload, but may use a lot of browser storage.`,"warn",6000); }
    const reader=new FileReader();
    reader.onload=e=>{ _conStagedFiles.push({name:f.name,size:f.size,type:f.type,data:e.target.result}); renderConStagedFiles(); };
    reader.readAsDataURL(f);
  });
  input.value="";
}
function renderConStagedFiles(){
  const host=document.getElementById("conFileList"); if(!host)return;
  if(!_conStagedFiles.length){ host.innerHTML='<span class="muted" style="font-size:12px">No files attached yet.</span>'; return; }
  host.innerHTML=_conStagedFiles.map((f,i)=>`<div class="file-chip" style="display:inline-flex;align-items:center;gap:6px">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
    <span>${esc(f.name)}</span>
    <button class="act-btn" style="padding:1px" onclick="_conStagedFiles.splice(${i},1);renderConStagedFiles()" title="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>`).join("");
}
async function saveRecordTab(tab,rid){
  const p=conProject(_conProjectId); const cfg=PROJECT_RECORD_TABS[tab]; p[tab]=p[tab]||[];
  const fileRefs=await persistStagedFiles(_conStagedFiles);
  const obj={notes:(document.getElementById("rf_notes").value||"").trim(),files:fileRefs};
  cfg.fields.forEach(f=>{ const el=document.getElementById("rf_"+f[0]); obj[f[0]]=f[2]===1?(Number(el.value)||0):el.value; });
  if(rid){ Object.assign(p[tab].find(x=>x.id===rid),obj); toast("Updated","","ok"); }
  else { obj.id=uid(); obj.created=Date.now(); obj.createdBy=(SESSION&&SESSION.name)||"System"; p[tab].push(obj); toast("Added","","ok"); }
  _conStagedFiles=[]; saveDB(); closeModal(); paintConstructionTabBody();
}
function deleteRecordTab(tab,rid){
  const p=conProject(_conProjectId);
  confirmModal("Delete record?","",()=>{ p[tab]=p[tab].filter(x=>x.id!==rid); saveDB(); paintConstructionTabBody(); toast("Deleted","","ok"); },"Delete");
}
async function viewRecordFiles(tab,rid){
  const p=conProject(_conProjectId); const r=p[tab].find(x=>x.id===rid); const files=r.files||[];
  const isImg=f=>/^image\//.test(f.type||"");
  // resolve each file's data (from IndexedDB or legacy inline)
  const datas=[]; for(const f of files){ datas.push(await resolveFileData(f)); }
  openModal(`<div class="modal-head"><h3>Attachments (${files.length})</h3><button class="act-btn" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>

    ${isImg(f)&&datas[i]?`<img src="${datas[i]}" style="width:48px;height:48px;object-fit:cover;border-radius:6px">`:`<div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg></div>`}
    <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div><div class="muted" style="font-size:11px">${f.size?(Math.round(f.size/1024)+" KB"):""}</div></div>
    ${datas[i]?`<a class="btn btn-ghost btn-sm" href="${datas[i]}" download="${esc(f.name)}">Download</a>`:'<span class="muted" style="font-size:11px">unavailable</span>'}
  </div>`).join("")}</div>`:'<div class="empty"><p>No files.</p></div>'}</div>
  <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal();openRecordTabForm('${tab}','${rid}')">Edit / Add Files</button><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`,{size:"wide"});
}

function getReportData(){
  const type=document.getElementById("rp_type").value;
  const campus=document.getElementById("rp_campus").value;
  const status=document.getElementById("rp_status").value;
  const start=document.getElementById("rp_start").value;
  const end=document.getElementById("rp_end").value;
  const by=document.getElementById("rp_by").value;
  let recs = type==="all"?allRecords():DB[type].map(r=>({...r,_set:type}));
  recs=recs.filter(r=>{
    if(campus&&r.campus!==campus)return false;
    const st=isOverdue(r)?"Overdue":r.status; if(status&&st!==status)return false;
    if(start&&r.due&&r.due<start)return false;
    if(end&&r.due&&r.due>end)return false;
    return true;
  });
  return {type,campus,status,start,end,by,recs};
}

    </div>

    <div style="display:flex;gap:10px;margin-bottom:12px">
      <div style="flex:1;background:#f1f3f7;border-radius:6px;padding:8px"><div style="font-size:9px;color:#697586">RECORDS</div><div style="font-size:16px;font-weight:800">${d.recs.length}</div></div>
      <div style="flex:1;background:#f1f3f7;border-radius:6px;padding:8px"><div style="font-size:9px;color:#697586">TOTAL BUDGET</div><div style="font-size:16px;font-weight:800">${money(total)}</div></div>
      <div style="flex:1;background:#f1f3f7;border-radius:6px;padding:8px"><div style="font-size:9px;color:#697586">COMPLETED</div><div style="font-size:16px;font-weight:800">${money(completed)}</div></div>
    </div>
    <div style="font-size:11px;margin-bottom:8px"><b>Status summary:</b> ${Object.entries(stCount).map(([k,v])=>`${k}: ${v}`).join(" &nbsp;•&nbsp; ")||"None"}</div>
    <table><thead><tr><th>#</th><th>Item</th><th>Campus</th><th>PR/PO</th><th>Supplier</th><th>Budget</th><th>Status</th><th>Due</th></tr></thead><tbody>

    <div style="margin-top:10px;font-size:11px;text-align:right"><b>Total: ${money(total)}</b></div>

  </div>`;
}

function downloadReportPDF(){
  const d=window._lastReport||getReportData();

  doc.setFontSize(13); doc.setTextColor(40); doc.text((d.type==="all"?"Consolidated":d.type)+" Report",40,100);

  doc.setFontSize(9); doc.setTextColor(90); doc.text(`Range: ${range}${d.campus?" | Campus: "+d.campus:""}${d.status?" | Status: "+d.status:""}`,40,114);
  doc.setFontSize(10); doc.setTextColor(40);
  doc.text(`Records: ${d.recs.length}    Total Budget: ${money(total)}    Completed: ${money(completed)}`,40,132);
  doc.autoTable({startY:142,head:[["#","Item","Campus","PR/PO","Supplier","Budget","Status","Due"]],
    body:d.recs.map((r,i)=>[i+1,r.name,r.campus||"—",`${r.pr||""}/${r.po||""}`,r.supplier||"—",money(r.budget),isOverdue(r)?"Overdue":r.status,r.due?fmtDate(r.due).replace(/&mdash;/,"—"):"—"]),
    styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[91,95,239]},alternateRowStyles:{fillColor:[245,246,250]},margin:{left:40,right:40}});
  let y=doc.lastAutoTable.finalY+14; doc.setFontSize(10); doc.text(`Total: ${money(total)}`,40,y);

  doc.save(`report-${Date.now()}.pdf`);
  toast("PDF downloaded","Report generated","ok");
}

function renderBackup(){
  const used=dbStorageBytes(); const usedMB=(used/1024/1024).toFixed(2);
  const pct=Math.min(100,Math.round(used/(5*1024*1024)*100)); // browsers typically allow ~5 MB
  const barColor=pct>85?"#dc2626":pct>65?"#d97706":"#059669";
  document.getElementById("content").innerHTML=`
    <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Browser Storage Usage</h3></div><div class="card-body">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>${usedMB} MB used</span><span class="muted">~5 MB typical limit · ${pct}%</span></div>
      <div style="height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${barColor}"></div></div>
